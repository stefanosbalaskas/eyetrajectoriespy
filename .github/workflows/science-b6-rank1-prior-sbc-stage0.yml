name: science-b6-rank1-prior-sbc-stage0

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_b6_rank1_prior_sbc_pilot.py"
      - "tests/test_b6_rank1_prior_sbc_pilot.py"
      - ".github/workflows/science-b6-rank1-prior-sbc-stage0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbc-contracts:
    name: Rank-SBC, denominator and seeded-tie contracts Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,bayesian]"
      - run: python -m pytest -q tests/test_b6_rank1_prior_sbc_pilot.py

  actual-prior-sbc-pilot:
    name: Fresh B6 rank-one four-chain posterior sample replicate ${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        rep: [0,1,2,3]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTENSOR_FLAGS: "cxx="
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,bayesian-pymc]"
      - name: Exact rank/denominator/failure protocols
        run: python -m pytest -q tests/test_b6_rank1_prior_sbc_pilot.py
      - name: Actual matched-prior NUTS posterior
        run: |
          python scripts/run_b6_rank1_prior_sbc_pilot.py \
            --replicate ${{ matrix.rep }} --master-seed 20261227 \
            --out build/b6-sbc-stage0/replicate-${{ matrix.rep }}
      - name: Retain rank histograms, uncertainty, failures and original hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b6-sbc-stage0-replicate-${{ matrix.rep }}
          path: build/b6-sbc-stage0/replicate-${{ matrix.rep }}/
          retention-days: 90
          if-no-files-found: warn

  denominator-audit:
    name: Verify four prior-generated datasets and include all fit failures
    needs: actual-prior-sbc-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,bayesian]"
      - uses: actions/download-artifact@v4
        with:
          pattern: b6-sbc-stage0-replicate-*
          path: build/original
      - name: Independent-dataset denominators, checksums and pilot precision
        run: |
          python - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path
          from scripts.run_b6_rank1_prior_sbc_pilot import summarize_primary
          root=Path("build/original")
          rows=[]
          for rep in range(4):
              folder=root/f"b6-sbc-stage0-replicate-{rep}"
              assert folder.is_dir(),f"missing original attempt {rep}"
              for line in (folder/"SHA256SUMS").read_text().splitlines():
                  digest,path=line.split("  ")
                  assert sha256((folder/path).read_bytes()).hexdigest()==digest
              cases=json.loads((folder/"cases.json").read_text())
              ledger=json.loads((folder/"evidence.json").read_text())
              assert len(cases)==1
              assert ledger["attempted_this_artifact"]==1
              assert not ledger["prior_predictive_90pct_coverage_qualified"]
              rows.extend(cases)
          assert len(rows)==4 and len({r["generation_seed"] for r in rows})==4
          report=summarize_primary(rows)
          assert report["independent_dataset_attempts"]==4
          assert not report["posterior_calibration_qualified"]
          (Path("build")/"prior_sbc_stage0_summary.json").write_text(
              json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("FOUR FRESH PRIOR-SBC DATASETS:",json.dumps(report,sort_keys=True))
          assert report["failed_fits"]==0,"Pilot failure retained, no qualifying coverage claim"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b6-sbc-stage0-failure-inclusive-aggregate
          path: build/prior_sbc_stage0_summary.json
          retention-days: 90
          if-no-files-found: warn
