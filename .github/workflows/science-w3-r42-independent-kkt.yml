name: science-w3-r42-independent-two-stage-kkt
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r42_independent_kkt_validation.py"
      - "tests/test_w3_r42_independent_kkt_validation.py"
      - "docs/development/w3-r42-independent-kkt-protocol.md"
      - ".github/workflows/science-w3-r42-independent-kkt.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-independent-source-and-all-stage-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r42_independent_kkt_validation.py
  original-8-independent-primitive-blocks-576-fits:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r42_independent_kkt_validation.py --out build/w3-r42-original-independent-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r42-new-independent-source-original-numerical-ledger
          path: build/w3-r42-original-independent-source/
          if-no-files-found: warn
          retention-days: 90
