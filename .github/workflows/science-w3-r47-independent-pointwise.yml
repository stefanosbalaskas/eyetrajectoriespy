name: science-w3-r47-independent-pointwise-calibration
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r47_independent_pointwise_audit.py"
      - "tests/test_w3_r47_independent_pointwise_audit.py"
      - "docs/development/w3-r47-independent-pointwise-protocol.md"
      - ".github/workflows/science-w3-r47-independent-pointwise.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-source-MAR-observability-and-Wilson-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r47_independent_pointwise_audit.py
  original-256-independent-sources-40448-refit-attempts:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r47_independent_pointwise_audit.py --out build/w3-r47-original-pointwise
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r47-independent-source-pointwise-original-ledger
          path: build/w3-r47-original-pointwise/
          if-no-files-found: warn
          retention-days: 90
