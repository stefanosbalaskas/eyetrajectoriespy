name: science-w3-r85-validation-bias
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r85_validation_bias.py"
      - "tests/test_w3_r85_validation_bias.py"
      - "docs/development/w3-r85-prospective-validation-ascertainment-bias.md"
      - ".github/workflows/science-w3-r85-validation-bias.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-recorded-and-latent-recovery-propensity-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Validate frozen new synthetic complete/MCAR/MAR/MNAR source laws, native NaN refusal and honest pointwise rank/anchor gates
        run: python -m pytest -q tests/test_w3_r85_validation_bias.py

  eight-new-selection-bias-source-shards:
    needs: frozen-recorded-and-latent-recovery-propensity-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 0, stop: 4}
          - {start: 4, stop: 8}
          - {start: 8, stop: 12}
          - {start: 12, stop: 16}
          - {start: 16, stop: 20}
          - {start: 20, stop: 24}
          - {start: 24, stop: 28}
          - {start: 28, stop: 32}
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Generate 256 new independent true source cases evaluated under complete/MCAR/MAR/MNAR masks with no inference claims
        run: python -m scripts.run_w3_r85_validation_bias --start ${{ matrix.start }} --stop ${{ matrix.stop }} --out build/R85-source/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r85-original-validation-shard-${{ matrix.start }}
          path: build/R85-source/
          if-no-files-found: warn
          retention-days: 90

  immutable-256source-2560selection-aggregate:
    needs:
      - frozen-recorded-and-latent-recovery-propensity-contracts
      - eight-new-selection-bias-source-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: w3-r85-original-validation-shard-*
          path: build/R85-all-source-shards/
          merge-multiple: false
      - name: Verify 256 original source conditions, 512 MAR/MNAR masks and 2560 ascertainment strategy rows with SHA256
        run: python -m scripts.run_w3_r85_validation_bias --merge-parts build/R85-all-source-shards/ --out build/R85-original-immutable/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r85-original-256source-2560selection-strategy-evidence
          path: build/R85-original-immutable/
          if-no-files-found: warn
          retention-days: 90
