name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and docs dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[docs,dev]"
      - name: Generate function-equation indexes
        run: python scripts/generate_function_equation_index.py
      - name: Commit exact generated equation indexes
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FUNCTION_EQUATION_INDEX.md docs/reference/function-equation-index.md
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate 41-contract equation indexes"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Generate deterministic documentation gallery
        run: python scripts/generate_docs_gallery.py
      - name: Validate documentation contracts
        run: python scripts/validate_docs_contracts.py
      - name: Build documentation strictly
        run: mkdocs build --strict
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: docs-build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
