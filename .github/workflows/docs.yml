name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-build:
    # Pinned until Playwright supports the newer ubuntu-latest browser image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and docs dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[docs,dev]"
          python -m pip install "zensical==0.0.72"
      - name: Check public release and workflow availability descriptions
        run: python scripts/validate_docs_release_surface.py
      - name: Execute scientific article examples
        run: python scripts/validate_docs_article_examples.py
      - name: Validate generated function-equation indexes
        run: python scripts/generate_function_equation_index.py --check
      - name: Generate deterministic documentation gallery
        run: python scripts/generate_docs_gallery.py
      - name: Audit post-0.12 public API surface
        run: python scripts/audit_public_api_surface.py --output build/public-api-1.0-audit.json
      - name: Validate documentation contracts
        run: python scripts/validate_docs_contracts.py
      - name: Run downloadable synthetic common-grid tutorial
        run: python docs/downloads/run_synthetic_gaze.py
      - name: Validate optional pandas table interoperability
        run: python scripts/validate_ecosystem_interop.py
      - name: Run complete-grid handoff example
        run: python examples/interop_tabular_handoff.py
      - name: Validate Eye-Tracking-BIDS read-only metadata profile
        run: python scripts/validate_eye_tracking_bids.py
      - name: Build documentation strictly
        run: mkdocs build --strict
      - name: Audit rendered links and fragments on all public documentation pages
        run: python scripts/audit_sitewide_links.py --strict --output build/sitewide-links.json
      - name: Audit the full-search index's critical pages
        run: python scripts/audit_search_corpus.py --strict --output build/site-search-corpus.json
      - name: Audit site discovery and citation metadata
        run: python scripts/audit_site_discoverability.py
      - name: Strict all-page local links and named fragments
        run: python scripts/audit_sitewide_links.py --strict
      - name: Strict research-intent search corpus
        run: python scripts/audit_search_corpus.py --strict
      # Preserve every existing MkDocs scientific-validation and search-corpus
      # contract above as a rollback baseline. Publish only the user's selected
      # genuine Zensical Modern build after route, search and axe qualification.
      - name: Build selected Zensical Modern documentation
        run: python scripts/build_zensical_modern.py --build
      - name: Audit selected site's 370 routes and all local fragments
        run: python scripts/audit_sitewide_links.py --strict --site build/zensical-modern --output build/zensical-modern-links.json
      - name: Install native-search and accessibility browser checks
        run: |
          python -m pip install "playwright==1.56.0"
          google-chrome --version
          npm --prefix build/site-accessibility install --no-save --no-package-lock axe-core@4.13.0
      - name: Qualify published Zensical design in 16 real browser views
        run: python scripts/audit_zensical_modern.py --baseline site --candidate build/zensical-modern
      - name: Replace publication artifact only after full qualification
        if: github.event_name != 'pull_request'
        run: |
          rm -rf site
          mv build/zensical-modern site
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: docs-build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
