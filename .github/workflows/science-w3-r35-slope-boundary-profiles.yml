name: science-w3-r35-slope-boundary-profiles
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r35_slope_boundary_profiles.py"
      - "tests/test_w3_r35_slope_boundary_profiles.py"
      - ".github/workflows/science-w3-r35-slope-boundary-profiles.yml"
      - "docs/development/w3-r35-slope-boundary-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-zero-reml-profile-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r35_slope_boundary_profiles.py
  original-eight-source-56profile-points:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r35_slope_boundary_profiles.py --out build/w3-r35-zero-boundary-profiles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r35-original-eight-source-boundary-profile
          path: build/w3-r35-zero-boundary-profiles/
          retention-days: 90
          if-no-files-found: warn
