name: site-quality

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check_docs_site.py"
      - "mkdocs.yml"
      - ".github/workflows/site-quality.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check_docs_site.py"
      - "mkdocs.yml"
      - ".github/workflows/site-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interactive-site-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JavaScript syntax
        run: node --check docs/javascripts/interactive-explorers.js
      - name: Verify controls, link targets, labels, image alternatives and teaching fixture
        run: python scripts/check_docs_site.py
