name: site-quality

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check_docs_site.py"
      - "scripts/audit_site_discoverability.py"
      - "mkdocs.yml"
      - ".github/workflows/site-quality.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check_docs_site.py"
      - "mkdocs.yml"
      - ".github/workflows/site-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interactive-site-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JavaScript syntax
        run: |
          node --check docs/javascripts/interactive-explorers.js
          node --check docs/javascripts/integration-navigator.js
          node --check docs/javascripts/accessibility-refinements.js
          node --check docs/javascripts/mathjax.js
          node --check docs/javascripts/gaze-data-readiness.js
          node --check docs/javascripts/method-sharing.js
      - name: Test integration discovery, link paths and scientific boundaries
        run: node scripts/test_integration_navigator.cjs
      - name: Test local-only gaze CSV structural auditor
        run: node scripts/test_gaze_data_readiness.cjs
      - name: Test bookmarkable method-selector URLs
        run: node scripts/test_method_sharing.cjs
      - name: Compile built-site integrity and search audit scripts
        run: python -m py_compile scripts/audit_sitewide_links.py scripts/audit_search_corpus.py scripts/compare_docs_builds.py
      - name: Compile site SEO, browser and accessibility inspection code
        run: python -m py_compile scripts/audit_site_discoverability.py scripts/site_browser_smoke.py scripts/site_accessibility.py
      - name: Verify controls, link targets, labels, image alternatives and teaching fixture
        run: python scripts/check_docs_site.py
