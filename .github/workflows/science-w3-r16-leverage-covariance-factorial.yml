name: science-w3-r16-leverage-covariance-factorial

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r16_leverage_covariance_factorial.py"
      - "tests/test_w3_r16_leverage_covariance_factorial.py"
      - ".github/workflows/science-w3-r16-leverage-covariance-factorial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-source-contracts:
    name: R16 original leverage and true Gaussian variance reference Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r16_leverage_covariance_factorial.py

  original-scientific-audit:
    name: R16 96 generating blocks × 2x2 factorial × participant size × two means
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Original failure-inclusive 2304 source/model case evaluation
        run: |
          python scripts/run_w3_r16_leverage_covariance_factorial.py \
            --out build/w3-r16-original
      - name: Retain complete source evidence, provenance SVG and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3-r16-original-factorial-leverage-covariance
          path: build/w3-r16-original/
          retention-days: 90
          if-no-files-found: warn
