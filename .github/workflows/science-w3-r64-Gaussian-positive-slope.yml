name: science-w3-r64-matched-zero-vs-positive-Gaussian-random-slope
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r64_nonzero_slope_detection_pilot.py"
      - "tests/test_w3_r64_nonzero_slope_detection_pilot.py"
      - ".github/workflows/science-w3-r64-Gaussian-positive-slope.yml"
      - "docs/development/w3-r64-matched-positive-slope-detection-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched-true-slope-and-failure-inclusive-Gaussian-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r64_nonzero_slope_detection_pilot.py

  matched-new-zero-half-full-Gaussian-source-shards:
    needs: matched-true-slope-and-failure-inclusive-Gaussian-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 0, stop: 4}
          - {start: 4, stop: 8}
          - {start: 8, stop: 12}
          - {start: 12, stop: 16}
          - {start: 16, stop: 20}
          - {start: 20, stop: 24}
          - {start: 24, stop: 28}
          - {start: 28, stop: 32}
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m scripts.run_w3_r64_nonzero_slope_detection_pilot --start ${{ matrix.start }} --stop ${{ matrix.stop }} --out build/R64-original-matched-shard/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r64-original-matched-positive-slope-source-${{ matrix.start }}
          path: build/R64-original-matched-shard/
          retention-days: 90
          if-no-files-found: warn

  original-matched-positive-slope-full-evidence-aggregation:
    needs:
      - matched-true-slope-and-failure-inclusive-Gaussian-contracts
      - matched-new-zero-half-full-Gaussian-source-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: w3-r64-original-matched-positive-slope-source-*
          path: build/R64-original-matched-parts/
          merge-multiple: false
      - run: python -m scripts.run_w3_r64_nonzero_slope_detection_pilot --merge-parts build/R64-original-matched-parts/ --out build/R64-original-matched-complete/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r64-complete-original-matched-positive-slope-evidence
          path: build/R64-original-matched-complete/
          if-no-files-found: warn
          retention-days: 90
