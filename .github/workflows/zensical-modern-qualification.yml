name: zensical-modern-qualification (non-deploying)

on:
  pull_request:
    paths:
      - "scripts/build_zensical_modern.py"
      - "scripts/audit_zensical_modern.py"
      - "docs/assets/site-design-zensical-modern.css"
      - ".github/workflows/zensical-modern-qualification.yml"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-rightmost-design-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install current documentation, pinned Zensical Modern and local browser audit
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[docs,dev]"
          python -m pip install "zensical==0.0.72" "playwright==1.56.0"
          python -m playwright install --with-deps chromium
          npm --prefix build/site-accessibility install --no-save --no-package-lock axe-core@4.13.0
      - name: Generate identical scientific figures
        run: python scripts/generate_docs_gallery.py
      - name: Strictly build existing Material baseline
        run: mkdocs build --strict
      - name: Build user-selected actual Zensical Modern design
        run: python scripts/build_zensical_modern.py --build
      - name: Verify every public route link and named fragment in selected design
        run: |
          python scripts/audit_sitewide_links.py --strict --site build/zensical-modern --output build/zensical-modern-links.json
      - name: Full browser parity including Zensical native search and axe
        run: python scripts/audit_zensical_modern.py
      - name: Retain screenshots and forensic results (never deploy from this workflow)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-zensical-modern-qualification
          path: |
            build/zensical-modern-evidence/
            build/zensical-modern-links.json
            .zensical-modern.generated.mkdocs.yml
          if-no-files-found: warn
          retention-days: 30
