name: sparse-bandwidth-selection-validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  known-truth-bandwidth-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Qualify audited sparse bandwidth selection against known truth
        run: |
          python scripts/run_sparse_bandwidth_selection_validation.py \
            --n-curves 60 \
            --output sparse-bandwidth-selection-validation.json
      - name: Upload bandwidth-selection evidence
        uses: actions/upload-artifact@v4
        with:
          name: sparse-bandwidth-selection-validation
          path: sparse-bandwidth-selection-validation.json
