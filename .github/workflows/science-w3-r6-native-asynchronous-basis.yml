name: science-w3-r6-native-asynchronous-basis

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r6_asynchronous_basis.py"
      - "tests/test_w3_r6_asynchronous_basis.py"
      - ".github/workflows/science-w3-r6-native-asynchronous-basis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-reference-contracts:
    name: W3 R6 asynchronous original source contracts Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r6_asynchronous_basis.py

  original-scientific-source:
    name: 96 independent generating blocks × 3 paired truly async recording mechanisms
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Original 288-case source and QR numerical-oracle audit
        run: |
          python scripts/run_w3_r6_asynchronous_basis.py \
            --out build/w3-r6-native-async
      - name: Retain all source outcomes, original SVG and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3-r6-native-asynchronous-basis-original-evidence
          path: build/w3-r6-native-async/
          retention-days: 90
          if-no-files-found: warn
