name: examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Run synthetic examples
        run: |
          python examples/functional_gaze_workflow.py
          python examples/multilevel_fpca.py
          python examples/compositional_aoi_fpca.py
          python examples/registration_phase_amplitude.py
          python examples/functional_regression.py
          python examples/function_on_scalar_regression.py
          python examples/functional_mixed_effects_regression.py
          python examples/irregular_sampling.py
          python examples/derived_functions.py
          python examples/trajectory_geometry.py
          python examples/discrete_frechet.py
          python examples/dynamic_time_warping.py
          python examples/trajectory_distance_sensitivity.py
          python examples/native_irregular.py
          python examples/fpca_stability.py
          python examples/phase_fpca.py
          python examples/outlier_influence.py
          python examples/fpca_selection_uncertainty.py
          python examples/fpca_subspace_stability.py
          python examples/functional_mean_bands.py
          python examples/predictive_fpca_selection.py
          python examples/fpc_simultaneous_bands.py
          python examples/fpca_spectrum_uncertainty.py
          python examples/fpca_score_uncertainty.py
          python examples/fpcr_regression_uncertainty.py
          python examples/fpcr_slope_simultaneous_band.py
          python examples/fpcr_future_prediction_intervals.py
          python examples/conformal_fpca_anomaly.py
          python examples/fpcr_wild_bootstrap_projection.py
          python examples/fpcr_wild_bootstrap_simultaneous.py
          python examples/fpcr_wild_bootstrap_family_test.py
          python examples/fpcr_wild_bootstrap_monte_carlo_diagnostics.py
          python examples/mathematical_contracts.py
          python examples/function_equation_registry.py
          python examples/nonlinear_dynamics.py
          python examples/joint_recurrence.py
          python examples/multivariate_iaaft_surrogates.py
          python examples/recurrence_threshold_diagnostics.py
          python examples/rqa_population_bootstrap.py
          python examples/kantz_lle.py
          python examples/nonlinear_parameter_sensitivity.py
          python examples/rqa_functional_trajectories.py
          python examples/rqa_functional_sensitivity.py
          python examples/return_map_stability.py
          python examples/fpcr_wild_bootstrap_selection.py
