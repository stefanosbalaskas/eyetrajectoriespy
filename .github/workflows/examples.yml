name: examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Run synthetic examples
        run: |
          python examples/functional_gaze_workflow.py
          python examples/multilevel_fpca.py
          python examples/compositional_aoi_fpca.py
          python examples/registration_phase_amplitude.py
          python examples/functional_regression.py
          python examples/irregular_sampling.py
          python examples/derived_functions.py
          python examples/native_irregular.py
          python examples/fpca_stability.py
          python examples/phase_fpca.py
          python examples/outlier_influence.py
          python examples/fpca_selection_uncertainty.py
