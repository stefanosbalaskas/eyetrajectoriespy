name: science-w3-known-truth-workflow-v1

on:
  pull_request:
    types: [opened,synchronize]
    paths:
      - "scripts/run_w3_known_truth_workflow_validation.py"
      - "tests/test_w3_known_truth_workflow_validation.py"
      - ".github/workflows/science-w3-known-truth-workflow-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytic-contracts:
    name: W3 independent analytical oracle Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_known_truth_workflow_validation.py

  full-known-truth-study:
    name: W3 all 24 independent generating blocks, two unit contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: All cases, original evidence, original SVG
        run: |
          python scripts/run_w3_known_truth_workflow_validation.py \
            --blocks 24 --out build/w3-known-truth
      - name: Preserve negative and positive findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3-known-truth-original-evidence
          path: build/w3-known-truth/
          retention-days: 90
          if-no-files-found: warn
