name: repair-final-012-roadmap

on:
  push:
    branches:
      - release/0.12.0-final-qualification

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.12.0-final-qualification
          fetch-depth: 0
      - name: Restore full roadmap and add exact current-line contract
        shell: bash
        run: |
          git show 8f12122fbfe5aff0b4fdfda1b9d527285beefe05:docs/methods/status-roadmap.md > docs/methods/status-roadmap.md
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/methods/status-roadmap.md')
          text = path.read_text(encoding='utf-8')
          heading = '## 0.12 final-promotion checkpoint\n\n'
          line = 'The current development line is **0.12.0**.\n\n'
          if heading not in text:
              raise SystemExit('final-promotion heading missing')
          if line not in text:
              text = text.replace(heading, heading + line, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/repair-final-012-roadmap.yml
          git diff --check
          git diff -- docs/methods/status-roadmap.md
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Declare final 0.12.0 current package line"
          git push origin HEAD:release/0.12.0-final-qualification
