name: sparse-mfpca-async-validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  known-truth-asynchronous-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Validate asynchronous sparse planar recovery
        run: |
          python scripts/run_sparse_mfpca_async_validation.py \
            --output sparse-mfpca-async-validation.json
      - name: Verify qualification scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("sparse-mfpca-async-validation.json").read_text())
          assert evidence["validation_passed"] is True
          assert evidence["paired_reduction"]["passed"] is True
          assert evidence["deterministic_replay_passed"] is True
          assert evidence["cross_semantics_passed"] is True
          assert evidence["no_hidden_synchronization"] is True
          assert evidence["expected_cross_support_failure"]["failure_code"] == "insufficient_async_cross_covariance_pairs"
          assert evidence["population_estimation_uncertainty_propagated"] is False
          assert evidence["automatic_bandwidth_selection_performed"] is False
          assert evidence["asynchronous_score_uncertainty_estimated"] is False
          assert evidence["multilevel_multivariate_model_fitted"] is False
          PY
      - name: Upload asynchronous sparse MFPCA evidence
        uses: actions/upload-artifact@v4
        with:
          name: sparse-mfpca-async-validation
          path: sparse-mfpca-async-validation.json
