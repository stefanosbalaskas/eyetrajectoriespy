name: functional-simulation-validation

on:
  pull_request:
  push:
    branches:
      - main
      - release/0.11-native-simulation
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Run public simulation recovery validation
        run: |
          python scripts/run_functional_simulation_validation.py \
            --replicates 3 \
            --output functional-simulation-validation.json
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: functional-simulation-validation
          path: functional-simulation-validation.json
