name: science-w3-r39-nuisance-coordinate-offset
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r39_nuisance_coordinate_audit.py"
      - "tests/test_w3_r39_nuisance_coordinate_audit.py"
      - ".github/workflows/science-w3-r39-nuisance-coordinate-offset.yml"
      - "docs/development/w3-r39-nuisance-coordinate-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analytic-Jacobian-and-same-Gaussian-objective:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r39_nuisance_coordinate_audit.py
  original-source-240fit-numerical-factorial:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r39_nuisance_coordinate_audit.py --out build/w3-r39-coordinate-offset
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r39-original-source-coordinate-offset-case-ledger
          path: build/w3-r39-coordinate-offset/
          retention-days: 90
          if-no-files-found: warn
