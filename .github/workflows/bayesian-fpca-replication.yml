name: bayesian-fpca-replication

on:
  pull_request:
    paths:
      - ".github/workflows/bayesian-fpca-replication.yml"
      - "scripts/run_bayesian_fpca_replication.py"
      - "scripts/evaluate_bayesian_fpca_replication.py"
      - "validation/bayesian_fpca/run_bayesfpca_replication.R"
      - "tests/test_bayesian_fpca_replication.py"
      - "docs/validation/bayesian-fpca-replication.md"
      - "mkdocs.yml"
      - "scripts/run_bayesian_fpca_comparator.py"
      - "scripts/evaluate_bayesian_fpca_comparator.py"
      - "src/eyetrajectoriespy/sparse_native.py"
      - "src/eyetrajectoriespy/sparse_multivariate.py"
      - "src/eyetrajectoriespy/sparse_multivariate_async.py"
      - "src/eyetrajectoriespy/sparse_bandwidth_selection.py"
      - "src/eyetrajectoriespy/sparse_multivariate_bandwidth_selection.py"
      - "src/eyetrajectoriespy/sparse_score_uncertainty.py"
      - "src/eyetrajectoriespy/sparse_multivariate_score_uncertainty.py"
      - "pyproject.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bayesian-fpca-replication.yml"
      - "scripts/run_bayesian_fpca_replication.py"
      - "scripts/evaluate_bayesian_fpca_replication.py"
      - "validation/bayesian_fpca/run_bayesfpca_replication.R"
      - "tests/test_bayesian_fpca_replication.py"
      - "docs/validation/bayesian-fpca-replication.md"
      - "mkdocs.yml"
      - "scripts/run_bayesian_fpca_comparator.py"
      - "scripts/evaluate_bayesian_fpca_comparator.py"
      - "src/eyetrajectoriespy/sparse_native.py"
      - "src/eyetrajectoriespy/sparse_multivariate.py"
      - "src/eyetrajectoriespy/sparse_multivariate_async.py"
      - "src/eyetrajectoriespy/sparse_bandwidth_selection.py"
      - "src/eyetrajectoriespy/sparse_multivariate_bandwidth_selection.py"
      - "src/eyetrajectoriespy/sparse_score_uncertainty.py"
      - "src/eyetrajectoriespy/sparse_multivariate_score_uncertainty.py"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: \${{ github.workflow }}-\${{ github.event.pull_request.number || github.ref }}-\${{ github.sha }}
  cancel-in-progress: true

jobs:
  replicated-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BAYESFPCA_COMMIT: "f05b0615632cffe5c63838858d9a956af6588a73"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install eyetrajectoriespy
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run B2 contract tests
        run: |
          python -m pytest -q tests/test_bayesian_fpca_replication.py

      - name: Generate B2 replicated native evidence
        run: |
          python scripts/run_bayesian_fpca_replication.py \
            --output-dir bayesian-fpca-b2 \
            --replicates 16 \
            --fairness-replicates 4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install exact bayesFPCA comparator
        run: |
          git clone https://github.com/hruffieux/bayesFPCA.git external-bayesFPCA
          git -C external-bayesFPCA checkout "$BAYESFPCA_COMMIT"
          test "$(git -C external-bayesFPCA rev-parse HEAD)" = "$BAYESFPCA_COMMIT"
          Rscript -e 'install.packages(c("ellipse", "magic", "matrixcalc", "pracma"), repos="https://cloud.r-project.org")'
          R CMD INSTALL external-bayesFPCA
          Rscript -e 'stopifnot(as.character(utils::packageVersion("bayesFPCA")) == "0.1.0")'

      - name: Capture exact R comparator environment
        run: |
          printf '%s\n' "$BAYESFPCA_COMMIT" > bayesian-fpca-b2/bayesfpca-git-commit.txt
          git -C external-bayesFPCA rev-parse HEAD > bayesian-fpca-b2/bayesfpca-checkout-head.txt
          Rscript - <<'RS'
          root <- "bayesian-fpca-b2"
          packages <- c(
            "bayesFPCA", "ellipse", "magic", "matrixcalc", "pracma",
            "MASS", "lattice"
          )
          versions <- vapply(
            packages,
            function(pkg) as.character(utils::packageVersion(pkg)),
            character(1)
          )
          utils::write.csv(
            data.frame(package = packages, version = versions),
            file.path(root, "r-package-versions.csv"),
            row.names = FALSE
          )
          capture.output(
            sessionInfo(),
            file = file.path(root, "r-session-info.txt")
          )
          capture.output(
            list(
              R_version_string = R.version.string,
              R_platform = R.version$platform,
              R_arch = R.version$arch,
              R_os = R.version$os,
              sys_info = Sys.info(),
              ext_soft_version = extSoftVersion()
            ),
            file = file.path(root, "r-runtime-details.txt")
          )
          RS

      - name: Run replicated external Bayesian comparator
        run: |
          Rscript validation/bayesian_fpca/run_bayesfpca_replication.R \
            bayesian-fpca-b2

      - name: Evaluate replicated recovery and fairness evidence
        run: |
          python scripts/evaluate_bayesian_fpca_replication.py \
            bayesian-fpca-b2

      - name: Verify B2 evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("bayesian-fpca-b2")
          payload = json.loads(
              (root / "b2_replication_summary.json").read_text()
          )
          if payload.get("evidence_type") != (
              "replicated_recovery_and_predeclared_tuning_sensitivity"
          ):
              raise SystemExit("unexpected B2 evidence type")
          if payload.get("primary_replicates") != 16:
              raise SystemExit("B2 primary replicate count changed")
          if payload.get("fairness_replicates") != 4:
              raise SystemExit("B2 fairness replicate count changed")
          for key in (
              "qualification_thresholds_introduced",
              "architecture_winner_selected",
              "automatic_promotion_decision",
              "p_values_computed",
          ):
              if payload.get(key) is not False:
                  raise SystemExit(f"B2 fail-closed contract violated: {key}")
          if payload.get("b4_decision") != "deferred":
              raise SystemExit("B4 must remain deferred")

          scenarios = {
              row["scenario"]: row
              for row in payload.get("scenario_results", [])
          }
          expected = {
              "univariate_moderate",
              "univariate_extreme_sparse",
              "univariate_low_n",
              "univariate_near_tied",
              "univariate_localized",
              "univariate_informative_time",
              "planar_paired",
              "planar_async",
          }
          if set(scenarios) != expected:
              raise SystemExit(
                  f"unexpected B2 scenario matrix: {sorted(scenarios)}"
              )
          for name, row in scenarios.items():
              if row["native_fixed"]["n_replicates"] != 16:
                  raise SystemExit(f"{name}: native replicate count changed")
              if row["bayesfpca_fixed"]["n_replicates"] != 16:
                  raise SystemExit(f"{name}: Bayesian replicate count changed")

          if (
              scenarios["univariate_low_n"]["scenario"]
              == scenarios["univariate_near_tied"]["scenario"]
          ):
              raise SystemExit("low-N and near-tied scenarios were not separated")
          if scenarios["univariate_localized"]["truth_family"] != (
              "localized_triangular"
          ):
              raise SystemExit("localized truth family missing")
          informative = scenarios["univariate_informative_time"]
          if informative["observation_mechanism"] != "logistic_candidate_time":
              raise SystemExit("informative-time mechanism missing")
          if informative[
              "informative_observation_is_sensitivity_only"
          ] is not True:
              raise SystemExit("informative observation must remain sensitivity-only")

          fairness = {
              row["scenario"]: row
              for row in payload.get("fairness_results", [])
          }
          expected_fairness = {
              "univariate_extreme_sparse",
              "univariate_low_n",
              "univariate_near_tied",
              "univariate_localized",
              "planar_paired",
          }
          if set(fairness) != expected_fairness:
              raise SystemExit(
                  f"unexpected fairness matrix: {sorted(fairness)}"
              )
          for name, row in fairness.items():
              if row["native_selected"]["n_replicates"] != 4:
                  raise SystemExit(f"{name}: native fairness count changed")
              if row["bayesfpca_selected"]["n_replicates"] != 4:
                  raise SystemExit(f"{name}: Bayesian fairness count changed")

          manifest = json.loads(
              (root / "manifest.json").read_text()
          )
          if manifest.get("raw_interpolation") is not False:
              raise SystemExit("raw interpolation entered B2")
          if manifest.get(
              "uncertainty_outputs_retained_for_later_b3_only"
          ) is not True:
              raise SystemExit("B3 raw-output boundary missing")
          PY

      - name: Capture evidence checksums
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path("bayesian-fpca-b2")
          lines = []
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              digest = sha256(path.read_bytes()).hexdigest()
              lines.append(
                  f"{digest}  {path.relative_to(root).as_posix()}"
              )
          (root / "SHA256SUMS").write_text(
              "\n".join(lines) + "\n"
          )
          PY

      - name: Upload B2 replicated comparator evidence
        uses: actions/upload-artifact@v4
        with:
          name: bayesian-fpca-b2-replication-evidence
          path: bayesian-fpca-b2
          if-no-files-found: error
          retention-days: 90
