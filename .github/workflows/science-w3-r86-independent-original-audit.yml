name: science-w3-r86-independent-original-audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r86_random_audit.py"
      - "tests/test_w3_r86_independent_original_audit.py"
      - "docs/development/w3-r86-independent-original-audit.md"
      - ".github/workflows/science-w3-r86-independent-original-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independently-replay-third-stage-failure-audit-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Independent actual X/Y, original MAR/MNAR masks, second and third random recovery, visible-only pilot and independently solved gamma/delta
        run: python -m pytest -q tests/test_w3_r86_independent_original_audit.py

  independently-audit-immutable-R86-256sources-4608failure-audits:
    needs: independently-replay-third-stage-failure-audit-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Download genuine R86 randomized third-stage audit of secondary failures, not a fixture
        uses: actions/download-artifact@v4
        with:
          repository: stefanosbalaskas/eyetrajectoriespy
          run-id: 39639148930
          name: w3-r86-original-256source-4608secondary-audit-evidence
          github-token: ${{ github.token }}
          path: build/R86-A-original-source-readonly/
      - name: Require frozen exact R86 original scientific source checkout
        run: grep -Fx 21a3d42045f56d810d273c83f7e2be645a20160c build/R86-A-original-source-readonly/source-commit.txt
      - name: Independently replay all 256 original source X/Y, 512 paired masks and 4608 recovery/audit delta results
        run: python -m scripts.audit_w3_r86_random_audit --original build/R86-A-original-source-readonly/ --expected-checkout 21a3d42045f56d810d273c83f7e2be645a20160c --out build/R86-A-independent-original-evidence/evidence.json
      - name: Display audited new source and randomized third-stage missingness validation diagnostics, no confidence-band claims
        run: cat build/R86-A-independent-original-evidence/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r86a-independent-256source-4608failure-audit
          path: build/R86-A-independent-original-evidence/
          if-no-files-found: warn
          retention-days: 90
