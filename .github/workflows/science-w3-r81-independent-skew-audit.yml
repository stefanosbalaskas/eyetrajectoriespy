name: science-w3-r81-independent-skew-audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r81_independent_unit_skew.py"
      - "tests/test_w3_r81_independent_unit_skew.py"
      - "docs/development/w3-r81-independent-unit-skew-audit.md"
      - ".github/workflows/science-w3-r81-independent-skew-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independently-replay-skewed-unit-source-and-HC3-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Independent original X/Y, HC3 original and regularized covariances, skewed known-t5 and wild/Gaussian maxima and refusal/tamper contracts
        run: python -m pytest -q tests/test_w3_r81_independent_unit_skew.py

  independently-audit-genuine-immutable-original-R81-256sources:
    needs: independently-replay-skewed-unit-source-and-HC3-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Download exact original R81 heavy-tail and skewed-contamination archive, never fixture data
        uses: actions/download-artifact@v4
        with:
          repository: stefanosbalaskas/eyetrajectoriespy
          run-id: 39490888383
          name: w3-r81-original-new-32block-skewed-unit-evidence
          github-token: ${{ github.token }}
          path: build/R81-A-original-source-readonly/
      - name: Require frozen exact R81 original scientific source checkout
        run: grep -Fx 698bf1eb80a9e856bfc2e0b5bdc362f425a75dc1 build/R81-A-original-source-readonly/source-commit.txt
      - name: Independently replay 256 skew-contaminated Student-t5 source X/Y and all five 999-draw original maximum arrays
        run: python -m scripts.audit_w3_r81_independent_unit_skew --original build/R81-A-original-source-readonly/ --expected-checkout 698bf1eb80a9e856bfc2e0b5bdc362f425a75dc1 --out build/R81-A-independent-original-evidence/evidence.json
      - name: Display independent 32-block source and 2x2 coverage decomposition with calibration withheld
        run: cat build/R81-A-independent-original-evidence/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r81a-independent-original-256source-skew-audit
          path: build/R81-A-independent-original-evidence/
          if-no-files-found: warn
          retention-days: 90
