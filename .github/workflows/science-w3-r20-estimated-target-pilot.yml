name: science-w3-r20-estimated-target-pilot
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r20_estimated_target_pilot.py"
      - "scripts/verify_w3_r20_original_failure_contract.py"
      - "tests/test_w3_r20_estimated_target_pilot.py"
      - ".github/workflows/science-w3-r20-estimated-target-pilot.yml"
      - "docs/development/w3-r20-estimated-target-pilot-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r20_estimated_target_pilot.py
  original-source-expected-negative-result:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      # Original evaluator MUST return nonzero with 41/256 exact source failures.
      # This CI job verifies the preserved failure, NOT successful inference.
      - name: Verify original 41 failures are reproduced exactly
        run: python scripts/verify_w3_r20_original_failure_contract.py --out build/w3-r20-estimated-target
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r20-estimated-target-original-pilot
          path: build/w3-r20-estimated-target/
          retention-days: 90
          if-no-files-found: warn
