name: science-w3-r36-split-null-profile-calibration
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r36_split_null_profile_calibration.py"
      - "tests/test_w3_r36_split_null_profile_calibration.py"
      - ".github/workflows/science-w3-r36-split-null-profile-calibration.yml"
      - "docs/development/w3-r36-split-null-profile-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-zero-source-and-independent-split-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r36_split_null_profile_calibration.py
  original-48source-336point-null-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r36_split_null_profile_calibration.py --out build/w3-r36-null-profile-calibration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r36-original-48source-boundary-null-calibration
          path: build/w3-r36-null-profile-calibration/
          retention-days: 90
          if-no-files-found: warn
