name: real-gaze-usability

on:
  pull_request:
    paths:
      - "examples/real_gaze_e1_e4_usability.py"
      - "examples/quickstart_*.py"
      - "docs/guides/input-schemas.md"
      - "docs/methods/experimental-e1-e4-gallery.md"
      - "docs/articles/real-gaze-usability.md"
      - "docs/quickstart.md"
      - ".github/workflows/real-gaze-usability.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "examples/real_gaze_e1_e4_usability.py"
      - "docs/articles/real-gaze-usability.md"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentic-observations-e1-e4:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build a wheel and install into an isolated environment
        run: |
          python -m pip install -U pip build
          python -m build --wheel --outdir build/dist
          python -m venv .empirical-wheel
          .empirical-wheel/bin/python -m pip install -U pip
          .empirical-wheel/bin/python -m pip install build/dist/*.whl
          .empirical-wheel/bin/python -m pip check
      - name: Execute all tutorials from installed wheel outside source checkout
        shell: bash
        run: |
          ROOT="$PWD"
          EXPECTED_VERSION=$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')
          RUN_DIR=$(mktemp -d)
          cd "$RUN_DIR"
          "$ROOT/.empirical-wheel/bin/python" - "$ROOT" "$EXPECTED_VERSION" <<'PY'
          import sys
          from pathlib import Path
          from importlib.metadata import version
          import eyetrajectoriespy
          workspace = Path(sys.argv[1]).resolve()
          expected = sys.argv[2]
          installed_path = Path(eyetrajectoriespy.__file__).resolve()
          assert not installed_path.is_relative_to(workspace), installed_path
          assert version("eyetrajectoriespy") == expected, (version("eyetrajectoriespy"), expected)
          print("PASS exact-version installed wheel outside checkout", installed_path)
          PY
          for example in quickstart_dense_fpca.py quickstart_sparse_planar.py quickstart_functional_regression.py; do
            "$ROOT/.empirical-wheel/bin/python" "$ROOT/examples/$example"
          done
      - name: Execute source-pinned empirical usability from installed wheel
        shell: bash
        run: |
          ROOT="$PWD"
          RUN_DIR=$(mktemp -d)
          cd "$RUN_DIR"
          "$ROOT/.empirical-wheel/bin/python"             "$ROOT/examples/real_gaze_e1_e4_usability.py"             --output "$ROOT/build/real-gaze-usability"
      - name: Attest installed distribution identity and bytes
        shell: bash
        run: |
          ROOT="$PWD"
          RUN_DIR=$(mktemp -d)
          cd "$RUN_DIR"
          "$ROOT/.empirical-wheel/bin/python" - "$ROOT" <<'PY'
          from hashlib import sha256
          from importlib.metadata import version
          import json
          import os
          from pathlib import Path
          import sys
          import tomllib
          import eyetrajectoriespy
          root = Path(sys.argv[1]).resolve()
          project = tomllib.loads((root / "pyproject.toml").read_text())
          expected = project["project"]["version"]
          installed = version("eyetrajectoriespy")
          wheel_paths = list((root / "build" / "dist").glob("*.whl"))
          assert len(wheel_paths) == 1, wheel_paths
          pkg_path = Path(eyetrajectoriespy.__file__).resolve()
          assert installed == expected
          assert not pkg_path.is_relative_to(root)
          evidence = {
              "installed_product_version": installed,
              "declared_source_version": expected,
              "wheel_name": wheel_paths[0].name,
              "wheel_sha256": sha256(wheel_paths[0].read_bytes()).hexdigest(),
              "installed_outside_source_checkout": True,
              "full_empirical_workflow_executed": True,
              "source_commit": os.environ.get("GITHUB_SHA"),
              "runtime_python": sys.version,
              "publication_authorized": False,
          }
          path = root / "build" / "real-gaze-usability" / "installed-wheel-attestation.json"
          path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("PASS source-identical installed-wheel empirical attestation")
          PY
      - name: Verify descriptive-only empirical evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/real-gaze-usability")
          evidence = json.loads((root / "usability-evidence.json").read_text())
          assert evidence["status"] == "empirical_observed_data_workflow_executed_not_oracle_validation"
          assert evidence["trial_windows_input"] == 16
          assert evidence["trial_windows_model"] < 16
          assert evidence["trial_windows_model"] >= 10
          assert evidence["missing_values_model"] == 0
          assert evidence["failed_sensitivity_specs"] == ["retained-999"]
          assert evidence["original_raw_data_redistributed"] is False
          assert evidence["fabricated_inferential_results"] is False
          assert (root / "scientific-report/manifest.json").is_file()
          assert (root / "preprocessing-before-after.svg").is_file()
          assert (root / "preflight-missingness.svg").is_file()
          assert (root / "sensitivity-stability.svg").is_file()
          assert (root / "report-sample-accounting.svg").is_file()
          assert (root / "input-selection-audit.csv").is_file()
          print("PASS empirical user-workflow evidence; source files excluded from artifact")
          PY
      - name: Retain de-identified derived evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-gaze-usability-e1-e4
          path: build/real-gaze-usability/
          if-no-files-found: ignore
          retention-days: 90
