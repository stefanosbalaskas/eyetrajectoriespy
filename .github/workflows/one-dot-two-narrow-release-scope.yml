name: one-dot-two-narrow-release-scope-review-only
on:
  pull_request:
    paths:
      - "RELEASE_SCOPE_1_2_PROPOSAL.json"
      - "scripts/validate_one_dot_two_release_scope.py"
      - "tests/test_one_dot_two_release_scope.py"
      - ".github/workflows/one-dot-two-narrow-release-scope.yml"
      - "docs/development/one-dot-two-narrow-release-scope-decision-20261023.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft-scientific-and-stable-API-boundaries:
    name: unapproved-scope-policy (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install source and test dependencies without publication
        run: python -m pip install -e ".[dev]"
      - name: Validate unapproved review-only scope and scientific blockers
        run: |
          python -m pytest -q tests/test_one_dot_two_release_scope.py
          python scripts/validate_one_dot_two_release_scope.py
          python scripts/verify_release_publication_gate.py --target build-only
          python scripts/verify_release_version.py
