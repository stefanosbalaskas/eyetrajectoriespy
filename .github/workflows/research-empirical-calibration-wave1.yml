name: research-empirical-calibration-wave1
on:
  pull_request:
    paths:
      - ".github/workflows/research-empirical-calibration-wave1.yml"
      - "docs/development/empirical-calibration-wave1.md"
      - "BAYESIAN_B7_PREDICTION_QUALIFICATION.json"
      - "SCIENTIFIC_CALIBRATION_BATCH_QUALIFICATION.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-scientific-refits:
    name: Empirical calibration ${{ matrix.study }} shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        study: ["b6", "b7", "f1-f5"]
        shard: [0, 1]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      STUDY: ${{ matrix.study }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Actual native fitted-model Monte Carlo with distinct declared random streams
        run: |
          mkdir -p "build"
          case "$STUDY" in
            b6)
              python scripts/run_b6_population_calibration_grid.py \
                --replicates 200 --master-seed 20261009 --shard-id "$SHARD" \
                --draws 70 --warmup 160 --out "build/b6-wave1-$SHARD" \
                > build/console-b6.json
              ;;
            b7)
              python scripts/run_b7_learned_planar_truth_pilot.py \
                --replicates 200 --master-seed 20261009 --shard-id "$SHARD" \
                --draws 70 --warmup 160 --out "build/b7-wave1-$SHARD" \
                > build/console-b7.json
              ;;
            f1-f5)
              python scripts/run_f1_f5_scientific_stress.py \
                --f1-replicates 150 --f1-permutations 199 \
                --f5-replicates 150 --f5-bootstrap 199 \
                --master-seed 20261009 --shard-id "$SHARD" \
                --out "build/f1-f5-wave1-$SHARD"
              ;;
            *) exit 70;;
          esac
          python - <<'PY'
          import os,json,pathlib,pandas as pd
          study=os.environ["STUDY"]; shard=int(os.environ["SHARD"])
          root=pathlib.Path(f"build/{study}-wave1-{shard}")
          evidence=json.loads((root/"evidence.json").read_text())
          assert evidence["shard_id"]==shard
          assert not evidence["release_authorized"] if study=="b6" else not evidence["publication_authorized"] if study=="b7" else not evidence["release_authorized"]
          if study=="b6":
              assert evidence["n_attempts"]==1200
              rows=pd.read_csv(root/"cases.csv"); assert len(rows)==1200
          elif study=="b7":
              assert evidence["attempts"]==800
              rows=pd.read_csv(root/"cases.csv"); assert len(rows)==800
          else:
              assert evidence["f1_n_fit_attempts"]==1200
              assert evidence["f5_n_fit_attempts"]==3600
              assert len(pd.read_csv(root/"f1-cases.csv"))==1200
              assert len(pd.read_csv(root/"f5-cases.csv"))==3600
          print("ACTUAL RUN",json.dumps({"study":study,"shard":shard,
            "cases":1200 if study=="b6" else 800 if study=="b7" else 4800,
            "fit_failure_counts":evidence.get("n_failed",evidence.get("failed",
               {"f1":evidence.get("f1_fit_failures"),"f5":evidence.get("f5_fit_failures")})),
            "scientific_inference_qualified":False},sort_keys=True))
          PY
      - name: Retain case-level failures and SHA256 manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave1-${{ matrix.study }}-shard-${{ matrix.shard }}
          path: build/${{ matrix.study }}-wave1-${{ matrix.shard }}/
          retention-days: 90
          if-no-files-found: warn

  audited-aggregate:
    name: Independently aggregate ${{ matrix.study }} Monte Carlo evidence
    needs: actual-scientific-refits
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        study: ["b6","b7","f1-f5"]
    env:
      STUDY: ${{ matrix.study }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: wave1-${{ matrix.study }}-shard-*
          path: build/wave1-collected
      - name: Check scenario, shard, checksum and failure-inclusive summaries
        run: |
          python scripts/aggregate_scientific_calibration_shards.py \
            --inputs build/wave1-collected/wave1-"$STUDY"-shard-* \
            --out "build/$STUDY-wave1-aggregate"
          python - <<'PY'
          import os,json,pathlib
          study=os.environ["STUDY"]
          ev=json.loads(pathlib.Path(f"build/{study}-wave1-aggregate/evidence-combined.json").read_text())
          assert ev["n_shards"]==2
          assert ev["total_attempts"]=={"b6":2400,"b7":1600,"f1-f5":9600}[study]
          assert ev["data_integrity_hashes_verified"]
          assert ev["observed_duplicate_seeds_rejected"]
          assert not ev["scientific_inference_qualified"]
          print("SCIENTIFIC CASES - unqualified",json.dumps({
            "programme":study,"attempts":ev["total_attempts"],
            "failed":ev["total_fit_failures"],
            "scenario_summaries":ev["scenario_summaries"]},sort_keys=True))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave1-${{ matrix.study }}-aggregate
          path: build/${{ matrix.study }}-wave1-aggregate/
          retention-days: 90
          if-no-files-found: warn
