name: science-w3-r67-original-R66-numerical-refusal-provenance
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r67_original_r66_refusal_provenance.py"
      - "tests/test_w3_r67_original_r66_refusal_provenance.py"
      - "docs/development/w3-r67-original-r66-refusal-audit.md"
      - ".github/workflows/science-w3-r67-original-refusal-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  strict-original-refusal-denominator-withheld-CI-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r67_original_r66_refusal_provenance.py

  classify-only-immutable-original-R66-refusals:
    needs: strict-original-refusal-denominator-withheld-CI-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Download unchanged ORIGINAL R66 128-block archive, not an R67 simulator
        uses: actions/download-artifact@v4
        with:
          repository: stefanosbalaskas/eyetrajectoriespy
          run-id: 39162296955
          name: w3-r66-original-128-block-paired-detection-evidence
          github-token: ${{ github.token }}
          path: build/R67-original-R66-readonly/
      - name: Require exact original R66 protected research PR merge checkout
        run: grep -Fx 6e462b2b59609327f15c76b838c1743c20f20f9a build/R67-original-R66-readonly/source-commit.txt
      - name: Rerun R66-A independent archive audit before diagnosing two untouched failed draws
        run: python -m scripts.audit_w3_r67_original_r66_refusal_provenance --original build/R67-original-R66-readonly/ --out build/R67-original-refusal-evidence/evidence.json
      - name: Display complete two-refusal provenance classification
        run: cat build/R67-original-refusal-evidence/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r67-original-R66-two-bootstrap-refusal-provenance
          path: build/R67-original-refusal-evidence/
          if-no-files-found: warn
          retention-days: 90
