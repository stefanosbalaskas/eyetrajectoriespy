name: science-w3-r64-independent-original-positive-slope-audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r64_original_positive_slope_independent.py"
      - "tests/test_w3_r64_independent_original_positive_slope_audit.py"
      - ".github/workflows/science-w3-r64-independent-positive-slope-audit.yml"
      - "docs/development/w3-r64-independent-positive-slope-audit.md"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-source-level-variance-tamper-and-refusal-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r64_independent_original_positive_slope_audit.py
  independently-reconstruct-original-immutable-R64-positive-slope-evidence:
    needs: independent-source-level-variance-tamper-and-refusal-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download ORIGINAL R64 complete source archive, not new simulator output
        uses: actions/download-artifact@v4
        with:
          name: w3-r64-complete-original-matched-positive-slope-evidence
          repository: stefanosbalaskas/eyetrajectoriespy
          run-id: 39121431222
          github-token: ${{ github.token }}
          path: build/R64-original-immutable/
      - name: Pin ORIGINAL R64 scientific PR merge checkout
        run: grep -Fx ebe731c3db6a491f1d6b494d91d05143ecc9ee35 build/R64-original-immutable/source-commit.txt
      - name: Reconstruct all original R64 positive-slope likelihoods, p-values and matched detection decisions
        run: python scripts/audit_w3_r64_original_positive_slope_independent.py --original build/R64-original-immutable/ --expected-original-checkout ebe731c3db6a491f1d6b494d91d05143ecc9ee35 --out build/R64-independent-original-audit/evidence.json
      - name: Display original independent evidence
        run: cat build/R64-independent-original-audit/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r64-independent-original-matched-positive-slope-numerical-evidence
          path: build/R64-independent-original-audit/
          if-no-files-found: warn
          retention-days: 90
