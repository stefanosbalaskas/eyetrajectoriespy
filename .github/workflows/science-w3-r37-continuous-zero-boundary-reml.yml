name: science-w3-r37-continuous-zero-boundary-reml
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r37_continuous_boundary_reml.py"
      - "tests/test_w3_r37_continuous_boundary_reml.py"
      - ".github/workflows/science-w3-r37-continuous-zero-boundary-reml.yml"
      - "docs/development/w3-r37-continuous-boundary-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-zero-continuous-analytic-score:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r37_continuous_boundary_reml.py
  original-16case-continuous-vs-grid:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r37_continuous_boundary_reml.py --out build/w3-r37-continuous-reml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r37-original-16case-continuous-boundary-reference
          path: build/w3-r37-continuous-reml/
          retention-days: 90
          if-no-files-found: warn
