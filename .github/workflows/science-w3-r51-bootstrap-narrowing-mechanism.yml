name: science-w3-r51-bootstrap-narrowing-mechanism
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r51_bootstrap_narrowing_mechanism.py"
      - "tests/test_w3_r51_bootstrap_narrowing_mechanism.py"
      - "docs/development/w3-r51-bootstrap-narrowing-mechanism-protocol.md"
      - ".github/workflows/science-w3-r51-bootstrap-narrowing-mechanism.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-Gaussian-source-KKT-and-checksum-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r51_bootstrap_narrowing_mechanism.py

  original-new-independent-Gaussian-mechanism-shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - start: 0
            stop: 4
          - start: 4
            stop: 8
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r51_bootstrap_narrowing_mechanism.py --start ${{ matrix.start }} --stop ${{ matrix.stop }} --out build/r51-original-shard/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r51-original-source-shard-${{ matrix.start }}
          path: build/r51-original-shard/
          if-no-files-found: warn
          retention-days: 90

  original-sha-and-source-identity-verified-aggregate:
    needs:
      - paired-Gaussian-source-KKT-and-checksum-contract
      - original-new-independent-Gaussian-mechanism-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: w3-r51-original-source-shard-*
          path: build/r51-original-parts/
          merge-multiple: false
      - run: python scripts/run_w3_r51_bootstrap_narrowing_mechanism.py --merge-parts build/r51-original-parts/ --out build/r51-original-verified/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r51-complete-original-independent-mechanism-evidence
          path: build/r51-original-verified/
          if-no-files-found: warn
          retention-days: 90
