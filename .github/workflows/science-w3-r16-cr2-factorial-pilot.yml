name: science-w3-r16-cr2-factorial-pilot
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r16_cr2_factorial_pilot.py"
      - "tests/test_w3_r16_cr2_factorial_pilot.py"
      - ".github/workflows/science-w3-r16-cr2-factorial-pilot.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r16_cr2_factorial_pilot.py
  original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r16_cr2_factorial_pilot.py --out build/w3-r16-cr2-pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r16-cr2-identity-factorial-original
          path: build/w3-r16-cr2-pilot/
          retention-days: 90
          if-no-files-found: warn
