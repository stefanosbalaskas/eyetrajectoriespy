name: sparse-multivariate-performance

on:
  pull_request:
    paths:
      - src/eyetrajectoriespy/_sparse_multivariate.py
      - src/eyetrajectoriespy/sparse_multivariate.py
      - scripts/run_sparse_mfpca_performance.py
      - .github/workflows/sparse-multivariate-performance.yml
  push:
    branches: [main]
    paths:
      - src/eyetrajectoriespy/_sparse_multivariate.py
      - src/eyetrajectoriespy/sparse_multivariate.py
      - scripts/run_sparse_mfpca_performance.py
      - .github/workflows/sparse-multivariate-performance.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resource-envelope:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e .
      - name: Run repeated sparse MFPCA resource characterization
        run: |
          python scripts/run_sparse_mfpca_performance.py \
            --repeats 3 \
            --output sparse-mfpca-performance.json
      - name: Verify resource evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("sparse-mfpca-performance.json").read_text()
          )
          if payload.get("comparative_benchmark") is not False:
              raise SystemExit("resource evidence must not claim comparison")
          if payload.get("all_score_systems_completed") is not True:
              raise SystemExit("resource cases had joint score failures")
          rows = payload.get("results", [])
          if [row.get("case") for row in rows] != [
              "very_sparse_planar",
              "moderate_sparse_planar",
              "irregular_rich_planar",
          ]:
              raise SystemExit("unexpected resource-case contract")
          if any(row.get("repeats") != 3 for row in rows):
              raise SystemExit("resource cases must use three fresh processes")
          PY
      - name: Upload sparse MFPCA resource evidence
        uses: actions/upload-artifact@v7
        with:
          name: sparse-multivariate-performance
          path: sparse-mfpca-performance.json
          if-no-files-found: error
