name: tmp-final-1-1-promotion

on:
  push:
    branches:
      - release/1.1.0-final-qualification
    paths:
      - .github/workflows/tmp-final-1-1-promotion.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.1.0-final-qualification
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply literal final transition
        run: python .github/tmp_promote_final_1_1.py
      - name: Commit transition and remove temporary orchestration
        run: |
          git rm .github/workflows/tmp-final-1-1-promotion.yml .github/tmp_promote_final_1_1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote frozen 1.1 RC surface to literal 1.1.0"
          git push origin HEAD:release/1.1.0-final-qualification
