name: science-w3-r22-scaled-cholesky-cr2
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/w3_r22_scaled_cholesky_cr2.py"
      - "tests/test_w3_r22_scaled_cholesky_cr2.py"
      - ".github/workflows/science-w3-r22-scaled-cholesky-cr2.yml"
      - "docs/development/w3-r22-scaled-cholesky-cr2-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  high-precision-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" mpmath
      - run: python -m pytest -q tests/test_w3_r22_scaled_cholesky_cr2.py
