name: science-w3-r41-targeted-physical-kkt
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r41_targeted_kkt_refinement.py"
      - "tests/test_w3_r41_targeted_kkt_refinement.py"
      - "docs/development/w3-r41-targeted-kkt-refinement-protocol.md"
      - ".github/workflows/science-w3-r41-targeted-physical-kkt.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-selection-reconstruction-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r41_targeted_kkt_refinement.py
  original-selected-replay-and-independent-solver:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r41_targeted_kkt_refinement.py --out build/w3-r41-targeted-kkt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r41-original-r40-selected-kkt-refinement-ledger
          path: build/w3-r41-targeted-kkt/
          if-no-files-found: warn
          retention-days: 90
