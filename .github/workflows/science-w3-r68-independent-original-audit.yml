name: science-w3-r68-independent-original-numerical-audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r68_independent_original_feasibility.py"
      - "tests/test_w3_r68_independent_original_feasibility_audit.py"
      - ".github/workflows/science-w3-r68-independent-original-audit.yml"
      - "docs/development/w3-r68-independent-original-audit-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-source-SHA256-fit-start-and-refusal-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r68_independent_original_feasibility_audit.py
  independently-reconstruct-actual-immutable-R68-new-source-archive:
    needs: original-source-SHA256-fit-start-and-refusal-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Download the ORIGINAL immutable NEW eight-source R68 Gaussian archive
        uses: actions/download-artifact@v4
        with:
          repository: stefanosbalaskas/eyetrajectoriespy
          run-id: 39213314751
          name: w3-r68-complete-original-8block-numerical-feasibility-evidence
          github-token: ${{ github.token }}
          path: build/R68-A-original-frozen/
      - name: Require exact original R68 scientific PR merge checkout
        run: grep -Fx 2dc36454fe19514e73390722bf332907fcda1160 build/R68-A-original-frozen/source-commit.txt
      - name: Independently check SHA256, 48 cases, 192 Gaussian draws, 1440 starts and original nested status
        run: python -m scripts.audit_w3_r68_independent_original_feasibility --original build/R68-A-original-frozen/ --expected-checkout 2dc36454fe19514e73390722bf332907fcda1160 --out build/R68-A-independent-original-evidence/evidence.json
      - name: Display independent numerical and refusal inclusion verification
        run: cat build/R68-A-independent-original-evidence/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r68a-independent-original-eight-Gaussian-source-numerical-audit
          path: build/R68-A-independent-original-evidence/
          if-no-files-found: warn
          retention-days: 90
