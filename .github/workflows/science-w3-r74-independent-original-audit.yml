name: science-w3-r74-independent-original-weighted-slope-audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r74_independent_original_weighted_slope.py"
      - "tests/test_w3_r74_independent_original_weighted_slope.py"
      - "docs/development/w3-r74-independent-original-weighted-slope-audit.md"
      - ".github/workflows/science-w3-r74-independent-original-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-true-source-Gaussian-and-weighted-HC2-HC3-numerical-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Independently reconstruct real frozen Gaussian source X/Y and HC2/HC3 maximum-statistic reference from original source fixtures
        run: python -m pytest -q tests/test_w3_r74_independent_original_weighted_slope.py

  mandatory-original-R74-512source-HC2-HC3-numerical-replay:
    needs: independent-true-source-Gaussian-and-weighted-HC2-HC3-numerical-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Download immutable ORIGINAL complete R74 source evidence without rerunning original statistical code
        uses: actions/download-artifact@v4
        with:
          repository: stefanosbalaskas/eyetrajectoriespy
          run-id: 39315676669
          name: w3-r74-original-32block-weighted-slope-HC2-HC3-evidence
          github-token: ${{ github.token }}
          path: build/R74-A-original-readonly/
      - name: Pin exact original R74 generating-source scientific PR merge checkout
        run: grep -Fx 4031d3dbe5cfc5617bd939c8ea9cd00d17376bd9 build/R74-A-original-readonly/source-commit.txt
      - name: Independently regenerate all 512 original X/Y Gaussian sources and 2,045,952 wild/estimated-Gaussian maxima
        run: python -m scripts.audit_w3_r74_independent_original_weighted_slope --original build/R74-A-original-readonly/ --expected-checkout 4031d3dbe5cfc5617bd939c8ea9cd00d17376bd9 --out build/R74-A-independent-original-numerical-evidence/evidence.json
      - name: Report complete independent original adverse coverage and no-release gate
        run: cat build/R74-A-independent-original-numerical-evidence/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r74a-independent-original-512source-weighted-slope-evidence
          path: build/R74-A-independent-original-numerical-evidence/
          if-no-files-found: warn
          retention-days: 90
