name: science-w3-r74-independent-original-weighted-HC2-HC3-audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r74_independent_original_weighted_slope.py"
      - "tests/test_w3_r74_independent_original_weighted_slope.py"
      - "docs/development/w3-r74-independent-original-weighted-slope-audit.md"
      - ".github/workflows/science-w3-r74-independent-original-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-Gaussian-X-Y-weighted-HC2-HC3-and-failure-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Reconstruct frozen source Gaussian X/Y, all weighted HC2/HC3 original maxima, forged archives and qualification refusals
        run: python -m pytest -q tests/test_w3_r74_independent_original_weighted_slope.py

  mandatory-independent-original-R74-full-512-source-evidence:
    needs: independent-Gaussian-X-Y-weighted-HC2-HC3-and-failure-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Download exact immutable original R74 512-source aggregate
        uses: actions/download-artifact@v4
        with:
          repository: stefanosbalaskas/eyetrajectoriespy
          run-id: 39315676669
          name: w3-r74-original-32block-weighted-slope-HC2-HC3-evidence
          github-token: ${{ github.token }}
          path: build/R74-A-original-readonly/
      - name: Require original R74 scientific PR-merge checkout not audit branch checkout
        run: grep -Fx 4031d3dbe5cfc5617bd939c8ea9cd00d17376bd9 build/R74-A-original-readonly/source-commit.txt
      - name: Independently replay all original 512 Gaussian X/Y source cases and 2,045,952 original maximum statistics
        run: python -m scripts.audit_w3_r74_independent_original_weighted_slope --original build/R74-A-original-readonly/ --expected-checkout 4031d3dbe5cfc5617bd939c8ea9cd00d17376bd9 --out build/R74-A-independent-original-evidence/evidence.json
      - name: Surface independent weighted-HC2/HC3 coverage and critical-value analysis
        run: cat build/R74-A-independent-original-evidence/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r74a-independent-original-512source-weighted-HC2-HC3-evidence
          path: build/R74-A-independent-original-evidence/
          if-no-files-found: warn
          retention-days: 90
