name: sparse-native-validation

on:
  pull_request:
  push:
    branches:
      - release/0.10-native-sparse
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  stress-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Run sparse recovery/failure stress matrix
        run: |
          python scripts/run_sparse_fpca_stress_validation.py \
            --replicates 3 \
            --output sparse-fpca-stress-validation.json
      - name: Upload stress evidence
        uses: actions/upload-artifact@v4
        with:
          name: sparse-fpca-stress-validation
          path: sparse-fpca-stress-validation.json

  sparse-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Characterize sparse runtime and peak memory
        run: |
          python scripts/run_sparse_fpca_performance.py \
            --repeats 3 \
            --output sparse-fpca-performance.json
      - name: Upload performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: sparse-fpca-performance
          path: sparse-fpca-performance.json
