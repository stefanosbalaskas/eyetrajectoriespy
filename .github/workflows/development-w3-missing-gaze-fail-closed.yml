name: development-w3-missing-gaze-fail-closed

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "src/eyetrajectoriespy/workflows/_dense_regression.py"
      - "tests/test_w3_missing_gaze_fail_closed.py"
      - ".github/workflows/development-w3-missing-gaze-fail-closed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observed-data-integrity:
    name: W3 missing-gaze integrity Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: |
          python -m pytest -q \
            tests/test_w3_missing_gaze_fail_closed.py \
            tests/test_dense_regression_workflows.py \
            tests/test_w3_known_truth_workflow_validation.py
