name: workflow-product-qualification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/workflow-product-qualification.yml"
      - "src/eyetrajectoriespy/workflows/**"
      - "tests/test_workflow_*.py"
      - "tests/test_sparse_workflows.py"
      - "tests/test_dense_regression_workflows.py"
      - "scripts/run_one_dot_two_workflow_product_qualification.py"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/workflow-product-qualification.yml"
      - "src/eyetrajectoriespy/workflows/**"
      - "tests/test_workflow_*.py"
      - "tests/test_sparse_workflows.py"
      - "tests/test_dense_regression_workflows.py"
      - "scripts/run_one_dot_two_workflow_product_qualification.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-contract:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run W1-W4 workflow contracts
        run: |
          python -m pytest -q \
            tests/test_workflow_infrastructure.py \
            tests/test_sparse_workflows.py \
            tests/test_dense_regression_workflows.py \
            tests/test_workflow_contract_edges.py \
            tests/test_workflow_product_w4.py

      - name: Validate frozen workflow API audit
        run: python scripts/validate_workflow_api_audit.py

      - name: Verify W4 remains module-scoped
        run: |
          python - <<'PY'
          import eyetrajectoriespy as et
          import eyetrajectoriespy.workflows as workflows

          required = (
              "run_recurrence_workflow",
              "plot_workflow_result",
              "save_workflow_figure",
          )
          missing = [name for name in required if not hasattr(workflows, name)]
          if missing:
              raise SystemExit(f"missing W4 APIs: {missing}")
          leaked = [name for name in required if hasattr(et, name)]
          if leaked:
              raise SystemExit(f"W4 APIs leaked into package root: {leaked}")
          PY

  installed-product:
    needs: workflow-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install -U pip build
          python -m build --wheel

      - name: Install wheel in isolated environment
        shell: bash
        run: |
          python -m venv .workflow-wheel
          .workflow-wheel/bin/python -m pip install -U pip
          .workflow-wheel/bin/python -m pip install dist/*.whl

      - name: Run installed workflow product qualification outside checkout
        shell: bash
        run: |
          RUN_DIR=$(mktemp -d)
          cd "$RUN_DIR"
          "$GITHUB_WORKSPACE/.workflow-wheel/bin/python"             "$GITHUB_WORKSPACE/scripts/run_one_dot_two_workflow_product_qualification.py"             --output-dir "$GITHUB_WORKSPACE/build/workflow-product-qualification"             --expected-version "1.2.0.dev0"

      - name: Verify installed evidence and performance envelope
        run: |
          .workflow-wheel/bin/python - <<'PY'
          import json
          from pathlib import Path

          root = Path("build/workflow-product-qualification")
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))

          expected = {
              "fpca:v1",
              "function_on_scalar:v1",
              "functional_mixed_effects:v1",
              "generalized_functional:v1",
              "sparse_fpca:v1",
              "sparse_mfpca:v1",
              "sparse_mfpca_async:v1",
              "sparse_multilevel:v1",
              "sparse_prediction:v1",
              "recurrence:v1",
          }
          assert summary["programme"] == "1.2-workflow-installed-product-qualification"
          assert summary["package_version"] == "1.2.0.dev0"
          assert summary["installed_package_execution"] is True
          assert summary["repository_private_helpers_used"] is False
          assert summary["empirical_human_data"] is False
          assert summary["workflow_count"] == 10
          assert set(summary["workflow_contracts"]) == expected
          assert summary["release_blocking_friction_count"] == 0

          # Broad CI regression envelope, not a scientific performance claim.
          assert summary["runtime_seconds_total"] < 120.0
          assert max(
              item["runtime_seconds"] for item in summary["results"].values()
          ) < 60.0

          required = (
              root / "fpca" / "bundle" / "workflow.json",
              root / "fpca" / "component-1-x.svg",
              root / "sparse-mfpca" / "bundle" / "workflow.json",
              root / "sparse-mfpca" / "component-1.svg",
              root / "function-on-scalar" / "condition.svg",
              root / "recurrence" / "bundle" / "workflow.json",
              root / "recurrence" / "recurrence.svg",
          )
          missing = [str(path) for path in required if not path.is_file()]
          assert not missing, missing
          print("installed 1.2 workflow product evidence OK")
          PY

      - name: Validate workflow API audit in installed environment
        run: .workflow-wheel/bin/python scripts/validate_workflow_api_audit.py

      - name: Compile installed-product harness
        run: python -m py_compile scripts/run_one_dot_two_workflow_product_qualification.py

      - name: Upload installed workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: one-dot-two-workflow-product-qualification
          path: build/workflow-product-qualification
          retention-days: 90
          if-no-files-found: error
