name: science-w3-r21-estimated-target-spectral-audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r21_estimated_target_spectral_audit.py"
      - "tests/test_w3_r21_estimated_target_spectral_audit.py"
      - ".github/workflows/science-w3-r21-estimated-target-spectral-audit.yml"
      - "docs/development/w3-r21-estimated-target-spectral-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r21_estimated_target_spectral_audit.py
  original-source-spectral-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r21_estimated_target_spectral_audit.py --out build/w3-r21-estimated-target-spectral
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r21-original-256case-spectral-audit
          path: build/w3-r21-estimated-target-spectral/
          if-no-files-found: warn
          retention-days: 90
