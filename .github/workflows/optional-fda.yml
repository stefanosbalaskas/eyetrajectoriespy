name: optional-fda

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scikit-fda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional FDA interoperability
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,fda]"
      - name: Run optional backend tests
        run: python -m pytest tests/test_basis_projection.py tests/test_backends_optional.py -q
      - name: Run basis example
        run: python examples/basis_projection.py
