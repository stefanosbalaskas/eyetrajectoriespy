name: science-w3-r84-independent-recovery-audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r84_independent_recovery.py"
      - "tests/test_w3_r84_independent_recovery_audit.py"
      - "docs/development/w3-r84-independent-recovery-audit.md"
      - ".github/workflows/science-w3-r84-independent-recovery-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independently-replay-nested-external-recovery-score-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Independent original X/Y, MAR/MNAR masks, nested random recovery, observed-only pilot, score root and refusal/tamper contracts
        run: python -m pytest -q tests/test_w3_r84_independent_recovery_audit.py

  independently-audit-immutable-R84-256sources-1536recoveries:
    needs: independently-replay-nested-external-recovery-score-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Download exact original R84 random external outcome-validation archive, never fixture data
        uses: actions/download-artifact@v4
        with:
          repository: stefanosbalaskas/eyetrajectoriespy
          run-id: 39581392688
          name: w3-r84-original-256source-1536validation-evidence
          github-token: ${{ github.token }}
          path: build/R84-A-original-source-readonly/
      - name: Require frozen exact R84 original scientific source checkout
        run: grep -Fx 6170c5b5941f55a5083cf57dc11293a229d2f9e1 build/R84-A-original-source-readonly/source-commit.txt
      - name: Independently replay exact original 256 X/Y source conditions, 512 paired MAR/MNAR masks and 1536 recovery-assisted model-dependent delta estimates
        run: python -m scripts.audit_w3_r84_independent_recovery --original build/R84-A-original-source-readonly/ --expected-checkout 6170c5b5941f55a5083cf57dc11293a229d2f9e1 --out build/R84-A-independent-original-evidence/evidence.json
      - name: Display independent 32-block source and independent recovery-propensity score diagnostics with calibration withheld
        run: cat build/R84-A-independent-original-evidence/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r84a-independent-256source-1536recovery-audit
          path: build/R84-A-independent-original-evidence/
          if-no-files-found: warn
          retention-days: 90
