name: science-w3-r70-independent-original-999max-audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r70_independent_original_wild_maxima.py"
      - "tests/test_w3_r70_independent_original_wild_maxima.py"
      - "docs/development/w3-r70-independent-original-maxima-audit.md"
      - ".github/workflows/science-w3-r70-independent-max-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  numerical-source-999max-independent-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Independent wild maximum-statistic, source denominator and invalid band/coverage refusal tests
        run: python -m pytest -q tests/test_w3_r70_independent_original_wild_maxima.py

  independently-audit-immutable-original-R70-source-999wild-maxima:
    needs: numerical-source-999max-independent-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Download unchanged ORIGINAL R70 32-block complete 999-maxima research archive
        uses: actions/download-artifact@v4
        with:
          repository: stefanosbalaskas/eyetrajectoriespy
          run-id: 39220071710
          name: w3-r70-original-complete-32block-leverage-HC3-999maxima-evidence
          github-token: ${{ github.token }}
          path: build/R70-A-frozen-original/
      - name: Require exact original R70 PR scientific merge checkout
        run: grep -Fx 7d186a014d4118fbb7c614bf290e565243855be1 build/R70-A-frozen-original/source-commit.txt
      - name: Reconstruct every immutable original source 999-draw slope and family critical and paired coverage
        run: python -m scripts.audit_w3_r70_independent_original_wild_maxima --original build/R70-A-frozen-original/ --expected-checkout 7d186a014d4118fbb7c614bf290e565243855be1 --out build/R70-A-original-independent-evidence/evidence.json
      - name: Report independently verified 32-block HC3 versus original W3 coverage without release claim
        run: cat build/R70-A-original-independent-evidence/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r70a-independent-original-32block-999wildmax-coverage
          path: build/R70-A-original-independent-evidence/
          if-no-files-found: warn
          retention-days: 90
