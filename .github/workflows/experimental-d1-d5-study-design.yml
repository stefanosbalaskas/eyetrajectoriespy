name: experimental-d1-d5-study-design

on:
  pull_request:
    paths:
      - "src/eyetrajectoriespy/research/**"
      - "tests/test_research_d4.py"
      - "docs/development/**"
      - "docs/assets/research/**"
      - "scripts/generate_f1_f6_gallery.py"
      - "scripts/run_f1_d1_stress_pilot.py"
      - ".github/workflows/experimental-d1-d5-study-design.yml"
      - "mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experimental-study-design:
    name: D4 contracts (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development tools and source
        run: python -m pip install -e ".[dev,docs]"
      - name: Verify old F1-F6 and new design contracts
        run: |
          python -m pytest -q tests/test_research_f1_f6.py tests/test_research_d4.py
          python -m compileall -q src/eyetrajectoriespy/research
      - name: Generate six deterministic research SVGs
        run: |
          python scripts/generate_f1_f6_gallery.py
          python - <<'PY'
          from pathlib import Path
          p = Path("docs/assets/research")
          assert len(list(p.glob("f?-*.svg"))) == 6
          print("Six deterministic synthetic scientific illustrations rendered")
          PY
      - name: Enforce experimental namespace and release boundaries
        run: |
          python - <<'PY'
          import json
          import eyetrajectoriespy
          from eyetrajectoriespy import research
          for name in (
            "simulate_functional_study_power",
            "fit_functional_reliability",
            "compare_repeated_functional_groups",
          ):
              assert hasattr(research, name), name
              assert not hasattr(eyetrajectoriespy, name), name
          readiness = json.load(open("RELEASE_READINESS.json"))
          assert readiness["production_release_ready"] is False
          assert readiness["github_release_ready"] is False
          print("PASS: D4 remains opt-in, with publication explicitly disarmed")
          PY

  native-sparse-design-stress:
    name: F1 full-model multi-design pilot
    needs: experimental-study-design
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source and scientific dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run five known-truth design scenarios through actual native F1
        run: |
          python scripts/run_f1_d1_stress_pilot.py \
            --replicates 4 --out build/d1-sparse-study-design
      - name: Verify all scientific failures are counted
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          base = Path("build/d1-sparse-study-design")
          info = json.loads((base/"evidence.json").read_text())
          data = pd.read_csv(base/"design-cases.csv")
          assert len(data) == 40
          assert info["n_total_fit_attempts"] == 40
          assert info["n_failed_fit_attempts"] == (data.status == "failed").sum()
          assert not info["type_one_error_or_power_qualified"]
          assert not info["release_authorized"]
          print("PASS full refit attempts retained; null/power NOT qualified")
          PY
      - name: Retain full scientific design stress records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-native-five-design-stress-pilot
          path: build/d1-sparse-study-design/
          if-no-files-found: error
          retention-days: 90
