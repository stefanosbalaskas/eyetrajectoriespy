name: science-w3-r26-independent-reml-recovery
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r26_independent_reml_recovery.py"
      - "tests/test_w3_r26_independent_reml_recovery.py"
      - ".github/workflows/science-w3-r26-independent-reml-recovery.yml"
      - "docs/development/w3-r26-independent-reml-recovery-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r26_independent_reml_recovery.py
  original-384case-independent-replication:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r26_independent_reml_recovery.py --out build/w3-r26-independent-recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r26-original-384case-independent-estimator-ledger
          path: build/w3-r26-independent-recovery/
          if-no-files-found: warn
          retention-days: 90
