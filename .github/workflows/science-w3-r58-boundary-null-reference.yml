name: science-w3-r58-independent-boundary-null-reference
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r58_boundary_null_reference.py"
      - "tests/test_w3_r58_boundary_null_reference.py"
      - "docs/development/w3-r58-boundary-null-reference-protocol.md"
      - ".github/workflows/science-w3-r58-boundary-null-reference.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-reference-and-original-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r58_boundary_null_reference.py

  new-independent-Gaussian-source-shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 0, stop: 4}
          - {start: 4, stop: 8}
          - {start: 8, stop: 12}
          - {start: 12, stop: 16}
          - {start: 16, stop: 20}
          - {start: 20, stop: 24}
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m scripts.run_w3_r58_boundary_null_reference --start ${{ matrix.start }} --stop ${{ matrix.stop }} --out build/R58-original-shard/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r58-original-boundary-source-${{ matrix.start }}
          path: build/R58-original-shard/
          if-no-files-found: warn
          retention-days: 90

  complete-original-SHA256-Monte-Carlo-aggregate:
    needs:
      - candidate-reference-and-original-source-contract
      - new-independent-Gaussian-source-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: w3-r58-original-boundary-source-*
          path: build/R58-original-parts/
          merge-multiple: false
      - run: python -m scripts.run_w3_r58_boundary_null_reference --merge-parts build/R58-original-parts/ --out build/R58-original-complete/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r58-complete-original-boundary-null-reference-evidence
          path: build/R58-original-complete/
          if-no-files-found: warn
          retention-days: 90
