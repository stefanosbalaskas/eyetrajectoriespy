name: science-w3-r83-independent-selection-audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r83_observation_sensitivity.py"
      - "tests/test_w3_r83_independent_observation_audit.py"
      - "docs/development/w3-r83-independent-selection-audit.md"
      - ".github/workflows/science-w3-r83-independent-selection-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independently-replay-masked-unit-source-and-HC3-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Independent original X/Y, HC3 original and regularized covariances, source and nonidentified assumption-weighted pointwise differences and refusal/tamper contracts
        run: python -m pytest -q tests/test_w3_r83_independent_observation_audit.py

  independently-audit-genuine-immutable-original-R83-256sources:
    needs: independently-replay-masked-unit-source-and-HC3-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Download exact original R83 nonidentified selection-sensitivity archive, never fixture data
        uses: actions/download-artifact@v4
        with:
          repository: stefanosbalaskas/eyetrajectoriespy
          run-id: 39575847765
          name: w3-r83-original-256source-3328sensitivity-evidence
          github-token: ${{ github.token }}
          path: build/R83-A-original-source-readonly/
      - name: Require frozen exact R83 original scientific source checkout
        run: grep -Fx 4aaf792457c789b3fafd218e3dd94ae46af47e86 build/R83-A-original-source-readonly/source-commit.txt
      - name: Independently replay exact original 256 X/Y source conditions, 1024 paired MCAR/MAR/MNAR masks and 3328 assumption-delta weighted slope/oracle records
        run: python -m scripts.audit_w3_r83_observation_sensitivity --original build/R83-A-original-source-readonly/ --expected-checkout 4aaf792457c789b3fafd218e3dd94ae46af47e86 --out build/R83-A-independent-original-evidence/evidence.json
      - name: Display independent 32-block source and five-delta pointwise sensitivity diagnostics with calibration withheld
        run: cat build/R83-A-independent-original-evidence/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r83a-independent-256source-3328delta-sensitivity-audit
          path: build/R83-A-independent-original-evidence/
          if-no-files-found: warn
          retention-days: 90
