name: science-w3-r75-independent-original-SE-correlation-audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r75_independent_original_SE_correlation.py"
      - "tests/test_w3_r75_independent_original_SE_correlation.py"
      - "docs/development/w3-r75-independent-original-SE-correlation-audit.md"
      - ".github/workflows/science-w3-r75-independent-SE-correlation-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independently-replay-Gaussian-source-and-true-HC3-correlation-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Independent original X/Y, HC3 residual covariance, true/estimated Gaussian max and refusal/tamper contracts
        run: python -m pytest -q tests/test_w3_r75_independent_original_SE_correlation.py

  independently-audit-genuine-immutable-original-R75-256sources:
    needs: independently-replay-Gaussian-source-and-true-HC3-correlation-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Download unchanged original R75 source archive, not fixture data
        uses: actions/download-artifact@v4
        with:
          repository: stefanosbalaskas/eyetrajectoriespy
          run-id: 39385910433
          name: w3-r75-original-new-32block-SE-correlation-factorial-evidence
          github-token: ${{ github.token }}
          path: build/R75-A-original-source-readonly/
      - name: Require frozen exact R75 original scientific source checkout
        run: grep -Fx 7bcdf6fee93e6a0964913e44b5c78a60d3cfc7e3 build/R75-A-original-source-readonly/source-commit.txt
      - name: Independently replay 256 primitive Gaussian source X/Y and full 999 original wild and two Gaussian-reference maxima
        run: python -m scripts.audit_w3_r75_independent_original_SE_correlation --original build/R75-A-original-source-readonly/ --expected-checkout 7bcdf6fee93e6a0964913e44b5c78a60d3cfc7e3 --out build/R75-A-independent-original-evidence/evidence.json
      - name: Display independent 32-block source and 2x2 coverage decomposition with calibration withheld
        run: cat build/R75-A-independent-original-evidence/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r75a-independent-original-256source-SE-correlation-factorial
          path: build/R75-A-independent-original-evidence/
          if-no-files-found: warn
          retention-days: 90
