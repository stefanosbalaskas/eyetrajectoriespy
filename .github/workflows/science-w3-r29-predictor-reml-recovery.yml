name: science-w3-r29-predictor-reml-recovery
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r29_predictor_spread_recovery.py"
      - "tests/test_w3_r29_predictor_spread_recovery.py"
      - ".github/workflows/science-w3-r29-predictor-reml-recovery.yml"
      - "docs/development/w3-r29-predictor-reml-recovery-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  primitive-gaussian-and-paired-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r29_predictor_spread_recovery.py
  original-192case-paired-gaussian-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r29_predictor_spread_recovery.py --out build/w3-r29-counterfactual-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r29-original-192case-paired-predictor-recovery
          path: build/w3-r29-counterfactual-source/
          retention-days: 90
          if-no-files-found: warn
