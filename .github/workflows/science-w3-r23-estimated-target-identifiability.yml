name: science-w3-r23-estimated-target-identifiability
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r23_estimated_target_identifiability.py"
      - "tests/test_w3_r23_estimated_target_identifiability.py"
      - ".github/workflows/science-w3-r23-estimated-target-identifiability.yml"
      - "docs/development/w3-r23-estimated-target-identifiability-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design-and-ledger-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r23_estimated_target_identifiability.py
  original-source-identifiability:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r23_estimated_target_identifiability.py --out build/w3-r23-identifiability
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r23-original-576case-identifiability
          path: build/w3-r23-identifiability/
          if-no-files-found: warn
          retention-days: 90
