name: release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Release target
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - testpypi
          - production
          - resume-production

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-once:
    name: release-build-once
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tooling
        run: python -m pip install -U pip build twine packaging
      - name: Verify version contract
        id: version
        shell: bash
        run: |
          if [[ "${{ inputs.target }}" == "production" || "${{ inputs.target }}" == "resume-production" ]]; then
            VERSION="$(python scripts/verify_release_version.py --production)"
          else
            VERSION="$(python scripts/verify_release_version.py)"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${VERSION}"
      - name: Build wheel and sdist exactly once
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Smoke-test wheel in a fresh environment
        shell: bash
        run: |
          python -m venv .release-wheel
          .release-wheel/bin/python -m pip install -U pip
          .release-wheel/bin/python -m pip install dist/*.whl
          .release-wheel/bin/python scripts/release_smoke_test.py --expected-version "${{ steps.version.outputs.version }}"
      - name: Smoke-test sdist in a fresh environment
        shell: bash
        run: |
          python -m venv .release-sdist
          .release-sdist/bin/python -m pip install -U pip
          .release-sdist/bin/python -m pip install dist/*.tar.gz
          .release-sdist/bin/python scripts/release_smoke_test.py --expected-version "${{ steps.version.outputs.version }}"
      - name: Upload immutable release distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.whl
            dist/*.tar.gz

  publish-testpypi:
    name: publish-testpypi
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build-once
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify TestPyPI environment acknowledgement
        env:
          TRUSTED: ${{ vars.TESTPYPI_TRUSTED_PUBLISHING_CONFIGURED }}
        run: |
          test "${TRUSTED}" = "true" || {
            echo "Set TESTPYPI_TRUSTED_PUBLISHING_CONFIGURED=true in the testpypi environment."; exit 1;
          }
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Publish exact build artifacts to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi:
    name: verify-testpypi-install
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs:
      - build-once
      - publish-testpypi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install exact TestPyPI version and smoke test
        shell: bash
        run: |
          python -m venv .testpypi-smoke
          .testpypi-smoke/bin/python -m pip install -U pip
          for attempt in $(seq 1 20); do
            echo "TestPyPI visibility/install attempt ${attempt}/20"
            if .testpypi-smoke/bin/python -m pip install --pre --no-cache-dir \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple \
              "eyetrajectoriespy==${{ needs.build-once.outputs.version }}"; then
              break
            fi
            if [[ "${attempt}" == "20" ]]; then
              echo "Exact TestPyPI version did not become installable within the bounded propagation window."
              exit 1
            fi
            sleep 20
          done
          .testpypi-smoke/bin/python scripts/release_smoke_test.py \
            --expected-version "${{ needs.build-once.outputs.version }}"

  production-governance:
    name: production-release-governance
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.target == 'production' || inputs.target == 'resume-production')
    needs: build-once
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require protected exact main and complete exact-main CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/verify_release_governance.py \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --wait-seconds 1800 \
            --poll-seconds 20

  production-preflight:
    name: production-new-version-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    needs:
      - build-once
      - production-governance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require unpublished GitHub and PyPI version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-once.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Production release ${TAG} already exists on GitHub; use resume-production only for deliberate recovery."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Production tag ${TAG} already exists; use resume-production only for deliberate recovery."
            exit 1
          fi
          python scripts/verify_pypi_version_unpublished.py \
            --package eyetrajectoriespy \
            --version "${VERSION}"

  github-release:
    name: create-github-release
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    needs:
      - build-once
      - production-preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Create checksums
        run: sha256sum dist/* > SHA256SUMS
      - name: Create new annotated tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-once.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "${GITHUB_SHA}" -m "eyetrajectoriespy ${VERSION}"
          git push origin "${TAG}"

          EXTRA=()
          if [[ "${VERSION}" == *rc* || "${VERSION}" == *a* || "${VERSION}" == *b* ]]; then
            EXTRA+=(--prerelease)
          fi
          NOTES="docs/releases/${VERSION}.md"
          if [[ -f "${NOTES}" ]]; then
            gh release create "${TAG}" dist/* SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag --notes-file "${NOTES}" --title "${TAG}" "${EXTRA[@]}"
          else
            gh release create "${TAG}" dist/* SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag --generate-notes --title "${TAG}" "${EXTRA[@]}"
          fi

  resume-release-preflight:
    name: resume-existing-github-release
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'resume-production'
    needs:
      - build-once
      - production-governance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require matching existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-once.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          git fetch --tags --force
          TARGET="$(git rev-list -n 1 "${TAG}")"
          test "${TARGET}" = "${GITHUB_SHA}" || {
            echo "Existing ${TAG} points to ${TARGET}, not exact main ${GITHUB_SHA}."
            exit 1
          }

  publish-pypi:
    name: publish-pypi
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    needs:
      - build-once
      - github-release
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify dedicated production environment acknowledgement
        env:
          TRUSTED: ${{ vars.PYPI_TRUSTED_PUBLISHING_CONFIGURED }}
          REVIEW: ${{ vars.PYPI_REQUIRED_REVIEWER_CONFIGURED }}
        run: |
          test "${TRUSTED}" = "true" || {
            echo "Set PYPI_TRUSTED_PUBLISHING_CONFIGURED=true in the pypi environment."; exit 1;
          }
          test "${REVIEW}" = "true" || {
            echo "Set PYPI_REQUIRED_REVIEWER_CONFIGURED=true in the pypi environment."; exit 1;
          }
      - name: Download and verify exact GitHub Release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-once.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist
          gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "*.whl" --pattern "*.tar.gz" --pattern "SHA256SUMS" --dir dist
          sha256sum -c dist/SHA256SUMS
          rm dist/SHA256SUMS
      - name: Publish previously unpublished version to PyPI through OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  resume-pypi:
    name: resume-pypi
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'resume-production'
    needs:
      - build-once
      - resume-release-preflight
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify dedicated production environment acknowledgement
        env:
          TRUSTED: ${{ vars.PYPI_TRUSTED_PUBLISHING_CONFIGURED }}
          REVIEW: ${{ vars.PYPI_REQUIRED_REVIEWER_CONFIGURED }}
        run: |
          test "${TRUSTED}" = "true" || {
            echo "Set PYPI_TRUSTED_PUBLISHING_CONFIGURED=true in the pypi environment."; exit 1;
          }
          test "${REVIEW}" = "true" || {
            echo "Set PYPI_REQUIRED_REVIEWER_CONFIGURED=true in the pypi environment."; exit 1;
          }
      - name: Download and verify immutable GitHub Release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-once.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist
          gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "*.whl" --pattern "*.tar.gz" --pattern "SHA256SUMS" --dir dist
          sha256sum -c dist/SHA256SUMS
          rm dist/SHA256SUMS
      - name: Resume PyPI upload using immutable release artifacts
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  verify-pypi:
    name: verify-pypi-install
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    needs:
      - build-once
      - publish-pypi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install exact production version and smoke test
        shell: bash
        run: |
          python -m venv .pypi-smoke
          .pypi-smoke/bin/python -m pip install -U pip
          for attempt in $(seq 1 30); do
            echo "PyPI visibility/install attempt ${attempt}/30"
            if .pypi-smoke/bin/python -m pip install --no-cache-dir \
              "eyetrajectoriespy==${{ needs.build-once.outputs.version }}"; then
              break
            fi
            if [[ "${attempt}" == "30" ]]; then
              echo "Exact PyPI version did not become installable within the bounded propagation window."
              exit 1
            fi
            sleep 20
          done
          .pypi-smoke/bin/python scripts/release_smoke_test.py \
            --expected-version "${{ needs.build-once.outputs.version }}"

  verify-resume-pypi:
    name: verify-resume-pypi-install
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'resume-production'
    needs:
      - build-once
      - resume-pypi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify recovered production installation
        shell: bash
        run: |
          python -m venv .pypi-resume-smoke
          .pypi-resume-smoke/bin/python -m pip install -U pip
          for attempt in $(seq 1 30); do
            echo "Recovered PyPI visibility/install attempt ${attempt}/30"
            if .pypi-resume-smoke/bin/python -m pip install --no-cache-dir \
              "eyetrajectoriespy==${{ needs.build-once.outputs.version }}"; then
              break
            fi
            if [[ "${attempt}" == "30" ]]; then
              echo "Exact PyPI version did not become installable within the bounded propagation window."
              exit 1
            fi
            sleep 20
          done
          .pypi-resume-smoke/bin/python scripts/release_smoke_test.py \
            --expected-version "${{ needs.build-once.outputs.version }}"
