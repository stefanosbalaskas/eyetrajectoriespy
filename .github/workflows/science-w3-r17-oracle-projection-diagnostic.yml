name: science-w3-r17-oracle-projection-diagnostic
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r17_oracle_projection_diagnostic.py"
      - "tests/test_w3_r17_oracle_projection_diagnostic.py"
      - ".github/workflows/science-w3-r17-oracle-projection-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oracle-projection-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r17_oracle_projection_diagnostic.py
  original-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r17_oracle_projection_diagnostic.py --out build/w3-r17-oracle-projection
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r17-oracle-projection-original-source-audit
          path: build/w3-r17-oracle-projection/
          retention-days: 90
          if-no-files-found: warn
