name: science-w3-r92-independent-original-return-fragility
on:
  pull_request:
    types: [opened,synchronize]
    paths:
      - "scripts/audit_w3_r92_original_return_fragility_independent.py"
      - "tests/test_w3_r92_independent_original_audit.py"
      - ".github/workflows/science-w3-r92-independent-original.yml"
      - "docs/development/w3-r92-independent-original-evidence.md"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-source-and-bias-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r92_independent_original_audit.py
  mandatory-real-original-14336-replay:
    needs: independent-source-and-bias-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          name: w3-r92-immutable-original-14336-return-fragility
          run-id: 39837488254
          github-token: ${{ github.token }}
          repository: stefanosbalaskas/eyetrajectoriespy
          path: build/R92-original/
      - run: python -m scripts.audit_w3_r92_original_return_fragility_independent --original build/R92-original/ --out build/R92-independent/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r92-A-independent-14336-original-replay
          path: build/R92-independent/
          if-no-files-found: warn
          retention-days: 90
