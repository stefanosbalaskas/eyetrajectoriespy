name: science-w3-r17-independent-96block-calibration
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r17_fresh_feasibility.py"
      - "scripts/run_w3_r17_independent_96block_calibration.py"
      - "tests/test_w3_r17_independent_96block_calibration.py"
      - ".github/workflows/science-w3-r17-independent-96block-calibration.yml"
      - "docs/development/w3-r17-independent-96block-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r17_independent_96block_calibration.py
  original-scientific-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r17_independent_96block_calibration.py --out build/w3-r17-independent-96block
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r17-original-96block-pointwise-calibration
          path: build/w3-r17-independent-96block/
          if-no-files-found: warn
          retention-days: 90
