name: science-w3-bootstrap-t-nested-unit-count

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_hc1_restudenization_nested_n.py"
      - "tests/test_w3_hc1_restudenization_nested_n.py"
      - ".github/workflows/science-w3-bootstrap-t-nested-unit-count.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-reference-contracts:
    name: Independent HC1 and bootstrap-t reference Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_hc1_restudenization_nested_n.py

  new-independent-blocks:
    name: W3 24 independent blocks, nested n 36/72/144, fixed vs bootstrap-t HC1
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Original 144-case source analysis; do not gate on observed coverage
        run: |
          python scripts/run_w3_hc1_restudenization_nested_n.py \
            --out build/w3-hc1-restudentization
      - name: Retain full source result including scientific noncoverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3-hc1-bootstrap-t-nested-n-original-evidence
          path: build/w3-hc1-restudentization/
          retention-days: 90
          if-no-files-found: warn
