name: science-w3-r89-observed-only-bounds
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r89_bounded_missing_gaze.py"
      - "tests/test_w3_r89_bounded_missing_gaze.py"
      - ".github/workflows/science-w3-r89-observed-only-bounds.yml"
      - "docs/development/w3-r89-observed-only-identification-protocol.md"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  nonidentification-and-evidence-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r89_bounded_missing_gaze.py

  original-observed-only-source-shards:
    needs: nonidentification-and-evidence-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 0, stop: 4}
          - {start: 4, stop: 8}
          - {start: 8, stop: 12}
          - {start: 12, stop: 16}
          - {start: 16, stop: 20}
          - {start: 20, stop: 24}
          - {start: 24, stop: 28}
          - {start: 28, stop: 32}
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m scripts.run_w3_r89_bounded_missing_gaze --start ${{ matrix.start }} --stop ${{ matrix.stop }} --out build/R89-shard/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r89-original-shard-${{ matrix.start }}
          path: build/R89-shard/
          if-no-files-found: warn
          retention-days: 90

  immutable-original-sharp-bound-ledger:
    needs:
      - nonidentification-and-evidence-contracts
      - original-observed-only-source-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: w3-r89-original-shard-*
          path: build/R89-shards/
          merge-multiple: false
      - run: python -m scripts.run_w3_r89_bounded_missing_gaze --merge-parts build/R89-shards/ --out build/R89-complete/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r89-original-32-block-finite-population-bounds
          path: build/R89-complete/
          if-no-files-found: warn
          retention-days: 90
