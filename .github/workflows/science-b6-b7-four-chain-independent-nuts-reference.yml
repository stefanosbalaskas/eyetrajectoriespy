name: science-b6-b7-four-chain-independent-nuts-reference

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/science-b6-b7-four-chain-independent-nuts-reference.yml"
      - "scripts/run_b6_b7_four_chain_reference.py"
      - "scripts/run_b6_b7_independent_pymc_nuts.py"
      - "tests/test_b6_b7_four_chain_reference.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-chain-reference-contracts:
    name: ArviZ invariant population covariance and provenance (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,bayesian]"
      - run: python -m pytest -q tests/test_b6_b7_four_chain_reference.py tests/test_b6_b7_longchain_identified_geometry.py

  actual-four-chain-NUTS:
    name: Fresh four-chain NUTS (${{ matrix.design }} replicate ${{ matrix.replicate }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        design: [B6_rank1, B7_rank1_paired, B7_rank1_asynchronous]
        replicate: [0, 1]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTENSOR_FLAGS: "cxx="
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,bayesian-pymc]"
      - name: Predeclared four-chain reference analytic and sign-invariance contracts
        run: python -m pytest -q tests/test_independent_b6_b7_nuts_reference.py tests/test_b6_b7_four_chain_reference.py
      - name: Actual fresh independently prior-generated posterior study
        run: |
          python scripts/run_b6_b7_four_chain_reference.py \
            --design ${{ matrix.design }} --replicate ${{ matrix.replicate }} \
            --draws 800 --warmup 1200 --cores 2 --master-seed 20261219 \
            --out build/four-chain/${{ matrix.design }}-${{ matrix.replicate }}
          python - <<'PY'
          from pathlib import Path
          import json
          folder=Path("build/four-chain/${{ matrix.design }}-${{ matrix.replicate }}")
          rows=json.loads((folder/"cases.json").read_text())
          evidence=json.loads((folder/"evidence.json").read_text())
          assert len(rows)==1 and evidence["attempts_in_this_shard"]==1
          assert not evidence["sbc_completed"] and not evidence["nominal_coverage_qualified"]
          assert not evidence["release_authorized"]
          row=rows[0]
          print("ACTUAL FOUR CHAIN CASE:",json.dumps(row,sort_keys=True))
          assert row["status"]=="ok", "Preserve and report fit exception; do not hide"
          assert row["n_chains"]==4 and row["reference_checks"]["sampler"]["sample_stats_chains"]==4
          assert row["n_identified_functionals"]>=6
          assert row["wall_seconds_full_reference_fit"]>0
          # Rhat, ESS, MCSE and zero divergences are REPORTED even on screen failure.
          # Do not tune or censor the scientific result to make CI green.
          PY
      - name: Preserve posterior diagnostics, fit times and all original SHA256 ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-chain-${{ matrix.design }}-${{ matrix.replicate }}
          path: build/four-chain/${{ matrix.design }}-${{ matrix.replicate }}/
          retention-days: 90
          if-no-files-found: warn

  original-source-audit:
    name: Verify all six original four-chain posterior fits and hashes
    needs: actual-four-chain-NUTS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: four-chain-*
          path: build/original
      - name: Verify all six independent generating seeds and source hashes
        run: |
          python - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path
          root=Path("build/original")
          rows=[]
          designs=("B6_rank1","B7_rank1_paired","B7_rank1_asynchronous")
          for design in designs:
              for rep in (0,1):
                  folder=root/f"four-chain-{design}-{rep}"
                  assert folder.is_dir(),folder
                  for line in (folder/"SHA256SUMS").read_text().splitlines():
                      h,path=line.split("  ")
                      assert sha256((folder/path).read_bytes()).hexdigest()==h
                  original=json.loads((folder/"cases.json").read_text())
                  ledger=json.loads((folder/"evidence.json").read_text())
                  assert len(original)==1
                  assert ledger["independent_truth_datasets_in_this_shard"]==1
                  assert not ledger["nominal_coverage_qualified"]
                  rows.extend(original)
          assert len(rows)==6 and len({x["generation_seed"] for x in rows})==6
          assert all(x["status"]=="ok" and x["n_chains"]==4 for x in rows)
          assert all(not x["posterior_coverage_qualified"] and not x["release_authorized"] for x in rows)
          print("FOUR-CHAIN REFERENCE SOURCE SUMMARY:",json.dumps({
              "actual_fits":len(rows),
              "distinct_prior_generated_datasets":len({x["generation_seed"] for x in rows}),
              "all_identified_screen_passed":sum(
                  x["reference_checks"]["all_identified_functionals_pass_exploratory_screen"]
                  for x in rows),
              "scientific_qualification":False,
              "publication_authorized":False,
          },sort_keys=True))
          PY
