name: science-w3-r8-participant-cluster-pointwise

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r8_cluster_inference_model_stress.py"
      - "tests/test_w3_r8_cluster_inference_model_stress.py"
      - ".github/workflows/science-w3-r8-participant-cluster-pointwise.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-contracts:
    name: W3 R8 participant cluster source contract Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r8_cluster_inference_model_stress.py

  original-scientific-source:
    name: W3 R8 64 generating blocks with trial clusters and paired basis misspecification
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Fit all 512 original paired-generating source cases; no coverage target gate
        run: |
          python scripts/run_w3_r8_cluster_inference_model_stress.py \
            --out build/w3-r8-participant-cluster
      - name: Preserve all source failures, uncertainty, plot and SHA256
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3-r8-original-cluster-uncertainty-evidence
          path: build/w3-r8-participant-cluster/
          retention-days: 90
          if-no-files-found: warn
