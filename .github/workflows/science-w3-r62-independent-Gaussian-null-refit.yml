name: science-w3-r62-new-independent-32-block-Gaussian-null-refit-size-pilot
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r62_independent_outer_null_bootstrap.py"
      - "tests/test_w3_r62_independent_outer_null_bootstrap.py"
      - "docs/development/w3-r62-independent-Gaussian-null-refit-size-pilot.md"
      - ".github/workflows/science-w3-r62-independent-Gaussian-null-refit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-Gaussian-sources-rank-Wilson-and-refusal-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r62_independent_outer_null_bootstrap.py

  original-new-independent-Gaussian-H0-refit-bootstrap-shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 0, stop: 4}
          - {start: 4, stop: 8}
          - {start: 8, stop: 12}
          - {start: 12, stop: 16}
          - {start: 16, stop: 20}
          - {start: 20, stop: 24}
          - {start: 24, stop: 28}
          - {start: 28, stop: 32}
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m scripts.run_w3_r62_independent_outer_null_bootstrap --start ${{ matrix.start }} --stop ${{ matrix.stop }} --out build/R62-original-part/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r62-original-Gaussian-null-bootstrap-source-${{ matrix.start }}
          path: build/R62-original-part/
          retention-days: 90
          if-no-files-found: warn

  full-new-independent-source-failure-inclusive-and-SHA256-aggregate:
    needs:
      - new-Gaussian-sources-rank-Wilson-and-refusal-contracts
      - original-new-independent-Gaussian-H0-refit-bootstrap-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: w3-r62-original-Gaussian-null-bootstrap-source-*
          path: build/R62-original-parts/
          merge-multiple: false
      - run: python -m scripts.run_w3_r62_independent_outer_null_bootstrap --merge-parts build/R62-original-parts/ --out build/R62-original-complete/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r62-original-32-independent-block-null-refit-results
          path: build/R62-original-complete/
          if-no-files-found: warn
          retention-days: 90
