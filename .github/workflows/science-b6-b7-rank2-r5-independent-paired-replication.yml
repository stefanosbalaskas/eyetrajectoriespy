name: science-b6-b7-rank2-r5-independent-paired-replication

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_b6_b7_rank2_r5_independent_replication.py"
      - "tests/test_b6_b7_rank2_r5_independent_replication.py"
      - ".github/workflows/science-b6-b7-rank2-r5-independent-paired-replication.yml"
  workflow_dispatch:
    inputs:
      replicate:
        description: "Predeclared independent generating block ID (0..7); stage 0 uses 0"
        required: true
        type: choice
        options: ["0","1","2","3","4","5","6","7"]
        default: "1"

permissions:
  contents: read

jobs:
  replication-contracts:
    name: Independent generating block, nesting, and denominator contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,bayesian]"
      - run: python -m pytest -q tests/test_b6_b7_rank2_r5_independent_replication.py

  actual-paired-replication:
    name: R5 independent block ${{ matrix.rep }} ${{ matrix.design }} n=${{ matrix.n }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        rep: ${{ fromJSON(format('[{0}]', inputs.replicate || '0')) }}
        design: [paired, asynchronous]
        n: [4, 12]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTENSOR_FLAGS: "cxx="
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,bayesian-pymc]"
      - name: Exact matched-truth study contracts
        run: python -m pytest -q tests/test_b6_b7_rank2_r5_independent_replication.py
      - name: Four-chain NUTS, full evidence including negative outcomes
        run: |
          python scripts/run_b6_b7_rank2_r5_independent_replication.py \
            --replicate ${{ matrix.rep }} --design ${{ matrix.design }} \
            --participants ${{ matrix.n }} \
            --out build/rank2-r5/rep${{ matrix.rep }}-${{ matrix.design }}-n${{ matrix.n }}
      - name: Retain positive and negative source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank2-r5-rep${{ matrix.rep }}-${{ matrix.design }}-n${{ matrix.n }}
          path: build/rank2-r5/rep${{ matrix.rep }}-${{ matrix.design }}-n${{ matrix.n }}/
          retention-days: 90
          if-no-files-found: warn

  original-source-audit:
    name: Failure-inclusive within-block source and SHA256 audit
    needs: actual-paired-replication
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,bayesian]"
      - uses: actions/download-artifact@v4
        with:
          pattern: rank2-r5-rep*-*
          path: build/original
      - name: Verify hashes, denominators, and single-block paired contrasts
        env:
          REPLICATE: ${{ inputs.replicate || '0' }}
        run: |
          python - <<'PY'
          import json
          import os
          from hashlib import sha256
          from pathlib import Path
          from scripts.run_b6_b7_rank2_r5_independent_replication import paired_block_audit
          replicate=int(os.environ["REPLICATE"])
          root=Path("build/original")
          cases=[]
          for design in ("paired","asynchronous"):
              for n in (4,12):
                  folder=root/f"rank2-r5-rep{replicate}-{design}-n{n}"
                  if not folder.is_dir():
                      continue
                  for line in (folder/"SHA256SUMS").read_text().splitlines():
                      digest,name=line.split("  ")
                      assert sha256((folder/name).read_bytes()).hexdigest()==digest
                  case=json.loads((folder/"case.json").read_text())
                  ledger=json.loads((folder/"evidence.json").read_text())
                  assert case["design"]==design and case["participants"]==n
                  assert ledger["replicate"]==replicate
                  assert not ledger["calibration_qualified"]
                  cases.append(case)
          report=paired_block_audit(cases,replicate)
          Path("build/rank2-r5-original-audit.json").write_text(
              json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("R5 INDEPENDENT BLOCK SOURCE AUDIT:",json.dumps(report,sort_keys=True))
          assert report["artifacts_present"]==4 and not report["missing_cells"]
          PY
      - name: Preserve audit even with nonconvergence or failed source fit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rank2-r5-failure-inclusive-audit
          path: build/rank2-r5-original-audit.json
          retention-days: 90
          if-no-files-found: warn
