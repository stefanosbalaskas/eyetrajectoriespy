name: science-w3-multiplier-budget-same-data

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_same_dataset_bootstrap_sensitivity.py"
      - "tests/test_w3_same_dataset_bootstrap_sensitivity.py"
      - ".github/workflows/science-w3-multiplier-budget-same-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  computational-contracts:
    name: Matched same-data bootstrap contracts Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_same_dataset_bootstrap_sensitivity.py

  matched-data-sensitivity:
    name: 16 matched original generating blocks; Rademacher/normal x 199/999 draws
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Same-source-data 2x2 bootstrap sensitivity with original evidence
        run: |
          python scripts/run_w3_same_dataset_bootstrap_sensitivity.py \
            --out build/w3-matched-multiplier-budget
      - name: Retain all positive and negative source outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3-same-data-multiplier-budget-original-evidence
          path: build/w3-matched-multiplier-budget/
          retention-days: 90
          if-no-files-found: warn
