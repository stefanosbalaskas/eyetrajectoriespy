name: science-w3-r69-independent-original-band-evidence
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r69_independent_original_coverage.py"
      - "tests/test_w3_r69_independent_original_coverage.py"
      - "docs/development/w3-r69-independent-original-coverage-audit.md"
      - ".github/workflows/science-w3-r69-independent-original-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-16unit-source-and-Wilson-paired-summary-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r69_independent_original_coverage.py

  independently-audit-original-frozen-16block-band-outcomes:
    needs: independent-16unit-source-and-Wilson-paired-summary-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Download immutable ORIGINAL R69 source archive without regenerating fitted trajectories
        uses: actions/download-artifact@v4
        with:
          repository: stefanosbalaskas/eyetrajectoriespy
          run-id: 39216304970
          name: w3-r69-immutable-new-source-simultaneous-band-mechanism-evidence
          github-token: ${{ github.token }}
          path: build/R69-independent-original-readonly/
      - name: Require exact original R69 scientific pull-request merge checkout
        run: grep -Fx 72f7acf6fac9f973ec96b672e30e926a6ec63c75 build/R69-independent-original-readonly/source-commit.txt
      - name: Independently reconstruct 16-source Wilson/paired coverage and SHA256 evidence
        run: python -m scripts.audit_w3_r69_independent_original_coverage --original build/R69-independent-original-readonly/ --expected-original-checkout 72f7acf6fac9f973ec96b672e30e926a6ec63c75 --out build/R69-independent-coverage-evidence/evidence.json
      - name: Publish independent evidence and unarchived maximum-statistic limitation
        run: cat build/R69-independent-coverage-evidence/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r69a-original-16block-independent-coverage-and-paired-audit
          path: build/R69-independent-coverage-evidence/
          if-no-files-found: warn
          retention-days: 90
