name: prepare-one-dot-zero-rc

on:
  push:
    branches:
      - release/1.0.0rc1-qualification

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/1.0.0rc1-qualification
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Promote active identity to literal 1.0.0rc1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path('.')
          OLD = '0.12.1.dev0'
          NEW = '1.0.0rc1'

          def replace_once(path_name, old, new):
              path = ROOT / path_name
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path_name}: expected token not found: {old!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('pyproject.toml', 'version = "0.12.1.dev0"', 'version = "1.0.0rc1"')
          replace_once('src/eyetrajectoriespy/__init__.py', '__version__ = "0.12.1.dev0"', '__version__ = "1.0.0rc1"')
          replace_once('CITATION.cff', 'version: 0.12.1.dev0', 'version: 1.0.0rc1\ndate-released: 2026-10-03')
          replace_once('tests/test_public_api.py', 'et.__version__=="0.12.1.dev0"', 'et.__version__=="1.0.0rc1"')

          for name in ('CANONICAL_WORKFLOWS.json', 'REFERENCE_VALIDATION.json', 'VALIDATION_TOLERANCES.json'):
              path = ROOT / name
              payload = json.loads(path.read_text(encoding='utf-8'))
              if payload.get('package_version') not in {OLD, '0.12.0'}:
                  raise SystemExit(f'{name}: unexpected package_version {payload.get("package_version")!r}')
              payload['package_version'] = NEW
              path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')

          # The old documentation validator presents 0.12.0 to its preserved
          # historical assertion layer, while active RC/final qualification
          # requires literal-version evidence rather than inherited 0.12 evidence.
          path = ROOT / 'scripts/validate_docs_contracts.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace('LEGACY_BASE_VERSION = "0.12.0"', 'BASE_VALIDATOR_VERSION = "0.12.0"')
          text = text.replace('return text.replace(et.__version__, LEGACY_BASE_VERSION)', 'return text.replace(et.__version__, BASE_VALIDATOR_VERSION)')
          old_block = '''    evidence_versions = {\n        json.loads(_ORIGINAL_READ_TEXT(path, encoding="utf-8")).get(\n            "package_version"\n        )\n        for path in EVIDENCE_FILES\n    }\n    if evidence_versions != {LEGACY_BASE_VERSION}:\n        raise RuntimeError(\n            "frozen qualification evidence must remain attributed to 0.12.0 "\n            f"during 0.12.1 development; found {sorted(evidence_versions)}"\n        )\n'''
          new_block = '''    evidence_versions = {\n        json.loads(_ORIGINAL_READ_TEXT(path, encoding="utf-8")).get(\n            "package_version"\n        )\n        for path in EVIDENCE_FILES\n    }\n    expected_evidence_version = (\n        BASE_VALIDATOR_VERSION if ".dev" in et.__version__ else et.__version__\n    )\n    if evidence_versions != {expected_evidence_version}:\n        raise RuntimeError(\n            "qualification evidence version does not match the active qualification "\n            f"identity {expected_evidence_version!r}; found {sorted(evidence_versions)}"\n        )\n'''
          if old_block not in text:
              raise SystemExit('scripts/validate_docs_contracts.py: evidence-version block not found')
          text = text.replace(old_block, new_block, 1)
          path.write_text(text, encoding='utf-8')

          # Production governance now requires the frozen 1.0 boundary itself.
          path = ROOT / 'scripts/verify_release_governance.py'
          text = path.read_text(encoding='utf-8')
          declaration = '    "one_dot_zero_api_stability_frozen",\n'
          if declaration not in text:
              anchor = '    "sparse_mfpca_performance_qualified",\n'
              if anchor not in text:
                  raise SystemExit('release-governance declaration anchor missing')
              text = text.replace(anchor, anchor + declaration, 1)
          check = '    "frozen-api-boundary",\n'
          if check not in text:
              anchor = '    "sparse-mfpca-performance-envelope",\n'
              if anchor not in text:
                  raise SystemExit('release-governance check anchor missing')
              text = text.replace(anchor, anchor + check, 1)
          path.write_text(text, encoding='utf-8')

          # Release-hardening tests must treat the literal RC as eligible only
          # after all exact-version evidence is aligned. Development-version
          # rejection tests remain as synthetic guards.
          path = ROOT / 'tests/test_release_hardening.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'CURRENT_DEVELOPMENT_VERSION = "0.12.1.dev0"',
              'CURRENT_DEVELOPMENT_VERSION = "1.0.0rc1"',
              1,
          )
          old_test = '''def test_development_version_contract_is_not_production_eligible():\n    module = _load_script("verify_release_version.py")\n    with pytest.raises(RuntimeError, match="development versions"):\n        module.verify_version_contract(\n            tag=f"v{CURRENT_DEVELOPMENT_VERSION}",\n            production=True,\n        )\n'''
          new_test = '''def test_release_candidate_contract_is_production_eligible_after_exact_qualification():\n    module = _load_script("verify_release_version.py")\n    assert (\n        module.verify_version_contract(\n            tag=f"v{CURRENT_DEVELOPMENT_VERSION}",\n            production=True,\n        )\n        == CURRENT_DEVELOPMENT_VERSION\n    )\n'''
          if old_test not in text:
              raise SystemExit('release hardening production-eligibility test block missing')
          text = text.replace(old_test, new_test, 1)
          old_evidence = '''def test_development_line_retains_frozen_012_evidence():\n    module = _load_script("verify_release_version.py")\n    assert set(module.qualified_evidence_contract().values()) == {"0.12.0"}\n    assert module.verify_version_contract() == CURRENT_DEVELOPMENT_VERSION\n'''
          new_evidence = '''def test_release_candidate_requires_literal_exact_version_evidence():\n    module = _load_script("verify_release_version.py")\n    assert set(module.qualified_evidence_contract().values()) == {\n        CURRENT_DEVELOPMENT_VERSION\n    }\n    assert module.verify_version_contract() == CURRENT_DEVELOPMENT_VERSION\n'''
          if old_evidence not in text:
              raise SystemExit('release hardening evidence test block missing')
          text = text.replace(old_evidence, new_evidence, 1)
          text = text.replace('"0.12.1rc1"', '"1.0.0rc2"')
          path.write_text(text, encoding='utf-8')

          # Dedicated 1.0 governance assertions keep the new gate visible.
          governance_test = ROOT / 'tests/test_one_dot_zero_release_governance.py'
          governance_test.write_text('''from pathlib import Path\nimport importlib.util\n\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef _load_governance():\n    path = ROOT / "scripts" / "verify_release_governance.py"\n    spec = importlib.util.spec_from_file_location("verify_release_governance", path)\n    module = importlib.util.module_from_spec(spec)\n    assert spec.loader is not None\n    spec.loader.exec_module(module)\n    return module\n\n\ndef test_1_0_release_governance_requires_frozen_api_boundary():\n    module = _load_governance()\n    assert "one_dot_zero_api_stability_frozen" in module._GITHUB_RELEASE_DECLARATIONS\n    assert "frozen-api-boundary" in module.REQUIRED_CHECKS\n\n\ndef test_1_0_api_boundary_workflow_runs_on_main():\n    workflow = (ROOT / ".github" / "workflows" / "one-dot-zero-api-stability.yml").read_text(encoding="utf-8")\n    assert "branches: [main]" in workflow\n    assert "name: frozen-api-boundary" in workflow\n''', encoding='utf-8')

          readiness_path = ROOT / 'RELEASE_READINESS.json'
          readiness = json.loads(readiness_path.read_text(encoding='utf-8'))
          readiness['current_development_version'] = NEW
          readiness['production_release_ready'] = False
          readiness['github_release_ready'] = False
          readiness.setdefault('gates', {})['one_dot_zero_api_stability_frozen'] = True
          notes = list(readiness.get('notes', []))
          additions = [
              'The explicit 1.0 API-stability boundary was frozen through PR #149 and merged as protected-main commit fb31bcdd9e5a3c5035c26382d8a0f250571d9c64 after the complete 16-workflow pull-request matrix passed. The boundary contains 455 stable public exports, three explicitly experimental exports, one intentional FDApy compatibility route, and zero authorized deprecations or removals.',
              '1.0.0rc1 is a release-stabilization candidate over that frozen scientific/API surface. It adds no estimator, numerical method, analytical default, dependency, deprecation, removal, or public API expansion.',
              'Literal 1.0.0rc1 qualification requires fresh package-wide performance evidence under the exact RC identity, the complete pull-request matrix, protected-main merge, and the complete exact-main matrix. Publication remains jointly disarmed until a later governance-only change.'
          ]
          for note in additions:
              if note not in notes:
                  notes.append(note)
          readiness['notes'] = notes
          readiness_path.write_text(json.dumps(readiness, indent=2) + '\n', encoding='utf-8')

          changelog = ROOT / 'CHANGELOG.md'
          text = changelog.read_text(encoding='utf-8')
          heading = '## 1.0.0rc1 (under qualification)\n'
          if heading not in text:
              title_end = text.find('\n')
              block = '''\n\n## 1.0.0rc1 (under qualification)\n\n- Freeze the evidence-backed 1.0 compatibility candidate boundary at 455 stable exports, with `conditional_transfer_entropy`, `discrete_transfer_entropy`, and `return_map_stability` explicitly experimental.\n- Preserve `fit_sparse_fpca_fdapy()` as an intentional stable compatibility route; introduce no deprecations, removals, mass renames, estimator changes, or new scientific methods.\n- Require fresh literal-`1.0.0rc1` performance evidence plus the complete pull-request and protected-main qualification matrices before publication can be armed.\n- Keep GitHub and production-PyPI publication readiness jointly disarmed during candidate qualification.\n'''
              text = text[:title_end] + block + text[title_end:]
              changelog.write_text(text, encoding='utf-8')

          readme = ROOT / 'README.md'
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              '**Stable:** `0.12.0` · **Development source:** `0.12.1.dev0` · **Python:** 3.11–3.13',
              '**Stable:** `0.12.0` · **1.0 release candidate under qualification:** `1.0.0rc1` · **Python:** 3.11–3.13',
              1,
          )
          old_dev = '''> **Development line: `0.12.1.dev0`**  \n> The current source line adds sparse-MFPCA visualization/API helpers only. It is not published, publication readiness remains disarmed, and the 0.12.0 estimator and qualification evidence remain unchanged.\n'''
          new_dev = '''> **1.0 release candidate under qualification: `1.0.0rc1`**  \n> The candidate freezes the evidence-backed 1.0 API boundary without adding a new estimator or changing scientific behavior. Publication readiness remains disarmed until fresh exact-RC performance and the complete PR plus protected-main qualification matrices pass.\n'''
          if old_dev not in text:
              raise SystemExit('README development-line block missing')
          readme.write_text(text.replace(old_dev, new_dev, 1), encoding='utf-8')

          # Update the active source-line wording in current documentation only.
          for name in (
              'docs/reference/api-stability.md',
              'docs/reference/api-consistency-audit.md',
              'docs/methods/status-roadmap.md',
              'docs/guides/sparse-multivariate-fpca.md',
          ):
              path = ROOT / name
              text = path.read_text(encoding='utf-8')
              text = text.replace('0.12.1.dev0', '1.0.0rc1')
              path.write_text(text, encoding='utf-8')

          # Replace only the active validation-target section; historical
          # validation records below remain immutable narrative evidence.
          path = ROOT / 'VALIDATION.md'
          text = path.read_text(encoding='utf-8')
          start = text.index('## Current development target\n')
          end = text.index('\nSee `docs/release-readiness.md`', start)
          section = '''## Current development target\n\n`1.0.0rc1` is the literal release-candidate identity under qualification; `0.12.0` remains the published stable release.\n\n- The 1.0 API candidate boundary is frozen at 455 stable exports and three explicitly experimental exports.\n- No deprecation, removal, mass rename, estimator change, dependency change, or analytical-default change is part of the RC transition.\n- `REFERENCE_VALIDATION.json` and `VALIDATION_TOLERANCES.json` are promoted to the literal RC qualification identity.\n- `PERFORMANCE_ENVELOPE.json` is deliberately not relabelled; a fresh exact-`1.0.0rc1` run must replace it and be archived as separate RC evidence.\n- The complete RC pull-request matrix and the complete post-merge exact-main matrix must pass before publication may be armed.\n- GitHub/PyPI publication readiness remains jointly false during qualification.\n'''
          path.write_text(text[:start] + section + text[end:], encoding='utf-8')

          def prepend_section(path_name, heading, body):
              path = ROOT / path_name
              text = path.read_text(encoding='utf-8')
              if heading in text:
                  return
              first_nl = text.find('\n')
              addition = f'\n\n{heading}\n\n{body.strip()}\n'
              path.write_text(text[:first_nl] + addition + text[first_nl:], encoding='utf-8')

          prepend_section(
              'docs/release-process.md',
              '## 1.0.0rc1 exact-version qualification',
              'The 1.0 release candidate is qualified as a literal package identity over the frozen 455-stable/3-experimental API boundary. Historical 0.12 release evidence remains immutable. Fresh RC performance, the full pull-request matrix, protected-main merge, and the full exact-main matrix are required before a separate governance-only change may arm publication.',
          )
          prepend_section(
              'docs/release-readiness.md',
              '## 1.0.0rc1 qualification',
              'The API boundary is frozen and the scientific surface is closed. `1.0.0rc1` adds no new estimator or breaking API change. Publication remains disarmed while literal-version evidence is generated and the complete PR and exact-main matrices run.',
          )

          index = ROOT / 'docs/index.md'
          text = index.read_text(encoding='utf-8')
          if '1.0.0rc1 under qualification' not in text:
              first_nl = text.find('\n')
              addition = '''\n\n!!! info "1.0.0rc1 under qualification"\n    The evidence-backed 1.0 API boundary is frozen at 455 stable exports and three explicitly experimental APIs. The release candidate adds no new estimator and remains unpublished until fresh exact-version and complete protected-main qualification pass.\n'''
              text = text[:first_nl] + addition + text[first_nl:]
              index.write_text(text, encoding='utf-8')

          release_note = ROOT / 'docs/releases/1.0.0rc1.md'
          if release_note.exists():
              raise SystemExit('docs/releases/1.0.0rc1.md already exists')
          release_note.write_text('''# eyetrajectoriespy 1.0.0rc1\n\n**Release candidate — under exact-version qualification**\n\n`1.0.0rc1` is the first candidate over the explicitly frozen 1.0 public API boundary. It does not add a new estimator, numerical method, analytical default, dependency, deprecation, removal, or public API expansion.\n\n## Frozen compatibility candidate\n\nThe machine-readable `ONE_DOT_ZERO_API_STABILITY.json` boundary contains 458 public exports: 455 stable candidates and three explicitly experimental APIs (`conditional_transfer_entropy`, `discrete_transfer_entropy`, and `return_map_stability`). `fit_sparse_fpca_fdapy()` remains an intentional stable compatibility route.\n\n## Qualification rule\n\nThe package must generate fresh performance evidence under the literal `1.0.0rc1` identity, pass the complete pull-request matrix, merge through protected `main`, and pass the complete exact-main matrix. Historical 0.12 qualification and release artifacts remain immutable and are not relabelled as RC evidence.\n\n## Publication governance\n\nGitHub and production-PyPI publication are disarmed during qualification. Publication may be armed only through a later governance-only reviewed change after exact-main RC qualification succeeds.\n''', encoding='utf-8')

          mkdocs = ROOT / 'mkdocs.yml'
          text = mkdocs.read_text(encoding='utf-8')
          anchor = '      - 0.12.0: releases/0.12.0.md\n'
          line = '      - 1.0.0rc1: releases/1.0.0rc1.md\n'
          if line not in text:
              if anchor not in text:
                  raise SystemExit('mkdocs 0.12.0 release nav entry missing')
              text = text.replace(anchor, line + anchor, 1)
          mkdocs.write_text(text, encoding='utf-8')

          # One-shot bootstrap: do not retain a branch-mutating preparation workflow.
          (ROOT / '.github/workflows/prepare-one-dot-zero-rc.yml').unlink()
          PY
      - name: Sanity-check qualification boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert 'version = "1.0.0rc1"' in Path('pyproject.toml').read_text()
          assert '__version__ = "1.0.0rc1"' in Path('src/eyetrajectoriespy/__init__.py').read_text()
          assert 'version: 1.0.0rc1' in Path('CITATION.cff').read_text()
          readiness = json.loads(Path('RELEASE_READINESS.json').read_text())
          assert readiness['current_development_version'] == '1.0.0rc1'
          assert readiness['production_release_ready'] is False
          assert readiness['github_release_ready'] is False
          assert readiness['gates']['one_dot_zero_api_stability_frozen'] is True
          assert json.loads(Path('REFERENCE_VALIDATION.json').read_text())['package_version'] == '1.0.0rc1'
          assert json.loads(Path('VALIDATION_TOLERANCES.json').read_text())['package_version'] == '1.0.0rc1'
          # Intentionally stale until a fresh exact-RC performance workflow is retained.
          assert json.loads(Path('PERFORMANCE_ENVELOPE.json').read_text())['package_version'] == '0.12.0'
          assert not Path('.github/workflows/prepare-one-dot-zero-rc.yml').exists()
          PY
      - name: Commit RC qualification preparation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare literal 1.0.0rc1 qualification"
          git push origin HEAD:release/1.0.0rc1-qualification
