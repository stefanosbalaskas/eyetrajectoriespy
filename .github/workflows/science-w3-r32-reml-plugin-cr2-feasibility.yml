name: science-w3-r32-reml-plugin-cr2-feasibility
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r32_reml_plugin_cr2_feasibility.py"
      - "tests/test_w3_r32_reml_plugin_cr2_feasibility.py"
      - ".github/workflows/science-w3-r32-reml-plugin-cr2-feasibility.yml"
      - "docs/development/w3-r32-reml-plugin-cr2-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oracle-covariance-and-coverage-ledger-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r32_reml_plugin_cr2_feasibility.py
  original-128case-failure-inclusive-pointwise-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r32_reml_plugin_cr2_feasibility.py --out build/w3-r32-inferential-pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r32-original-128case-failure-inclusive-cr2-pilot
          path: build/w3-r32-inferential-pilot/
          retention-days: 90
          if-no-files-found: warn
