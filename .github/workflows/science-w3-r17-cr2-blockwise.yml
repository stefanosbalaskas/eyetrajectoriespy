name: science-w3-r17-cr2-blockwise
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/w3_r17_cr2_blockwise.py"
      - "tests/test_w3_r17_cr2_blockwise.py"
      - ".github/workflows/science-w3-r17-cr2-blockwise.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blockwise-vs-dense:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r17_cr2_blockwise.py
