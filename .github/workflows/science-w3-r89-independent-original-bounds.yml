name: science-w3-r89-independent-original-bounds
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r89_original_finite_bounds_independent.py"
      - "tests/test_w3_r89_independent_original_bounds_audit.py"
      - ".github/workflows/science-w3-r89-independent-original-bounds.yml"
      - "docs/development/w3-r89-independent-original-evidence.md"
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  independent-bound-and-provenance-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r89_independent_original_bounds_audit.py

  mandatory-independent-real-R89-original-replay:
    needs: independent-bound-and-provenance-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          name: w3-r89-original-32-block-finite-population-bounds
          run-id: 39696542346
          github-token: ${{ github.token }}
          repository: stefanosbalaskas/eyetrajectoriespy
          path: build/R89-original-readonly/
      - run: python -m scripts.audit_w3_r89_original_finite_bounds_independent --original build/R89-original-readonly/ --out build/R89-independent-audit/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r89-A-independent-replayed-original-sharp-bounds
          path: build/R89-independent-audit/
          if-no-files-found: warn
          retention-days: 90
