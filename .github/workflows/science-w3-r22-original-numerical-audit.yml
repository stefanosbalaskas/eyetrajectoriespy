name: science-w3-r22-original-numerical-audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r22_original_256case_audit.py"
      - "tests/test_w3_r22_original_256case_audit.py"
      - ".github/workflows/science-w3-r22-original-numerical-audit.yml"
      - "scripts/w3_r22_scaled_cholesky_cr2.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-replay-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r22_original_256case_audit.py
  original-256case-stable-vs-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r22_original_256case_audit.py --out build/w3-r22-original-256case
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r22-original-256case-numerical-ledger
          path: build/w3-r22-original-256case/
          retention-days: 90
          if-no-files-found: warn
