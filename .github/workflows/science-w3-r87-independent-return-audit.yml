name: science-w3-r87-independent-original-audit-return-replay
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r87_original_nonresponse_independent.py"
      - "tests/test_w3_r87_independent_original_nonresponse_audit.py"
      - ".github/workflows/science-w3-r87-independent-return-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-source-and-selection-model-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r87_independent_original_nonresponse_audit.py

  independently-replay-immutable-R87-original-32-block-source:
    needs: independent-source-and-selection-model-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy
      - uses: actions/download-artifact@v4
        with:
          name: w3-r87-original-32-block-audit-return-evidence
          run-id: 39646565487
          github-token: ${{ github.token }}
          repository: stefanosbalaskas/eyetrajectoriespy
          path: build/R87-original-readonly/
      - run: python -m scripts.audit_w3_r87_original_nonresponse_independent --original build/R87-original-readonly/ --out build/R87-independent-audit/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r87-independent-replayed-audit-return-evidence
          path: build/R87-independent-audit/
          if-no-files-found: warn
          retention-days: 90
