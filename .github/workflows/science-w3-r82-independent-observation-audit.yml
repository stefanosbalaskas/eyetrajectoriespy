name: science-w3-r82-independent-observation-audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r82_observation_process.py"
      - "tests/test_w3_r82_independent_observation_audit.py"
      - "docs/development/w3-r82-independent-observation-audit.md"
      - ".github/workflows/science-w3-r82-independent-observation-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independently-replay-masked-unit-source-and-HC3-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Independent original X/Y, HC3 original and regularized covariances, masked known-t5 and wild/Gaussian maxima and refusal/tamper contracts
        run: python -m pytest -q tests/test_w3_r82_independent_observation_audit.py

  independently-audit-genuine-immutable-original-R82-256sources:
    needs: independently-replay-masked-unit-source-and-HC3-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Download exact original R82 heavy-tail and masked-contamination archive, never fixture data
        uses: actions/download-artifact@v4
        with:
          repository: stefanosbalaskas/eyetrajectoriespy
          run-id: 39571308151
          name: w3-r82-original-256source-1024mask-evidence
          github-token: ${{ github.token }}
          path: build/R82-A-original-source-readonly/
      - name: Require frozen exact R82 original scientific source checkout
        run: grep -Fx 06d1bb888468f1f85eee3875ae14ee5070a12400 build/R82-A-original-source-readonly/source-commit.txt
      - name: Independently replay all 256 complete source X/Y, 1024 paired MCAR/MAR/MNAR masks, pointwise slopes and native NaN refusal checks
        run: python -m scripts.audit_w3_r82_observation_process --original build/R82-A-original-source-readonly/ --expected-checkout 06d1bb888468f1f85eee3875ae14ee5070a12400 --out build/R82-A-independent-original-evidence/evidence.json
      - name: Display independent 32-block source and 2x2 coverage decomposition with calibration withheld
        run: cat build/R82-A-independent-original-evidence/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r82a-independent-256source-1024mask-observation-audit
          path: build/R82-A-independent-original-evidence/
          if-no-files-found: warn
          retention-days: 90
