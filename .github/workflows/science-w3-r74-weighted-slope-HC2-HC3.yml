name: science-w3-r74-new-weighted-slope-HC2-HC3-heteroskedastic
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r74_new_weighted_slope_hc2_hc3.py"
      - "tests/test_w3_r74_new_weighted_slope_hc2_hc3.py"
      - "docs/development/w3-r74-prospective-weighted-slope-HC2-HC3-protocol.md"
      - ".github/workflows/science-w3-r74-weighted-slope-HC2-HC3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prospective-Gaussian-weighted-HC2-HC3-and-original-W3-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Validate NEW paired source Gaussian law, analytic unequal-slope covariance, HC2/HC3 algebra and original W3 numerical reference
        run: python -m pytest -q tests/test_w3_r74_new_weighted_slope_hc2_hc3.py

  eight-fresh-independent-source-weighted-HC2-HC3-shards:
    needs: prospective-Gaussian-weighted-HC2-HC3-and-original-W3-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 0, stop: 4}
          - {start: 4, stop: 8}
          - {start: 8, stop: 12}
          - {start: 12, stop: 16}
          - {start: 16, stop: 20}
          - {start: 20, stop: 24}
          - {start: 24, stop: 28}
          - {start: 28, stop: 32}
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Generate frozen fresh 4-block Gaussian designs and all slope-weighted HC2/HC3 wild/normal maxima
        run: python -m scripts.run_w3_r74_new_weighted_slope_hc2_hc3 --start ${{ matrix.start }} --stop ${{ matrix.stop }} --out build/R74-original-shard/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r74-new-weighted-slope-HC2-HC3-source-${{ matrix.start }}
          path: build/R74-original-shard/
          if-no-files-found: warn
          retention-days: 90

  complete-512case-independent-source-SHA256-aggregate:
    needs:
      - prospective-Gaussian-weighted-HC2-HC3-and-original-W3-contracts
      - eight-fresh-independent-source-weighted-HC2-HC3-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: w3-r74-new-weighted-slope-HC2-HC3-source-*
          path: build/R74-all-shards/
          merge-multiple: false
      - name: Validate original source SHA256, all 32 generating blocks and full refusal-inclusive coverage
        run: python -m scripts.run_w3_r74_new_weighted_slope_hc2_hc3 --merge-parts build/R74-all-shards/ --out build/R74-original-immutable/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r74-original-32block-weighted-slope-HC2-HC3-evidence
          path: build/R74-original-immutable/
          if-no-files-found: warn
          retention-days: 90
