name: science-w3-r53-local-REML-influence
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r53_local_reml_influence.py"
      - "tests/test_w3_r53_local_reml_influence.py"
      - "docs/development/w3-r53-local-reml-influence-protocol.md"
      - ".github/workflows/science-w3-r53-local-REML-influence.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analytic-REML-Hessian-response-CR2-gradient-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r53_local_reml_influence.py

  original-independent-local-influence-and-centered-refits:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r53_local_reml_influence.py --out build/w3-r53-original-local-influence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r53-original-REML-CR2-local-influence-evidence
          path: build/w3-r53-original-local-influence/
          if-no-files-found: warn
          retention-days: 90
