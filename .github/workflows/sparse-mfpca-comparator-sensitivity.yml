name: sparse-mfpca-comparator-sensitivity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  two-stage-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Run two-stage marginal-basis sensitivity
        run: |
          python scripts/run_sparse_mfpca_comparator_sensitivity.py \
            --mode two-stage \
            --output-dir sparse-mfpca-two-stage
      - name: Verify descriptive contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("sparse-mfpca-two-stage")
          payload = json.loads(
              (root / "two_stage_sensitivity.json").read_text()
          )
          if payload.get("evidence_type") != "cross_implementation_sensitivity":
              raise SystemExit("unexpected evidence type")
          if payload.get("architecture_winner_selected") is not False:
              raise SystemExit("two-stage sensitivity must not choose a winner")
          if payload.get("automatic_rank_selection") is not False:
              raise SystemExit("two-stage sensitivity must use declared ranks")
          rows = payload.get("rows", [])
          if {row.get("marginal_rank") for row in rows} != {1, 2}:
              raise SystemExit("two-stage sensitivity must contain ranks 1 and 2")
          PY
      - name: Upload two-stage sensitivity evidence
        uses: actions/upload-artifact@v4
        with:
          name: sparse-mfpca-two-stage-sensitivity
          path: sparse-mfpca-two-stage
          if-no-files-found: error

  mgsfpca-sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install eyetrajectoriespy
        run: |
          python -m pip install -U pip
          python -m pip install -e .
      - name: Generate frozen native/truth comparator fixture
        run: |
          python scripts/run_sparse_mfpca_comparator_sensitivity.py \
            --mode external-fixture \
            --output-dir sparse-mfpca-mgsfpca
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Install R system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
      - name: Install exact mGSFPCA comparator
        run: |
          Rscript -e 'install.packages("remotes", repos="https://cloud.r-project.org")'
          Rscript -e 'remotes::install_version("mGSFPCA", version="0.2.2", repos="https://cloud.r-project.org", upgrade="never")'
          Rscript -e 'stopifnot(as.character(utils::packageVersion("mGSFPCA")) == "0.2.2")'
      - name: Run external mGSFPCA comparator
        run: |
          Rscript validation/sparse_mfpca/run_mgsfpca.R sparse-mfpca-mgsfpca
      - name: Evaluate invariant comparator sensitivity
        run: |
          python scripts/evaluate_sparse_mfpca_mgsfpca.py sparse-mfpca-mgsfpca
      - name: Verify external sensitivity contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("sparse-mfpca-mgsfpca")
          required = {
              "external_fixture_x.csv",
              "external_fixture_y.csv",
              "external_fixture_truth.json",
              "native_eigenvalues.csv",
              "native_scores.csv",
              "native_eigenfunctions_x.csv",
              "native_eigenfunctions_y.csv",
              "mgsfpca_id_mapping.csv",
              "mgsfpca_eigenvalues.csv",
              "mgsfpca_scores.csv",
              "mgsfpca_eigenfunctions_x.csv",
              "mgsfpca_eigenfunctions_y.csv",
              "mgsfpca_run_metadata.txt",
              "mgsfpca_sensitivity.json",
          }
          missing = sorted(
              name for name in required if not (root / name).exists()
          )
          if missing:
              raise SystemExit(
                  f"missing sparse MFPCA comparator evidence: {missing}"
              )
          payload = json.loads(
              (root / "mgsfpca_sensitivity.json").read_text()
          )
          if payload.get("comparator_version") != "0.2.2":
              raise SystemExit("unexpected mGSFPCA version")
          if payload.get("equivalence_claim") is not False:
              raise SystemExit("mGSFPCA evidence must not claim equivalence")
          if payload.get("architecture_winner_selected") is not False:
              raise SystemExit("mGSFPCA evidence must not choose a winner")
          PY
      - name: Upload mGSFPCA sensitivity evidence
        uses: actions/upload-artifact@v4
        with:
          name: sparse-mfpca-mgsfpca-sensitivity
          path: sparse-mfpca-mgsfpca
          if-no-files-found: error
