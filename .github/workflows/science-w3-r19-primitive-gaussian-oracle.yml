name: science-w3-r19-primitive-gaussian-oracle
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r19_primitive_gaussian_oracle.py"
      - "tests/test_w3_r19_primitive_gaussian_oracle.py"
      - ".github/workflows/science-w3-r19-primitive-gaussian-oracle.yml"
      - "docs/development/w3-r18-original-gaussian-oracle-coverage-contract.json"
      - "docs/development/w3-r19-primitive-gaussian-oracle-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  primitive-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r19_primitive_gaussian_oracle.py
  original-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r19_primitive_gaussian_oracle.py --out build/w3-r19-primitive-gaussian-oracle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r19-original-primitive-gaussian-audit
          path: build/w3-r19-primitive-gaussian-oracle/
          retention-days: 90
          if-no-files-found: warn
