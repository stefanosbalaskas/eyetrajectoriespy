name: science-w3-r80-independent-unit-student-t5-audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r80_independent_student_t5_source.py"
      - "tests/test_w3_r80_independent_student_t5_source.py"
      - "docs/development/w3-r80-independent-unit-student-t5-audit.md"
      - ".github/workflows/science-w3-r80-independent-unit-student-t5-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independently-replay-Gaussian-source-and-true-HC3-correlation-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Independent original X/Y, HC3 original and regularized covariances, five Gaussian/wild max and refusal/tamper contracts
        run: python -m pytest -q tests/test_w3_r80_independent_student_t5_source.py

  independently-audit-genuine-immutable-original-R80-256sources:
    needs: independently-replay-Gaussian-source-and-true-HC3-correlation-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Download unchanged original R80 scaled-AR1 source archive, not fixture data
        uses: actions/download-artifact@v4
        with:
          repository: stefanosbalaskas/eyetrajectoriespy
          run-id: 39487449656
          name: w3-r80-original-new-32block-student-t5-evidence
          github-token: ${{ github.token }}
          path: build/R80-A-original-source-readonly/
      - name: Require frozen exact R80 original scientific source checkout
        run: grep -Fx c3c590788a8d126c73e59d7e0e799d6f39f0d655 build/R80-A-original-source-readonly/source-commit.txt
      - name: Independently replay 256 primitive independent-unit Student-t5 source X/Y and all 999 original wild and four Gaussian-reference maxima
        run: python -m scripts.audit_w3_r80_independent_student_t5_source --original build/R80-A-original-source-readonly/ --expected-checkout c3c590788a8d126c73e59d7e0e799d6f39f0d655 --out build/R80-A-independent-original-evidence/evidence.json
      - name: Display independent 32-block source and 2x2 coverage decomposition with calibration withheld
        run: cat build/R80-A-independent-original-evidence/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r80a-independent-original-256source-covariance-regularization
          path: build/R80-A-independent-original-evidence/
          if-no-files-found: warn
          retention-days: 90
