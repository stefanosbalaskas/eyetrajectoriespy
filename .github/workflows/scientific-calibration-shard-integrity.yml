name: scientific-calibration-shard-integrity

on:
  pull_request:
    paths:
      - "src/eyetrajectoriespy/research/calibration_seed.py"
      - "src/eyetrajectoriespy/research/power_planning.py"
      - "scripts/run_b6_population_calibration_grid.py"
      - "scripts/run_b7_learned_planar_truth_pilot.py"
      - "scripts/run_f1_f5_scientific_stress.py"
      - "scripts/aggregate_scientific_calibration_shards.py"
      - "tests/test_scientific_calibration_shards.py"
      - "docs/development/scientific-calibration-shards.md"
      - "SCIENTIFIC_CALIBRATION_BATCH_QUALIFICATION.json"
      - ".github/workflows/scientific-calibration-shard-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard-integrity:
    name: Independent batch/scenario/fit-failure integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11","3.12","3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install research suite
        run: python -m pip install -e ".[dev]"
      - name: Validate independent seed and evidence aggregation contracts
        run: python -m pytest -q tests/test_scientific_calibration_shards.py
      - name: Validate no scientific or release gate was promoted
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import eyetrajectoriespy as et
          manifest=json.loads(Path("SCIENTIFIC_CALIBRATION_BATCH_QUALIFICATION.json").read_text())
          assert not manifest["scientific_inference_qualified"]
          assert not manifest["release_authorized"]
          assert not manifest["large_scale_simulations_completed"]
          assert not hasattr(et,"calibration_replicate_seed")
          state=json.loads(Path("RELEASE_READINESS.json").read_text())
          assert not state["production_release_ready"]
          assert not state["github_release_ready"]
          print("PASS scientific aggregation integrity, all inferential and publication gates false")
          PY
