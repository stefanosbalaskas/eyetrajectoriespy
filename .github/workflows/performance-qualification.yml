name: performance-qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  performance-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      EYETRAJECTORIESPY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Stage literal 1.1.0rc1 identity on the qualification branch
        if: github.event_name == 'pull_request' && github.head_ref == 'release/1.1.0rc1-qualification'
        run: |
          python scripts/_r5_apply_rc_identity.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pyproject.toml src/eyetrajectoriespy/__init__.py CITATION.cff CANONICAL_WORKFLOWS.json RELEASE_READINESS.json README.md CHANGELOG.md VALIDATION.md docs/methods/status-roadmap.md docs/release-readiness.md docs/release-process.md docs/releases/1.1.0rc1.md mkdocs.yml
            git commit -m "Open literal 1.1.0rc1 qualification identity"
            git push origin HEAD:release/1.1.0rc1-qualification
          fi
          echo "EYETRAJECTORIESPY_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - name: Run repeated performance qualification
        run: |
          python scripts/run_performance_qualification.py \
            --profile ci-qualification \
            --repeats 3 \
            --output performance-envelope.json
      - name: Commit fresh literal-RC qualification evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'release/1.1.0rc1-qualification'
        run: |
          python scripts/_r5_commit_exact_rc_evidence.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REFERENCE_VALIDATION.json VALIDATION_TOLERANCES.json PERFORMANCE_ENVELOPE.json validation/performance/PERFORMANCE_ENVELOPE-1.1.0rc1.json tests/test_qualification_ledgers.py tests/test_public_api.py tests/test_release_hardening.py scripts/validate_docs_contracts.py ONE_DOT_ONE_RC_QUALIFICATION.json
          if ! git diff --cached --quiet; then
            git commit -m "Add fresh literal 1.1.0rc1 qualification evidence"
            git push origin HEAD:release/1.1.0rc1-qualification
          fi
      - name: Upload performance envelope
        uses: actions/upload-artifact@v4
        with:
          name: performance-envelope
          path: performance-envelope.json
