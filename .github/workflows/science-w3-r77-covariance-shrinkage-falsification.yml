name: science-w3-r77-covariance-shrinkage-falsification
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r77_covariance_shrinkage_falsification.py"
      - "tests/test_w3_r77_covariance_shrinkage_falsification.py"
      - "docs/development/w3-r77-prospective-covariance-regularization.md"
      - ".github/workflows/science-w3-r77-covariance-shrinkage-falsification.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-source-HC3-covariance-regularization-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Validate prespecified HC3 covariance regularization, source pairing and numerical oracles
        run: python -m pytest -q tests/test_w3_r77_covariance_shrinkage_falsification.py

  eight-new-independent-source-reference-shards:
    needs: new-source-HC3-covariance-regularization-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 0, stop: 4}
          - {start: 4, stop: 8}
          - {start: 8, stop: 12}
          - {start: 12, stop: 16}
          - {start: 16, stop: 20}
          - {start: 20, stop: 24}
          - {start: 24, stop: 28}
          - {start: 28, stop: 32}
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Generate 256 independently sourced R77 cases and five 999-draw maximum references
        run: python -m scripts.run_w3_r77_covariance_shrinkage_falsification --start ${{ matrix.start }} --stop ${{ matrix.stop }} --out build/R77-source/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r77-original-regularization-source-${{ matrix.start }}
          path: build/R77-source/
          if-no-files-found: warn
          retention-days: 90

  complete-original-256source-immutable-Gaussian-factorial-aggregate:
    needs:
      - new-source-HC3-covariance-regularization-contracts
      - eight-new-independent-source-reference-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: w3-r77-original-regularization-source-*
          path: build/R77-all-source-shards/
          merge-multiple: false
      - name: Verify complete eight-shard 32 independent primitive blocks and original source SHA256
        run: python -m scripts.run_w3_r77_covariance_shrinkage_falsification --merge-parts build/R77-all-source-shards/ --out build/R77-original-immutable/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r77-original-new-32block-covariance-regularization-evidence
          path: build/R77-original-immutable/
          if-no-files-found: warn
          retention-days: 90
