name: science-independent-PyMC-NUTS-B6-B7-reference

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/science-independent-PyMC-NUTS-B6-B7-reference.yml"
      - "scripts/run_b6_b7_independent_pymc_nuts.py"
      - "tests/test_independent_b6_b7_nuts_reference.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numpy-reference-input-contracts:
    name: Native truth and channel-major independent model checks (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_independent_b6_b7_nuts_reference.py

  actual-independent-PyMC-NUTS-reference:
    name: 3 truly independent NUTS posterior targets versus native B6/B7 Gibbs
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTENSOR_FLAGS: "cxx="
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,bayesian-pymc]"
      - name: Native cross-backend prior/likelihood data contracts
        run: python -m pytest -q tests/test_independent_b6_b7_nuts_reference.py tests/test_bayesian_partially_collapsed_mean.py tests/test_b6_b7_identifiable_posterior_diagnostics.py
      - name: Independent PyMC analytical-score-marginalization and NUTS posterior refits
        run: |
          python scripts/run_b6_b7_independent_pymc_nuts.py \
            --replicates 1 --nuts-draws 300 --nuts-warmup 500 \
            --gibbs-draws 350 --gibbs-warmup 650 \
            --master-seed 20261127 \
            --out build/nuts-v-native-bayes > independent-nuts-console.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("build/nuts-v-native-bayes")
          results=json.loads((root/"evidence.json").read_text())
          cases=json.loads((root/"cases.json").read_text())
          assert len(cases)==results["attempts"]==3
          assert {r["design"] for r in cases}=={
              "B6_rank1","B7_rank1_paired","B7_rank1_asynchronous"}
          assert not results["posterior_coverage_qualified"]
          assert not results["rank_SBC_completed"]
          assert not results["publication_authorized"]
          assert not results["release_authorized"]
          for row in cases:
              print("INDEPENDENT NUTS BACKEND SCIENCE:",json.dumps(row,sort_keys=True))
          assert all(x["status"]=="ok" for x in cases), "retain failure cases, do not qualify"
          PY
      - name: Retain independent PyMC and native posterior comparison with source SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b6-b7-independent-score-marginalized-NUTS-crossbackend
          path: build/nuts-v-native-bayes/
          retention-days: 90
          if-no-files-found: warn
