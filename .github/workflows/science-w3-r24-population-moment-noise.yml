name: science-w3-r24-population-moment-noise
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r24_expected_moment_noise.py"
      - "tests/test_w3_r24_expected_moment_noise.py"
      - ".github/workflows/science-w3-r24-population-moment-noise.yml"
      - "docs/development/w3-r24-population-moment-noise-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analytic-population-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r24_expected_moment_noise.py
  original-frozen-design-conditional-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r24_expected_moment_noise.py --out build/w3-r24-population-moments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r24-frozen-original-design-conditional-moments
          path: build/w3-r24-population-moments/
          retention-days: 90
          if-no-files-found: warn
