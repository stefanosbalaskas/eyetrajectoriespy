name: science-w3-r78-independent-temporal-covariance-audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r78_independent_temporal_covariance.py"
      - "tests/test_w3_r78_independent_temporal_covariance.py"
      - "docs/development/w3-r78-independent-temporal-covariance-audit.md"
      - ".github/workflows/science-w3-r78-independent-temporal-covariance-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independently-replay-Gaussian-source-and-true-HC3-correlation-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Independent original X/Y, HC3 original and regularized covariances, five Gaussian/wild max and refusal/tamper contracts
        run: python -m pytest -q tests/test_w3_r78_independent_temporal_covariance.py

  independently-audit-genuine-immutable-original-R78-256sources:
    needs: independently-replay-Gaussian-source-and-true-HC3-correlation-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Download unchanged original R78 scaled-AR1 source archive, not fixture data
        uses: actions/download-artifact@v4
        with:
          repository: stefanosbalaskas/eyetrajectoriespy
          run-id: 39477000929
          name: w3-r78-original-new-32block-temporal-AR1-evidence
          github-token: ${{ github.token }}
          path: build/R78-A-original-source-readonly/
      - name: Require frozen exact R78 original scientific source checkout
        run: grep -Fx f438b9680d81f5e5e3e893b1ff7a0bc93383a619 build/R78-A-original-source-readonly/source-commit.txt
      - name: Independently replay 256 primitive Gaussian source X/Y and all 999 original wild and four Gaussian-reference maxima
        run: python -m scripts.audit_w3_r78_independent_temporal_covariance --original build/R78-A-original-source-readonly/ --expected-checkout f438b9680d81f5e5e3e893b1ff7a0bc93383a619 --out build/R78-A-independent-original-evidence/evidence.json
      - name: Display independent 32-block source and 2x2 coverage decomposition with calibration withheld
        run: cat build/R78-A-independent-original-evidence/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r78a-independent-original-256source-covariance-regularization
          path: build/R78-A-independent-original-evidence/
          if-no-files-found: warn
          retention-days: 90
