name: science-w3-r90-audit-saturation-return-floor
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r90_audit_saturation.py"
      - "tests/test_w3_r90_audit_saturation.py"
      - ".github/workflows/science-w3-r90-saturation.yml"
      - "docs/development/w3-r90-audit-saturation-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  saturation-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r90_audit_saturation.py
  new-source-shards:
    needs: saturation-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 0, stop: 4}
          - {start: 4, stop: 8}
          - {start: 8, stop: 12}
          - {start: 12, stop: 16}
          - {start: 16, stop: 20}
          - {start: 20, stop: 24}
          - {start: 24, stop: 28}
          - {start: 28, stop: 32}
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m scripts.run_w3_r90_audit_saturation --start ${{ matrix.start }} --stop ${{ matrix.stop }} --out build/R90-shard/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r90-original-shard-${{ matrix.start }}
          path: build/R90-shard/
          if-no-files-found: warn
          retention-days: 90
  original-sha256-saturation-archive:
    needs: [saturation-contracts, new-source-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: w3-r90-original-shard-*
          path: build/R90-parts/
          merge-multiple: false
      - run: python -m scripts.run_w3_r90_audit_saturation --merge-parts build/R90-parts/ --out build/R90-complete/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r90-immutable-original-audit-saturation-1280-records
          path: build/R90-complete/
          if-no-files-found: warn
          retention-days: 90
