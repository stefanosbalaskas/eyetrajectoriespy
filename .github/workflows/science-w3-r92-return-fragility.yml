name: science-w3-r92-near-complete-return-fragility
on:
  pull_request:
    types: [opened,synchronize]
    paths:
      - "scripts/run_w3_r92_return_fragility.py"
      - "tests/test_w3_r92_return_fragility.py"
      - ".github/workflows/science-w3-r92-return-fragility.yml"
      - "docs/development/w3-r92-return-fragility-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-and-identification-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r92_return_fragility.py
  fresh-source-simulation:
    needs: numerical-and-identification-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 0, stop: 4}
          - {start: 4, stop: 8}
          - {start: 8, stop: 12}
          - {start: 12, stop: 16}
          - {start: 16, stop: 20}
          - {start: 20, stop: 24}
          - {start: 24, stop: 28}
          - {start: 28, stop: 32}
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m scripts.run_w3_r92_return_fragility --start ${{ matrix.start }} --stop ${{ matrix.stop }} --out build/R92-shard/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r92-new-source-shard-${{ matrix.start }}
          path: build/R92-shard/
          if-no-files-found: warn
          retention-days: 90
  original-source-sha256-14336-record-ledger:
    needs: [numerical-and-identification-contracts,fresh-source-simulation]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: w3-r92-new-source-shard-*
          path: build/R92-parts/
          merge-multiple: false
      - run: python -m scripts.run_w3_r92_return_fragility --merge-parts build/R92-parts/ --out build/R92-complete/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r92-immutable-original-14336-return-fragility
          path: build/R92-complete/
          if-no-files-found: warn
          retention-days: 90
