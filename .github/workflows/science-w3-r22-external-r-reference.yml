name: science-w3-r22-external-r-reference
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/w3_r22_scaled_cholesky_cr2.py"
      - "tests/test_w3_r22_external_r.py"
      - ".github/workflows/science-w3-r22-external-r-reference.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-r-clubsandwich-comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EYE_R22_REQUIRE_EXTERNAL_R: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages("clubSandwich",repos="https://cloud.r-project.org")'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r22_external_r.py
