name: science-w3-r63-independent-original-null-audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r63_original_null_independent.py"
      - "tests/test_w3_r63_independent_original_null_audit.py"
      - "docs/development/w3-r63-independent-original-null-audit.md"
      - ".github/workflows/science-w3-r63-independent-original-null-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-archive-tamper-refusal-and-rank-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11","3.12","3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r63_independent_original_null_audit.py
  independent-immutable-R63-original-Gaussian-null-evidence-audit:
    needs: independent-archive-tamper-refusal-and-rank-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download immutable original R63 scientific archive (not the new auditor source)
        uses: actions/download-artifact@v4
        with:
          name: w3-r63-original-128-independent-null-Gaussian-evidence
          run-id: 39110613315
          repository: stefanosbalaskas/eyetrajectoriespy
          github-token: ${{ github.token }}
          path: build/R63-immutable-original/
      - name: Require pinned ORIGINAL scientific PR merge checkout
        run: grep -Fx 3574b507971f237fe20326acb76f323082007dd5 build/R63-immutable-original/source-commit.txt
      - name: Independently reconstruct all source fits, conditional 63-draw p-values and SHA256 evidence
        run: python scripts/audit_w3_r63_original_null_independent.py --original build/R63-immutable-original/ --expected-original-checkout 3574b507971f237fe20326acb76f323082007dd5 --out build/R63-independent-audit/evidence.json
      - name: Display independent original-evidence audit
        run: cat build/R63-independent-audit/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r63-independent-original-128-block-null-reconstruction
          path: build/R63-independent-audit/
          if-no-files-found: warn
          retention-days: 90
