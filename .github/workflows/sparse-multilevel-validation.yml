name: sparse-multilevel-validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  known-truth-hierarchical-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Validate sparse multilevel recovery against known hierarchy
        run: |
          python scripts/run_sparse_multilevel_validation.py \
            --output sparse-multilevel-validation.json
      - name: Verify qualification scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("sparse-multilevel-validation.json").read_text())
          assert evidence["validation_passed"] is True
          assert evidence["deterministic_replay_passed"] is True
          assert evidence["exchangeable_trials_assumed"] is True
          assert evidence["trial_fixed_effects_estimated"] is False
          assert evidence["weighting"] == "observation"
          assert evidence["population_estimation_uncertainty_propagated"] is False
          assert evidence["raw_sparse_trajectory_interpolation_performed"] is False
          assert evidence["expected_identifiability_failure"]["failure_code"] == "insufficient_repeated_participants"
          PY
      - name: Upload sparse multilevel evidence
        uses: actions/upload-artifact@v4
        with:
          name: sparse-multilevel-validation
          path: sparse-multilevel-validation.json
