name: sparse-workflow-validation

on:
  pull_request:
    paths:
      - ".github/workflows/sparse-workflow-validation.yml"
      - "src/eyetrajectoriespy/workflows/**"
      - "tests/test_sparse_workflows.py"
      - "src/eyetrajectoriespy/sparse_native.py"
      - "src/eyetrajectoriespy/sparse_multivariate.py"
      - "src/eyetrajectoriespy/sparse_multivariate_async.py"
      - "src/eyetrajectoriespy/sparse_multilevel.py"
      - "src/eyetrajectoriespy/sparse_partial_prediction.py"
      - "src/eyetrajectoriespy/sparse_partial_conformal.py"
      - "src/eyetrajectoriespy/sparse_bandwidth_selection.py"
      - "src/eyetrajectoriespy/sparse_multivariate_bandwidth_selection.py"
      - "src/eyetrajectoriespy/sparse_score_uncertainty.py"
      - "src/eyetrajectoriespy/sparse_multivariate_score_uncertainty.py"
      - "src/eyetrajectoriespy/observation_process.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sparse-workflow-validation.yml"
      - "src/eyetrajectoriespy/workflows/**"
      - "tests/test_sparse_workflows.py"
      - "src/eyetrajectoriespy/sparse_native.py"
      - "src/eyetrajectoriespy/sparse_multivariate.py"
      - "src/eyetrajectoriespy/sparse_multivariate_async.py"
      - "src/eyetrajectoriespy/sparse_multilevel.py"
      - "src/eyetrajectoriespy/sparse_partial_prediction.py"
      - "src/eyetrajectoriespy/sparse_partial_conformal.py"
      - "src/eyetrajectoriespy/sparse_bandwidth_selection.py"
      - "src/eyetrajectoriespy/sparse_multivariate_bandwidth_selection.py"
      - "src/eyetrajectoriespy/sparse_score_uncertainty.py"
      - "src/eyetrajectoriespy/sparse_multivariate_score_uncertainty.py"
      - "src/eyetrajectoriespy/observation_process.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  sparse-workflow-contract:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run W1 and W2 workflow contracts
        run: |
          python -m pytest -q \
            tests/test_workflow_infrastructure.py \
            tests/test_sparse_workflows.py

      - name: Verify W2 module-scoped surface
        run: |
          python - <<'PY'
          import dataclasses
          import eyetrajectoriespy as et
          import eyetrajectoriespy.workflows as workflows

          ordered = (
              "run_sparse_fpca_workflow",
              "run_sparse_mfpca_workflow",
              "run_sparse_mfpca_async_workflow",
              "run_sparse_multilevel_workflow",
              "run_sparse_prediction_workflow",
          )
          missing = [name for name in ordered if not hasattr(workflows, name)]
          if missing:
              raise SystemExit(f"missing W2 workflow APIs: {missing}")
          leaked = [name for name in ordered if hasattr(et, name)]
          if leaked:
              raise SystemExit(f"W2 APIs leaked into package root: {leaked}")

          async_fields = {
              field.name
              for field in dataclasses.fields(
                  workflows.SparseMFPCAAsyncWorkflowConfig
              )
          }
          if "bandwidth_selection" in async_fields:
              raise SystemExit("async workflow exposed an unqualified selector")
          PY
