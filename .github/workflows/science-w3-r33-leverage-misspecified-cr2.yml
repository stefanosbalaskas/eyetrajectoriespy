name: science-w3-r33-leverage-misspecified-cr2
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r33_leverage_misspecified_cr2.py"
      - "tests/test_w3_r33_leverage_misspecified_cr2.py"
      - ".github/workflows/science-w3-r33-leverage-misspecified-cr2.yml"
      - "docs/development/w3-r33-leverage-misspecified-cr2-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oracle-and-misspecification-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r33_leverage_misspecified_cr2.py
  original-384case-independent-source-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_w3_r33_leverage_misspecified_cr2.py --out build/w3-r33-leverage-misspecified
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r33-original-384case-leverage-covariance-falsification
          path: build/w3-r33-leverage-misspecified/
          retention-days: 90
          if-no-files-found: warn
