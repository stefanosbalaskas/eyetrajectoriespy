name: r4-nav-patch

on:
  push:
    branches: [chore/1.1-r4-readiness-audit]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/1.1-r4-readiness-audit
          fetch-depth: 0
      - name: Add R4 readiness page to navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("mkdocs.yml")
          text = path.read_text(encoding="utf-8")
          marker = "          - 1.1 end-to-end product analyses: validation/one-dot-one-product-analyses.md\n"
          addition = marker + "          - 1.1 development readiness: validation/one-dot-one-development-readiness.md\n"
          if "validation/one-dot-one-development-readiness.md" not in text:
              if marker not in text:
                  raise SystemExit("expected R3 navigation marker not found")
              text = text.replace(marker, addition, 1)
              path.write_text(text, encoding="utf-8")
          PY
          if git diff --quiet -- mkdocs.yml; then
            echo "navigation already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mkdocs.yml
          git commit -m "Add R4 readiness page to docs nav"
          git push origin HEAD:chore/1.1-r4-readiness-audit
