name: prepare-final-012

on:
  push:
    branches:
      - release/0.12.0-final-qualification

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.12.0-final-qualification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote exact package identity to final 0.12.0
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path('.')
          old = '0.12.0rc1'
          new = '0.12.0'

          # Exact active identity/contracts. Deliberately exclude immutable RC
          # release notes, archived RC performance evidence, and installed-RC
          # observation workflow, which must continue to target production RC1.
          replace_all = [
              'pyproject.toml',
              'CITATION.cff',
              'src/eyetrajectoriespy/__init__.py',
              'CANONICAL_WORKFLOWS.json',
              'REFERENCE_VALIDATION.json',
              'VALIDATION_TOLERANCES.json',
              'scripts/validate_docs_contracts.py',
              'tests/test_public_api.py',
          ]
          for name in replace_all:
              path = ROOT / name
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{name}: expected {old!r} not found')
              path.write_text(text.replace(old, new), encoding='utf-8')

          hardening = ROOT / 'tests/test_release_hardening.py'
          text = hardening.read_text(encoding='utf-8')
          needle = 'CURRENT_RELEASE_CANDIDATE = "0.12.0rc1"'
          if needle not in text:
              raise SystemExit('release-hardening version constant not found')
          hardening.write_text(
              text.replace(needle, 'CURRENT_RELEASE_CANDIDATE = "0.12.0"'),
              encoding='utf-8',
          )

          readiness_path = ROOT / 'RELEASE_READINESS.json'
          readiness = json.loads(readiness_path.read_text(encoding='utf-8'))
          readiness['current_development_version'] = new
          readiness['production_release_ready'] = False
          readiness['github_release_ready'] = False
          notes = list(readiness.get('notes', []))
          final_notes = [
              'Final 0.12.0 is a version-only promotion of the feature-frozen, production-observed 0.12.0rc1 scientific/API surface. No estimator, numerical method, analytical default, dependency, or public API expansion is introduced during final qualification.',
              'The immutable 0.12.0rc1 package-wide performance envelope remains archived under validation/performance/PERFORMANCE_ENVELOPE-0.12.0rc1.json and must not be relabelled as final-version evidence.',
              'Installed sparse-MFPCA/joint-PACE observation PR #137 merged as exact protected-main commit 0250fdb8113d51d024c199f552c50079ea97e84a. Exact-main installed-RC workflow run 36911103234 reinstalled production-PyPI 0.12.0rc1 on Python 3.11-3.13 and passed the deep installed recovery, stress, portability, and sparse-MFPCA observation chain.',
              'Exact-main installed observation artifact 11186552786 has digest sha256:de1b531fc2a6a5c2836ee3fc1a70df898f7a7e3ecfdad75c3e022300216d24d8. The sparse-MFPCA installed observation returned 36/36 successful joint-PACE scores and zero nonportable fields.',
              'Final 0.12.0 qualification requires fresh exact-version package-wide and sparse-MFPCA performance evidence, the complete pull-request matrix, protected-main merge, and the complete exact-main matrix before publication may be armed.',
              'Publication remains jointly disarmed during final qualification. Arming GitHub/PyPI publication is reserved for a later governance-only reviewed change after exact-main 0.12.0 qualification passes.'
          ]
          for note in final_notes:
              if note not in notes:
                  notes.append(note)
          readiness['notes'] = notes
          readiness_path.write_text(json.dumps(readiness, indent=2) + '\n', encoding='utf-8')

          changelog = ROOT / 'CHANGELOG.md'
          text = changelog.read_text(encoding='utf-8')
          marker = '## 0.12.0rc1 — 2026-10-01\n'
          if marker not in text:
              raise SystemExit('0.12.0rc1 changelog marker missing')
          final_block = '''## 0.12.0 (unreleased)\n\n- Promote the publicly qualified and production-observed `0.12.0rc1` sparse-MFPCA/joint-PACE surface to final `0.12.0` without changing estimator behavior, numerical methods, analytical defaults, dependencies, or public APIs.\n- Require fresh exact-version `0.12.0` package-wide performance evidence and a fresh sparse-MFPCA performance run rather than relabelling release-candidate measurements.\n- Carry forward exact production-installed RC observation on Python 3.11–3.13, including the public `fit_sparse_mfpca()` → recovery → reporting → portable-result chain and 36/36 successful joint-PACE scores.\n- Preserve `v0.12.0rc1`, its production-PyPI distributions, release assets, attestations, and archived performance evidence as immutable prerelease history.\n- Keep GitHub and production-PyPI publication jointly disarmed throughout final-version qualification; publication arming remains a separate governance-only change after the complete exact-main matrix passes.\n\n'''
          if '## 0.12.0 (unreleased)' not in text:
              text = text.replace(marker, final_block + marker, 1)
          changelog.write_text(text, encoding='utf-8')

          readme = ROOT / 'README.md'
          text = readme.read_text(encoding='utf-8')
          old_banner = '> **Current release candidate under qualification:** `0.12.0rc1` freezes the qualified native sparse multivariate FPCA/joint-PACE 0.12 surface. Publication remains disarmed until fresh exact-version performance, the complete RC pull-request matrix, and the post-merge exact-main matrix pass.\n'
          new_banner = '> **Final 0.12.0 under qualification:** `0.12.0` is a version-only promotion of the feature-frozen and production-observed `0.12.0rc1` sparse multivariate FPCA/joint-PACE surface. Publication remains disarmed until fresh final-version performance, the complete pull-request matrix, and the post-merge exact-main matrix pass.\n'
          if old_banner not in text:
              raise SystemExit('README RC banner missing')
          text = text.replace(old_banner, new_banner, 1)
          rc_obs = '> **0.12 RC installed-artifact observation:** exact protected-main commit `0250fdb8113d51d024c199f552c50079ea97e84a` reinstalled production-PyPI `0.12.0rc1` on Python 3.11–3.13 and exercised the new sparse-MFPCA/joint-PACE public chain outside the checkout; the deep observation retained 36/36 successful joint-PACE scores and a zero-loss portable snapshot.\n>\n'
          anchor = '> **Scientific promotion boundary:**'
          if rc_obs not in text:
              text = text.replace(anchor, rc_obs + anchor, 1)
          readme.write_text(text, encoding='utf-8')

          validation = ROOT / 'VALIDATION.md'
          text = validation.read_text(encoding='utf-8')
          start = text.index('## Current development target\n')
          end = text.index('\nSee `docs/release-readiness.md`', start)
          section = '''## Current development target\n\n`0.12.0` is the current final-version line under exact-version qualification. `0.11.0` remains the current published stable release, and published `0.12.0rc1` remains immutable prerelease history.\n\n- Final `0.12.0` is a version-only promotion of the feature-frozen `0.12.0rc1` sparse-MFPCA/joint-PACE scientific/API surface.\n- Production-installed RC observation is complete on exact protected-main commit `0250fdb8113d51d024c199f552c50079ea97e84a`; run `36911103234` passed exact PyPI installation on Python 3.11–3.13 plus deep recovery/stress/portability and the public sparse-MFPCA observation chain.\n- The exact-main installed sparse-MFPCA fixture returned 36/36 successful joint-PACE scores and `nonportable_fields == ()`; evidence artifact `11186552786` has digest `sha256:de1b531fc2a6a5c2836ee3fc1a70df898f7a7e3ecfdad75c3e022300216d24d8`.\n- The immutable `0.12.0rc1` performance envelope remains archived and is not final-version evidence.\n- Final qualification requires fresh `0.12.0` package-wide performance evidence, fresh sparse-MFPCA performance evidence, the complete PR matrix, protected-main merge, and the complete exact-main matrix.\n- GitHub/PyPI publication readiness remains jointly false during qualification; a later governance-only PR may arm publication after exact-main final qualification passes.\n- No estimator fallback, recovery-threshold widening, automatic tuning, dependency change, or public API expansion is part of this promotion.\n'''
          validation.write_text(text[:start] + section + text[end:], encoding='utf-8')

          def prepend_section(path_name: str, heading: str, body: str):
              path = ROOT / path_name
              text = path.read_text(encoding='utf-8')
              if heading in text:
                  return
              first_nl = text.find('\n')
              if first_nl < 0:
                  raise SystemExit(f'{path_name}: no document title line')
              addition = f'\n\n{heading}\n\n{body.strip()}\n'
              path.write_text(text[:first_nl] + addition + text[first_nl:], encoding='utf-8')

          prepend_section(
              'docs/release-process.md',
              '## Final 0.12.0 exact-version qualification',
              '''Final `0.12.0` is qualified as a literal package identity, not by relabelling `0.12.0rc1`. The RC release, production-installed observation, and archived RC performance evidence remain immutable inputs. Final qualification must generate fresh package-wide and sparse-MFPCA performance evidence under `0.12.0`, pass the complete pull-request matrix, merge through protected `main`, and pass the complete exact-main matrix. GitHub and PyPI publication remain disarmed until a separate governance-only arming change.''',
          )
          prepend_section(
              'docs/release-readiness.md',
              '## Final 0.12.0 qualification',
              '''The final-version promotion changes package identity only. `0.12.0rc1` remains immutable and its installed-artifact observation is retained as external-consumer evidence. Fresh final-version performance and the complete PR plus post-merge exact-main matrices are required before publication readiness can be armed. Both publication flags remain false during this tranche.''',
          )
          prepend_section(
              'docs/methods/status-roadmap.md',
              '## 0.12 final-promotion checkpoint',
              '''The sparse-MFPCA/joint-PACE methodology surface is frozen. Production-installed `0.12.0rc1` observation is complete, so the next release step is literal final `0.12.0` exact-version qualification. This checkpoint adds no methodology and does not reopen tuning, estimator, or API decisions.''',
          )

          index = ROOT / 'docs/index.md'
          text = index.read_text(encoding='utf-8')
          if 'Final 0.12.0 under qualification' not in text:
              first_nl = text.find('\n')
              addition = '''\n\n!!! info "Final 0.12.0 under qualification"\n    Final `0.12.0` is a version-only promotion of the production-observed `0.12.0rc1` sparse-MFPCA/joint-PACE surface. Fresh final-version performance and complete PR/exact-main qualification are required before publication can be armed.\n'''
              text = text[:first_nl] + addition + text[first_nl:]
          index.write_text(text, encoding='utf-8')

          release_note = ROOT / 'docs/releases/0.12.0.md'
          if release_note.exists():
              raise SystemExit('docs/releases/0.12.0.md already exists')
          release_note.write_text('''# eyetrajectoriespy 0.12.0\n\n**Final version — under exact-version qualification**\n\n`0.12.0` promotes the feature-frozen and production-observed `0.12.0rc1` scientific/API surface without changing estimator behavior, numerical methods, analytical defaults, dependencies, or public APIs.\n\n## Qualification boundary\n\nThe final version must be qualified under the literal package identity `0.12.0`. The immutable RC performance envelope is retained under `validation/performance/PERFORMANCE_ENVELOPE-0.12.0rc1.json`; it is not renamed or reused as final evidence. Fresh package-wide and sparse-MFPCA performance runs, the complete pull-request matrix, protected-main merge, and the complete exact-main matrix are required before publication may be armed.\n\n## RC installed-artifact evidence carried forward\n\nExact protected-main commit `0250fdb8113d51d024c199f552c50079ea97e84a` reinstalled production-PyPI `0.12.0rc1` on Python 3.11, 3.12, and 3.13 and exercised the public sparse-MFPCA/joint-PACE chain outside the checkout. Deep run `36911103234` retained evidence artifact `11186552786` (`sha256:de1b531fc2a6a5c2836ee3fc1a70df898f7a7e3ecfdad75c3e022300216d24d8`), including 36/36 successful joint-PACE scores and a portable sparse-MFPCA snapshot with no nonportable fields.\n\n## Publication governance\n\nPublication remains disarmed during qualification. A separate governance-only change may arm GitHub and production-PyPI release readiness only after exact-main final qualification succeeds.\n''', encoding='utf-8')

          mkdocs = ROOT / 'mkdocs.yml'
          text = mkdocs.read_text(encoding='utf-8')
          nav_line = '      - 0.12.0rc1: releases/0.12.0rc1.md\n'
          final_line = '      - 0.12.0: releases/0.12.0.md\n'
          if final_line not in text:
              if nav_line not in text:
                  raise SystemExit('mkdocs 0.12.0rc1 release nav entry missing')
              text = text.replace(nav_line, final_line + nav_line, 1)
          mkdocs.write_text(text, encoding='utf-8')

          # This helper workflow is a one-shot bootstrap and must not remain in
          # the release qualification branch.
          (ROOT / '.github/workflows/prepare-final-012.yml').unlink()
          PY
      - name: Sanity-check exact identity boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          assert 'version = "0.12.0"' in Path('pyproject.toml').read_text()
          assert '__version__ = "0.12.0"' in Path('src/eyetrajectoriespy/__init__.py').read_text()
          assert 'version: 0.12.0' in Path('CITATION.cff').read_text()
          readiness = json.loads(Path('RELEASE_READINESS.json').read_text())
          assert readiness['current_development_version'] == '0.12.0'
          assert readiness['production_release_ready'] is False
          assert readiness['github_release_ready'] is False
          assert 'RC_VERSION: "0.12.0rc1"' in Path('.github/workflows/installed-rc-qualification.yml').read_text()
          assert Path('validation/performance/PERFORMANCE_ENVELOPE-0.12.0rc1.json').exists()
          assert Path('docs/releases/0.12.0rc1.md').exists()
          assert not Path('.github/workflows/prepare-final-012.yml').exists()
          PY
      - name: Commit final-version qualification preparation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare exact-version 0.12.0 final qualification"
          git push origin HEAD:release/0.12.0-final-qualification
