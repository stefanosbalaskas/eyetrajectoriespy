name: science-w3-r61-independent-original-native-Gaussian-covariance-audit
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r61_original_native_gaussian_independent.py"
      - "tests/test_w3_r61_independent_original_native_gaussian_audit.py"
      - "docs/development/w3-r61-independent-original-native-Gaussian-audit.md"
      - ".github/workflows/science-w3-r61-independent-original-native-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-raw-native-H0-covariance-and-source-tamper-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r61_independent_original_native_gaussian_audit.py
  original-raw-native-H0-covariance-whitening-archive-audit:
    needs: independent-raw-native-H0-covariance-and-source-tamper-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Identify immutable ORIGINAL R61 raw-native scientific evidence
        run: echo 'Original R61 science run 39068871584 archive 12114213307, checkout 92af2f707a6e9c608e405b84693165b507900143'
      - uses: actions/download-artifact@v4
        with:
          name: w3-r61-complete-raw-native-Gaussian-H0-covariance-fidelity
          run-id: 39068871584
          path: build/R61-immutable-original/
          github-token: ${{ github.token }}
      - name: Require exact source scientific PR-merge checkout
        run: grep -Fx 92af2f707a6e9c608e405b84693165b507900143 build/R61-immutable-original/source-commit.txt
      - name: Reconstruct H0 weighted covariance and Gaussian whitened seed evidence from native arrays
        run: python -m scripts.audit_w3_r61_original_native_gaussian_independent --original build/R61-immutable-original/ --out build/R61-independent-Gaussian-native-audit.json
      - run: cat build/R61-independent-Gaussian-native-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r61-independent-original-native-H0-covariance-evidence
          path: build/R61-independent-Gaussian-native-audit.json
          if-no-files-found: warn
          retention-days: 90
