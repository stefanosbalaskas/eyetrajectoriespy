name: sparse-mfpca-score-uncertainty-validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  oracle-joint-conditional-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Validate joint conditional score uncertainty against known population truth
        run: |
          python scripts/run_sparse_mfpca_score_uncertainty_validation.py \
            --n-curves 500 \
            --output sparse-mfpca-score-uncertainty-validation.json
      - name: Verify qualification scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("sparse-mfpca-score-uncertainty-validation.json").read_text()
          )
          if payload.get("validation_passed") is not True:
              raise SystemExit("joint score-uncertainty qualification did not pass")
          if payload.get("population_estimation_uncertainty_included") is not False:
              raise SystemExit("qualification must exclude population-estimation uncertainty")
          if payload.get("bandwidth_uncertainty_included") is not False:
              raise SystemExit("qualification must exclude bandwidth uncertainty")
          if payload.get("measurement_error_estimation_uncertainty_included") is not False:
              raise SystemExit("qualification must exclude measurement-error estimation uncertainty")
          scenarios = payload.get("scenarios", [])
          modes = {row.get("measurement_error_mode") for row in scenarios}
          if modes != {"diagonal", "fixed_matrix"}:
              raise SystemExit("qualification must exercise diagonal and correlated error modes")
          if any(row.get("rank_k_covariance_used_for_uncertainty") for row in scenarios):
              raise SystemExit("qualification must use the full fitted joint covariance")
          if not all(row.get("deterministic_replay_passed") for row in scenarios):
              raise SystemExit("deterministic replay must pass in every scenario")
          PY
      - name: Upload joint conditional uncertainty evidence
        uses: actions/upload-artifact@v4
        with:
          name: sparse-mfpca-score-uncertainty-validation
          path: sparse-mfpca-score-uncertainty-validation.json
          if-no-files-found: error
