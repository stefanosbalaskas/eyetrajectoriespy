name: science-w3-r94-independent-original
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/audit_w3_r94_external_floor_archive_independent.py"
      - "tests/test_w3_r94_external_floor_audit_independent.py"
      - ".github/workflows/science-w3-r94-independent-original.yml"
      - "docs/development/w3-r94-independent-floor-audit-protocol.md"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-algebra-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p 'test_w3_r94_external_floor_audit_independent.py'
  mandatory-exact-original-54-record-replay:
    runs-on: ubuntu-24.04
    needs: independent-algebra-contracts
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: w3-r94-exact-floors-54-record-original-archive
          run-id: 39863137968
          github-token: ${{ github.token }}
          repository: stefanosbalaskas/eyetrajectoriespy
          path: build/R94-original-readonly/
      - run: python -m scripts.audit_w3_r94_external_floor_archive_independent --original build/R94-original-readonly/ --out build/R94-independent/replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-r94-A-independent-original-54-case-audit
          path: build/R94-independent/
          retention-days: 90
          if-no-files-found: warn
