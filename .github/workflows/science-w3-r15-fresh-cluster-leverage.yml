name: science-w3-r15-fresh-cluster-leverage

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/run_w3_r15_fresh_cluster_leverage.py"
      - "tests/test_w3_r15_fresh_cluster_leverage.py"
      - ".github/workflows/science-w3-r15-fresh-cluster-leverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-source-contracts:
    name: R15 original leverage and true Gaussian variance reference Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r15_fresh_cluster_leverage.py

  original-scientific-audit:
    name: R15 96 fresh generating blocks × 24 48 96 participants × leverage × two fixed means
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Original failure-inclusive 1152 source/model case evaluation
        run: |
          python scripts/run_w3_r15_fresh_cluster_leverage.py \
            --out build/w3-r15-original
      - name: Retain complete source evidence, provenance SVG and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3-r15-original-fresh-cluster-leverage
          path: build/w3-r15-original/
          retention-days: 90
          if-no-files-found: warn
