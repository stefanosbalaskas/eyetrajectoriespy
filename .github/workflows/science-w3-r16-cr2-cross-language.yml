name: science-w3-r16-cr2-cross-language
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/w3_r16_cr2_reference.py"
      - "tests/test_w3_r16_cr2_cross_language.py"
      - ".github/workflows/science-w3-r16-cr2-cross-language.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r-clubsandwich-independent-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EYE_CR2_REQUIRE_R_REFERENCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages("clubSandwich", repos="https://cloud.r-project.org")'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_w3_r16_cr2_cross_language.py
