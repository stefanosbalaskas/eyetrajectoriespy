<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="610" viewBox="0 0 1160 610" role="img" aria-labelledby="title desc"><title id="title">R93 sharp binary population mean identification sets at 99.9, 99 and 95 percent return</title><desc id="desc">Exact rational observed-law identified ranges: at 99.9% response p from .4995 to .5005; at 99% response p from .495 to .505; at 95% response p from .475 to .525. Values follow exact likelihood equivalence, not confidence intervals.</desc><rect width="1160" height="610" fill="white"/><text x="46" y="48" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#183c51">Nearly complete returns still leave an identification set</text><text x="46" y="77" font-family="Arial,sans-serif" font-size="15" fill="#526f84">Exact conditional binary-outcome population mean, known randomized invitation</text>
