<line x1="928.3" y1="143" x2="928.3" y2="480" stroke="#e0e9ef" stroke-width="1"/><text x="928.3" y="511" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#4a697c">0.52</text>
