<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="726" viewBox="0 0 1200 726" role="img" aria-labelledby="t d">
<title id="t">R56 structurally zero versus positive Gaussian slope variance: numerical lower positive REML box selection</title>
<desc id="d">Sixteen independent Gaussian primitive blocks with paired ordinary/extreme dependent leverage and true zero/positive slope variance per block. Original REML numerical positive lower ratio bound selected in 9/16 ordinary zero, 9/16 ordinary positive, 8/16 extreme zero and 7/16 extreme positive. Median fitted positive slope variance respectively 1.266864e-8,1.273736e-8,0.00017648,0.00061491. True slope variance 0 in zero sources and 0.002025 in positive sources. 64/64 covariance fits and CR2 numerical calculations succeeded. Not a valid theta=0 hypothesis test nor 90% confidence-interval calibration.</desc>
<rect width="1200" height="726" fill="#fff"/>
<text x="47" y="58" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#253b47">R56 · True zero is not the positive REML optimizer floor</text>
<text x="48" y="91" font-family="Arial,sans-serif" font-size="16" fill="#647984">16 NEW independent Gaussian primitive blocks · complete observed native gaze · paired conditions</text>
