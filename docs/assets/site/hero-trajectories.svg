<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="440" viewBox="0 0 1260 440" role="img" aria-labelledby="title desc"><title id="title">Time-indexed planar gaze analysis concept</title><desc id="desc">Three scientific stages: observed planar x/y gaze coordinates, functional curves over time, then explicitly assumption-dependent inference. All curves schematic synthetic artwork, not recorded gaze or performance claims.</desc><rect width="1260" height="440" rx="22" fill="#f1f6fc"/><g fill="#fff" stroke="#cedae7" stroke-width="2"><rect x="27" y="35" width="365" height="370" rx="18"/><rect x="447" y="35" width="365" height="370" rx="18"/><rect x="867" y="35" width="365" height="370" rx="18"/></g><g font-family="system-ui,sans-serif" fill="#304963" font-size="21" font-weight="700"><text x="51" y="77">01 · Record spatial gaze</text><text x="471" y="77">02 · Keep time visible</text><text x="891" y="77">03 · Audit inference</text></g><g stroke="#e0e9f1" stroke-width="1"><path d="M65 124H356 M65 180H356 M65 236H356 M65 292H356 M109 113V328 M188 113V328 M267 113V328"/><path d="M485 124H778 M485 180H778 M485 236H778 M485 292H778 M528 113V328 M606 113V328 M684 113V328"/><path d="M905 124H1198 M905 180H1198 M905 236H1198 M905 292H1198 M948 113V328 M1026 113V328 M1104 113V328"/></g><path d="M74 272C98 237 110 141 151 182S216 319 258 221 316 158 345 135" fill="none" stroke="#3778aa" stroke-width="5" stroke-linecap="round"/><path d="M77 153C113 213 146 288 182 265S254 138 285 208 316 281 345 231" fill="none" stroke="#168c8a" stroke-width="5" stroke-linecap="round"/><g fill="white" stroke="#305e85" stroke-width="2.4"><circle cx="109" cy="214" r="6"/><circle cx="151" cy="182" r="6"/><circle cx="215" cy="317" r="6"/><circle cx="258" cy="221" r="6"/><circle cx="316" cy="158" r="6"/></g><path d="M489 229C530 148 575 307 615 213S704 140 778 225" fill="none" stroke="#3778aa" stroke-width="5"/><path d="M489 282C535 310 567 164 607 218S703 303 778 158" fill="none" stroke="#168c8a" stroke-width="5"/><g fill="#376b99"><circle cx="515" cy="192" r="5"/><circle cx="577" cy="263" r="5"/><circle cx="643" cy="172" r="5"/><circle cx="704" cy="144" r="5"/></g><path d="M905 267C957 296 972 155 1017 187S1096 301 1137 198 1171 210 1200 226" fill="none" stroke="#839fb4" stroke-width="19" opacity=".24"/><path d="M905 267C957 296 972 155 1017 187S1096 301 1137 198 1171 210 1200 226" fill="none" stroke="#378b94" stroke-width="5"/><path d="M397 219H439m-13-11 13 11-13 11M817 219h42m-13-11 13 11-13 11" stroke="#8498ac" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g font-family="system-ui,sans-serif" font-size="15" fill="#526982"><text x="51" y="365">Preserve x / y coordinates</text><text x="471" y="365">Dense or irregular sampling</text><text x="891" y="365">State assumptions and limits</text></g></svg>