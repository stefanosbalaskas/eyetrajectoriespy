<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title description"><title id="title">Exact R93 to R95 normalized sharp population mean identification widths</title><desc id="description">For invited missing response of 0.1, 1 and 5 percent, the sharp interval width as a multiple of missing fraction is 1 without external assumptions, approximately 0.5 to 0.54 with a specific hypothesized R94 completion floor, exactly 0.5 under a known R95 response direction, and approximately 0.25 under a known direction and a response ratio cap. These are conditional population mathematical widths, not confidence intervals or empirical gains.</desc><rect width="1200" height="540" rx="18" fill="#f9fbfd"/><g font-family="system-ui,sans-serif" fill="#263d57"><text x="36" y="44" font-size="26" font-weight="700">One observed law. Different external assumptions.</text><text x="36" y="73" font-size="16" fill="#526880">Exact population identified-set width divided by invited nonreturn δ — not confidence coverage</text></g><line x1="210" y1="291" x2="1010" y2="291" stroke="#dbe3eb" stroke-width="1"/><text x="180" y="296" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" fill="#50647d">0.00</text><line x1="210" y1="241" x2="1010" y2="241" stroke="#dbe3eb" stroke-width="1"/><text x="180" y="246" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" fill="#50647d">0.25</text><line x1="210" y1="191" x2="1010" y2="191" stroke="#dbe3eb" stroke-width="1"/><text x="180" y="196" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" fill="#50647d">0.50</text><line x1="210" y1="141" x2="1010" y2="141" stroke="#dbe3eb" stroke-width="1"/><text x="180" y="146" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" fill="#50647d">0.75</text><line x1="210" y1="91" x2="1010" y2="91" stroke="#dbe3eb" stroke-width="1"/><text x="180" y="96" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" fill="#50647d">1.00</text><line x1="290" y1="91" x2="290" y2="293" stroke="#ebf0f4" stroke-dasharray="5 5"/><text x="290" y="319" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#354e66">0.1% nonreturn</text><line x1="600" y1="91" x2="600" y2="293" stroke="#ebf0f4" stroke-dasharray="5 5"/><text x="600" y="319" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#354e66">1% nonreturn</text><line x1="910" y1="91" x2="910" y2="293" stroke="#ebf0f4" stroke-dasharray="5 5"/><text x="910" y="319" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#354e66">5% nonreturn</text><line x1="210" y1="91" x2="210" y2="293" stroke="#9aaabc"/><line x1="210" y1="293" x2="1010" y2="293" stroke="#9aaabc"/><polyline points="290,91 600,91 910,91" fill="none" stroke="#244c76" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="290" cy="91" r="6" fill="#244c76" stroke="#fff" stroke-width="2"/><circle cx="600" cy="91" r="6" fill="#244c76" stroke="#fff" stroke-width="2"/><circle cx="910" cy="91" r="6" fill="#244c76" stroke="#fff" stroke-width="2"/><polyline points="290,190.84977466199297 600,189.4771573604061 910,182.8918918918919" fill="none" stroke="#6087ab" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="290" cy="190.84977466199297" r="6" fill="#6087ab" stroke="#fff" stroke-width="2"/><circle cx="600" cy="189.4771573604061" r="6" fill="#6087ab" stroke="#fff" stroke-width="2"/><circle cx="910" cy="182.8918918918919" r="6" fill="#6087ab" stroke="#fff" stroke-width="2"/><polyline points="290,191 600,191 910,191" fill="none" stroke="#008c86" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="290" cy="191" r="6" fill="#008c86" stroke="#fff" stroke-width="2"/><circle cx="600" cy="191" r="6" fill="#008c86" stroke="#fff" stroke-width="2"/><circle cx="910" cy="191" r="6" fill="#008c86" stroke="#fff" stroke-width="2"/><polyline points="290,241.02498750624687 600,241.24875621890547 910,242.21951219512195" fill="none" stroke="#d28b2b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="290" cy="241.02498750624687" r="6" fill="#d28b2b" stroke="#fff" stroke-width="2"/><circle cx="600" cy="241.24875621890547" r="6" fill="#d28b2b" stroke="#fff" stroke-width="2"/><circle cx="910" cy="242.21951219512195" r="6" fill="#d28b2b" stroke="#fff" stroke-width="2"/><line x1="55" y1="370" x2="98" y2="370" stroke="#244c76" stroke-width="5"/><circle cx="76" cy="370" r="6" fill="#244c76"/><text x="114" y="375" font-family="system-ui,sans-serif" font-size="17" fill="#304a60">No external restriction (R93)</text><line x1="613" y1="370" x2="656" y2="370" stroke="#6087ab" stroke-width="5"/><circle cx="634" cy="370" r="6" fill="#6087ab"/><text x="672" y="375" font-family="system-ui,sans-serif" font-size="17" fill="#304a60">Assumed completion floor (R94)</text><line x1="55" y1="417" x2="98" y2="417" stroke="#008c86" stroke-width="5"/><circle cx="76" cy="417" r="6" fill="#008c86"/><text x="114" y="422" font-family="system-ui,sans-serif" font-size="17" fill="#304a60">Known response direction (R95)</text><line x1="613" y1="417" x2="656" y2="417" stroke="#d28b2b" stroke-width="5"/><circle cx="634" cy="417" r="6" fill="#d28b2b"/><text x="672" y="422" font-family="system-ui,sans-serif" font-size="17" fill="#304a60">Known sign plus ratio cap (R95)</text><text x="35" y="500" font-family="system-ui,sans-serif" font-size="14" fill="#6b7e91">R94 floor = 1 − 1.5δ for both outcome groups; R95 cap = 1 + δ for c1/c0. Assumptions unverified by return data alone.</text></svg>