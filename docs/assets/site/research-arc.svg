<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="354" viewBox="0 0 1260 354" role="img" aria-labelledby="title desc"><title id="title">Research map: W3 R76 through R95</title><desc id="desc">Conceptual four-stage progression, from leverage and covariance stress R76–R81, through missing gaze R82–R83, selective audit and recovery R84–R92, and exact identification R93–R95. Stages are not release readiness or calibrated inference.</desc><rect width="1260" height="354" rx="18" fill="#f6f9fc"/><path d="M124 153H1138" stroke="#d7e2ee" stroke-width="8" stroke-linecap="round"/><g font-family="system-ui,sans-serif" text-anchor="middle"><g><circle cx="166" cy="153" r="26" fill="#466b99"/><text x="166" y="160" font-size="19" font-weight="700" fill="#fff">1</text><text x="166" y="80" font-size="23" font-weight="700" fill="#2a4059">R76–R81</text><text x="166" y="213" font-size="18" fill="#334d65">Inference stress</text><text x="166" y="245" font-size="14" fill="#5a7085">Leverage · covariance</text><text x="166" y="264" font-size="14" fill="#5a7085">tails · contamination</text></g><g><circle cx="476" cy="153" r="26" fill="#3c7f9b"/><text x="476" y="160" font-size="19" font-weight="700" fill="#fff">2</text><text x="476" y="80" font-size="23" font-weight="700" fill="#2a4059">R82–R83</text><text x="476" y="213" font-size="18" fill="#334d65">Missing gaze</text><text x="476" y="245" font-size="14" fill="#5a7085">Support refusal</text><text x="476" y="264" font-size="14" fill="#5a7085">Assumed sensitivity</text></g><g><circle cx="782" cy="153" r="26" fill="#369496"/><text x="782" y="160" font-size="19" font-weight="700" fill="#fff">3</text><text x="782" y="80" font-size="23" font-weight="700" fill="#2a4059">R84–R92</text><text x="782" y="213" font-size="18" fill="#334d65">Audit return</text><text x="782" y="245" font-size="14" fill="#5a7085">Secondary validation</text><text x="782" y="264" font-size="14" fill="#5a7085">Selective recovery</text></g><g><circle cx="1090" cy="153" r="26" fill="#586d95"/><text x="1090" y="160" font-size="19" font-weight="700" fill="#fff">4</text><text x="1090" y="80" font-size="23" font-weight="700" fill="#2a4059">R93–R95</text><text x="1090" y="213" font-size="18" fill="#334d65">Identification</text><text x="1090" y="245" font-size="14" fill="#5a7085">Sharp population sets</text><text x="1090" y="264" font-size="14" fill="#5a7085">External assumptions</text></g><text x="628" y="324" font-size="14" fill="#63798c">Research sequence only · nominal-90% whole-function calibration and field MNAR identification remain unresolved</text></g></svg>