<title id="title">R38: Initialization-sensitive nuisance REML profiles in R37 block 2</title>
<desc id="desc">For the same R37 original generating block, positive-slope cases show large negative loglikelihood gaps between two successful nuisance optimizations at a fixed slope-variance ratio; zero-slope controls have no material discrepancy. Source numerical diagnostic only, no independent replication.</desc>
