<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">R87 original outcome-selective audit return coefficients</title>
<desc id="desc">Four cells. Recorded-input versus simulator oracle estimates. MAR curves 0.2356 versus -0.0102, participants 0.2889 versus 0.0296, true zero. MNAR curves 1.174 versus 0.9915, participants 1.1716 versus 0.9817, true 1.1. All point estimates, no uncertainty intervals.</desc>
