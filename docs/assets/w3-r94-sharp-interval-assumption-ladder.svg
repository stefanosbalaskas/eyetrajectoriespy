<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc" width="1120" height="620" viewBox="0 0 1120 620"><title id="ttl">R94 exact sharp mean regions at one percent invited nonresponse</title><desc id="dsc">At 99 percent successful invited return, unrestricted and weak floors yield mean from .495 to .505, moderate floors from .497462 to .502538, an asymmetric floor from .500 to .505, strong common floors identify .500 within the stipulated binary model, and overstrong floors are incompatible. These are mathematical population regions, not confidence intervals.</desc><rect width="1120" height="620" fill="#fff"/><text x="32" y="54" font-family="system-ui,sans-serif" font-size="29" font-weight="700" fill="#17243a">Sharp binary mean sets at 99% return</text><text x="32" y="85" font-family="system-ui,sans-serif" font-size="17" fill="#556274">All floor guarantees are external assumptions, not observed estimates</text><line x1="300" y1="140" x2="300" y2="526" stroke="#d2d8e0" stroke-dasharray="5 5"/><text x="300" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#314050">0.495</text><line x1="600.0000000000002" y1="140" x2="600.0000000000002" y2="526" stroke="#d2d8e0" stroke-dasharray="5 5"/><text x="600.0000000000002" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#314050">0.500</text><line x1="900.0000000000006" y1="140" x2="900.0000000000006" y2="526" stroke="#d2d8e0" stroke-dasharray="5 5"/><text x="900.0000000000006" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#314050">0.505</text><text x="942" y="133" font-family="system-ui,sans-serif" font-size="15" fill="#516177">Width</text><text x="30" y="191" font-family="system-ui,sans-serif" font-size="17" fill="#1b283b">No external guarantee</text><line x1="300" x2="900.0000000000006" y1="185" y2="185" stroke="#386a92" stroke-width="9" stroke-linecap="round"/><circle cx="300" cy="185" r="6" fill="#386a92"/><circle cx="900.0000000000006" cy="185" r="6" fill="#386a92"/><text x="942" y="190" font-family="system-ui,sans-serif" font-size="16" fill="#394657">.010000</text><text x="30" y="255" font-family="system-ui,sans-serif" font-size="17" fill="#1b283b">Weak common floor</text><line x1="300" x2="900.0000000000006" y1="249" y2="249" stroke="#386a92" stroke-width="9" stroke-linecap="round"/><circle cx="300" cy="249" r="6" fill="#386a92"/><circle cx="900.0000000000006" cy="249" r="6" fill="#386a92"/><text x="942" y="254" font-family="system-ui,sans-serif" font-size="16" fill="#394657">.010000</text><text x="30" y="319" font-family="system-ui,sans-serif" font-size="17" fill="#1b283b">Moderate common floor</text><line x1="447.71573604060893" x2="752.2842639593882" y1="313" y2="313" stroke="#386a92" stroke-width="9" stroke-linecap="round"/><circle cx="447.71573604060893" cy="313" r="6" fill="#386a92"/><circle cx="752.2842639593882" cy="313" r="6" fill="#386a92"/><text x="942" y="318" font-family="system-ui,sans-serif" font-size="16" fill="#394657">.005076</text><text x="30" y="383" font-family="system-ui,sans-serif" font-size="17" fill="#1b283b">Asymmetric floor</text><line x1="600.0000000000002" x2="900.0000000000006" y1="377" y2="377" stroke="#386a92" stroke-width="9" stroke-linecap="round"/><circle cx="600.0000000000002" cy="377" r="6" fill="#386a92"/><circle cx="900.0000000000006" cy="377" r="6" fill="#386a92"/><text x="942" y="382" font-family="system-ui,sans-serif" font-size="16" fill="#394657">.005000</text><text x="30" y="447" font-family="system-ui,sans-serif" font-size="17" fill="#1b283b">Strong common floor</text><line x1="600.0000000000002" x2="600.0000000000002" y1="441" y2="441" stroke="#386a92" stroke-width="9" stroke-linecap="round"/><circle cx="600.0000000000002" cy="441" r="6" fill="#386a92"/><circle cx="600.0000000000002" cy="441" r="6" fill="#386a92"/><text x="942" y="446" font-family="system-ui,sans-serif" font-size="16" fill="#394657">0</tex