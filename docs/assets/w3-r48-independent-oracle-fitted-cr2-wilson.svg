<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="614" viewBox="0 0 1050 614" role="img" aria-labelledby="t d">
<title id="t">R48 independent Gaussian pointwise CR2 conditional truth inclusion</title>
<desc id="d">128 independent Gaussian generating blocks, n24 and true positive predictor-scaled random-slope covariance. Ordinary support oracle and fitted conditional Satterthwaite CR2 both 118/128 truth included. Extreme support oracle 120/128 and plug-in estimated REML working covariance 112/128, all eight discordances oracle yes plug-in no. Conventional t with participant G minus one under extreme leverage oracle 101/128, fitted 99/128. Horizontal 95% Wilson Monte Carlo intervals, reference nominal 90%. These conditional CR2 methods do not account for nuisance covariance fitting uncertainty.</desc>
