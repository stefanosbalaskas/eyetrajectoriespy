<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="706" viewBox="0 0 1130 706" role="img" aria-labelledby="title desc">
<title id="title">W3 R54 active-face nuisance-derivative rescue under moving observed Gaussian REML box</title>
<desc id="desc">Matched R53 Gaussian source replay, four independent primitive blocks and ordinary/extreme leverage paired within. R53 only accepted 4/8 smooth-interior derivatives. R54 accepts 8/8 local constrained-face derivatives. Participant-slope lower active blocks: ordinary 0,1,2 and extreme 0. Sixteen of 16 finite-difference directional comparisons accepted; all 32 plus/minus full REML refits keep same active face. Overall median nuisance derivative relative error 0.00009892 and median studentized pivot derivative absolute error 0.0000053035. Not a true zero-variance boundary and not calibrated confidence intervals.</desc>
