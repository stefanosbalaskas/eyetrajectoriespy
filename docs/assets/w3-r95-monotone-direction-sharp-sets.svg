<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="665" viewBox="0 0 1160 665" role="img" aria-labelledby="ttl dsc"><title id="ttl">R95 monotone return direction sharp binary population mean sets at 99 percent completion</title><desc id="dsc">With a 99 percent audit return rate the unrestricted and unknown-direction interval is 0.495 to 0.505. Knowing actual return favors binary outcome one restricts to 0.495 to 0.5, favors zero restricts to 0.5 to 0.505, exact equal response yields 0.5, and a directional upper response ratio of 1.01 restricts to 0.497512 to 0.5. These are mathematical identified sets and not confidence intervals.</desc><rect width="1160" height="665" fill="#ffffff"/><text x="35" y="55" font-family="system-ui,sans-serif" font-size="29" font-weight="700" fill="#223046">Direction of return changes the sharp set</text><text x="35" y="87" font-family="system-ui,sans-serif" font-size="18" fill="#57667a">R95 exact population results • invited nonreturn δ=1% • no sampling uncertainty</text><line x1="304" y1="145" x2="304" y2="558" stroke="#d4dce3" stroke-width="1" stroke-dasharray="4 6"/><text x="304" y="132" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle" fill="#283c51">0.495</text><line x1="609.0000000000002" y1="145" x2="609.0000000000002" y2="558" stroke="#d4dce3" stroke-width="2" stroke-dasharray="4 6"/><text x="609.0000000000002" y="132" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle" fill="#283c51">0.500</text><line x1="914.0000000000005" y1="145" x2="914.0000000000005" y2="558" stroke="#d4dce3" stroke-width="1" stroke-dasharray="4 6"/><text x="914.0000000000005" y="132" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle" fill="#283c51">0.505</text><text x="956" y="134" font-family="system-ui,sans-serif" font-size="16" fill="#506176">Set width</text><text x="35" y="186" font-family="system-ui,sans-serif" font-size="17" fill="#1f3348">Unrestricted</text><line x1="304" x2="914.0000000000005" y1="181" y2="181" stroke="#3d7195" stroke-width="9" stroke-linecap="round"/><circle cx="304" cy="181" r="6" fill="#204a6c"/><circle cx="914.0000000000005" cy="181" r="6" fill="#204a6c"/><text x="957" y="186" font-family="system-ui,sans-serif" font-size="17" fill="#3f5569">0.010000</text><text x="35" y="251" font-family="system-ui,sans-serif" font-size="17" fill="#1f3348">Returns favor Z=1</text><line x1="304" x2="609.0000000000002" y1="246" y2="246" stroke="#3d7195" stroke-width="9" stroke-linecap="round"/><circle cx="304" cy="246" r="6" fill="#204a6c"/><circle cx="609.0000000000002" cy="246" r="6" fill="#204a6c"/><text x="957" y="251" font-family="system-ui,sans-serif" font-size="17" fill="#3f5569">0.005000</text><text x="35" y="316" font-family="system-ui,sans-serif" font-size="17" fill="#1f3348">Returns favor Z=0</text><line x1="609.0000000000002" x2="914.0000000000005" y1="311" y2="311" stroke="#3d7195" stroke-width="9" stroke-linecap="round"/><circle cx="609.0000000000002" cy="311" r="6" fill="#204a6c"/><circle cx="914.0000000000005" cy="311" r="6" fill="#204a6c"/><text x="957" y="316" font-family="system-ui,sans-serif" font-size="17" fill="#3f5569">0.005000</text><text x="35" y="381" font-family="system-ui,sans-serif" font-size="17" fill="#1f3348">Equal actual return</text><line x1="609.0000000000002" x2="609.0000000000002" y1="376" y2="376" stroke="#3d7195" stroke-width="9" stroke-linecap="round"/><circle cx="609.0000000000002" cy="376" r="6" fill="#204a6c"/><circle cx="609.0000000000002" cy="376" r="6" fill="#204a6c"/><text x="957" y="381" font-family="system-ui,sans-serif" font-size="17" fill="#3f5569">0</text><text x="35" y="446" font-family="system-ui,sans-serif" font-size="17" fill="#1f3348">Favor Z=1; capped ratio</text><line x1="457.258706467666" x2="609.0000000000002" y1="441" y2="441" stroke="#3d7195" stroke-width="9" stroke-linecap="round"/><circle cx="457.258706467666" cy="441" r="6" fill="#204a6c"/><circle cx="609.0000000000002" cy="441" r="6" fill="#204a6c"/><text x="957" y="446" font-family="system-ui,sans-serif" font-size="17" fill="#3f5569">0.002488</text><text x="35" y="511" font-family="system-ui,sans-serif" font-size="17" fill="#1f3348">Direction unknown</text><line x1="304" x2="914.0000000000005" y1="506" y2="506" stroke="#3d7195" stroke-width="9" stroke-linecap="round"/><circle cx="304" cy="506" r="6" fill="#204a6c"/><circle cx="914.0000000000005" cy="506" r="6" fill="#204a6c"/><text x="957" y="511" font-family="system-ui,sans-serif" font-size="17" fill="#3f5569">0.010000</text><text x="35" y="625" font-family="system-ui,sans-serif" font-size="16" fill="#67788a">All six latent mechanisms reproduce the same observable probability law.</text></svg>