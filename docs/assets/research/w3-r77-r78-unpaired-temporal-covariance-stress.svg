<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="810" viewBox="0 0 1320 810" role="img" aria-labelledby="title desc"><title id="title">R77 versus R78 separate-source Gaussian covariance robustness stress</title><desc id="desc">R77 independent-trial noise and R78 Gaussian time-scaled AR(1) covariance across separate new source blocks, at two extreme independent units and predictor-dependent heteroskedasticity. Curves HC3 1 vs5, lambda .25 22 vs15, lambda .50 24 vs22, source-known 27 vs26; participants HC3 9 vs9, lambda .25 23 vs19, lambda .50 24 vs19, source-known 29 vs28.</desc><rect width="1320" height="810" fill="#fff"/><style>text{font-family:Inter,Arial,sans-serif;fill:#193344}.head{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#526a78}.lbl{font-size:18px;font-weight:650}.value{font-size:17px;font-weight:700}.foot{font-size:14px;fill:#526a78}</style><text x="63" y="56" class="head">Does a fixed regularizer transport across time-covariance laws?</text><text x="63" y="90" class="sub">Two extreme ±4 units, predictor-dependent noise; distinct independent R77 and R78 source blocks (32 per design/study)</text><rect x="60" y="150" width="1195" height="242" rx="13" fill="#f7fafb" stroke="#e0e9eb"/><text class="lbl" x="82" y="181">Independent curves</text><text class="lbl" x="210" y="210" text-anchor="middle">HC3</text><rect x="169" y="358.25" width="36" height="3.75" rx="3" fill="#c86054" opacity=".47"/><rect x="219" y="343.25" width="36" height="18.75" rx="3" fill="#c86054"/><text class="value" x="187" y="353.25" text-anchor="middle">1</text><text class="value" x="237" y="338.25" text-anchor="middle">5</text><text class="lbl" x="471" y="210" text-anchor="middle">λ=.25</text><rect x="430" y="279.5" width="36" height="82.5" rx="3" fill="#3d82b0" opacity=".47"/><rect x="480" y="305.75" width="36" height="56.25" rx="3" fill="#3d82b0"/><text class="value" x="448" y="274.5" text-anchor="middle">22</text><text class="value" x="498" y="300.75" text-anchor="middle">15</text><text class="lbl" x="732" y="210" text-anchor="middle">λ=.50</text><rect x="691" y="272" width="36" height="90" rx="3" fill="#168a7b" opacity=".47"/><rect x="741" y="279.5" width="36" height="82.5" rx="3" fill="#168a7b"/><text class="value" x="709" y="267" text-anchor="middle">24</text><text class="value" x="759" y="274.5" text-anchor="middle">22</text><text class="lbl" x="993" y="210" text-anchor="middle">Known-law</text><rect x="952" y="260.75" width="36" height="101.25" rx="3" fill="#626dae" opacity=".47"/><rect x="1002" y="264.5" width="36" height="97.5" rx="3" fill="#626dae"/><text class="value" x="970" y="255.75" text-anchor="middle">27</text><text class="value" x="1020" y="259.5" text-anchor="middle">26</text><rect x="60" y="423" width="1195" height="242" rx="13" fill="#f7fafb" stroke="#e0e9eb"/><text class="lbl" x="82" y="454">Repeated-trial participants</text><text class="lbl" x="210" y="483" text-anchor="middle">HC3</text><rect x="169" y="601.25" width="36" height="33.75" rx="3" fill="#c86054" opacity=".47"/><rect x="219" y="601.25" width="36" height="33.75" rx="3" fill="#c86054"/><text class="value" x="187" y="596.25" text-anchor="middle">9</text><text class="value" x="237" y="596.25" text-anchor="middle">9</text><text class="lbl" x="471" y="483" text-anchor="middle">λ=.25</text><rect x="430" y="548.75" width="36" height="86.25" rx="3" fill="#3d82b0" opacity=".47"/><rect x="480" y="563.75" width="36" height="71.25" rx="3" fill="#3d82b0"/><text class="value" x="448" y="543.75" text-anchor="middle">23</text><text class="value" x="498" y="558.75" text-anchor="middle">19</text><text class="lbl" x="732" y="483" text-anchor="middle">λ=.50</text><rect x="691" y="545" width="36" height="90" rx="3" fill="#168a7b" opacity=".47"/><rect x="741" y="563.75" width="36" height="71.25" rx="3" fill="#168a7b"/><text class="value" x="709" y="540" text-anchor="middle">24</text><text class="value" x="759" y="558.75" text-anchor="middle">19</text><text class="lbl" x="993" y="483" text-anchor="middle">Known-law</text><rect x="952" y="526.25" width="36" height="108.75" rx="3" fill="#626dae" opacity=".47"/><rect x="1002" y="530" width="36" height="105" rx="3" fill="#626dae"/><text class="value" x="970" y="521.25" text-anchor="middle">29</text><text class="value" x="1020" y="525" text-anchor="middle">28</text><rect x="68" y="710" width="19" height="19" rx="3" fill="#697e89" opacity=".47"/><text class="sub" x="99" y="726">R77: independent trial Gaussian noise</text><rect x="468" y="710" width="19" height="19" rx="3" fill="#697e89"/><text class="sub" x="497" y="726">R78: time-varying AR(1) Gaussian trial noise</text><text class="foot" x="65" y="762">Different newly generated R77/R78 datasets: do not compute source-paired deltas across studies; display is descriptive.</text><text class="foot" x="65" y="783">Each method is evaluated on the same source blocks only within its own study. Known-law oracle is simulation-specific.</text></svg>
