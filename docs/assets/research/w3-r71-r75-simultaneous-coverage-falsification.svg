<title id="title">Numerically verified estimated confidence bands can severely under-cover their known generating truth</title><desc id="desc">Six independent simulation study-condition rows. Red estimated procedures versus teal generating-Gaussian law; each condition has 32 independent source blocks. R71 2 vs 26 and 13 vs 27; R73 0 vs 27 and 2 vs 27; R75 1 vs 26 and 10 vs 26.</desc>
