<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="809" viewBox="0 0 1330 809" role="img" aria-labelledby="title desc"><title id="title">R84 original MNAR selection delta mean absolute parameter errors for 25 vs 50 percent external missing-outcome recovery across eight configurations</title><desc id="desc">Eight design-support-variance cells each have mean absolute delta error for 25 and 50 percent independent random external missing outcome ascertainment, n32 original generating source blocks. Curves: two anchors constant .1242 .0863, heteroskedastic .1116 .0818; sixteen constant .1248 .0830, heteroskedastic .1414 .1506. Participants: two constant .1095 .0861, heteroskedastic .1169 .1129; sixteen constant .0944 .0871, heteroskedastic .1991 .1999. More recovery does not guarantee smaller finite-sample average error.</desc><rect width="1330" height="809" fill="white"/><style>text{font-family:Inter,Arial,sans-serif;fill:#203849}.title{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#586f7f}.panel{font-size:17px;font-weight:740}.small{font-size:14px;fill:#5c7280}.val{font-size:15px;font-weight:730}</style><text class="title" x="58" y="54">R84: more externally recovered values do not remove model dependence</text><text class="sub" x="58" y="86">MNAR generating δ=1.1 · source mean |fitted δ − true δ| · n=32 independent blocks per condition</text><rect x="58" y="158" width="603" height="119" rx="12" fill="#f7fafb" stroke="#e0e9ed"/><text class="panel" x="72" y="184">2 anchors / constant variance</text><text class="small" x="74" y="217">25%</text><rect x="130" y="207" width="200.81942090833334" height="17" rx="3" fill="#bf7358"/><text class="val" x="338.8194209083333" y="220">0.124</text><text class="small" x="74" y="250">50%</text><rect x="130" y="240" width="139.44181439833335" height="17" rx="3" fill="#398b90"/><text class="val" x="277.44181439833335" y="253">0.086</text><rect x="58" y="286" width="603" height="119" rx="12" fill="#f7fafb" stroke="#e0e9