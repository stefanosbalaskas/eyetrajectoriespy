 x="514" y="713">50% recovered</text><text x="60" y="764" class="small">Additional recovery is independent by simulator construction. Some source conditions have larger average absolute error at 50%.</text><text x="60" y="786" class="small">All errors are descriptive source means, not a confidence-interval calibration assessment or identification guarantee for actual gaze loss.</text></svg>
