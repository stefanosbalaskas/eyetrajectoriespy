<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="735" viewBox="0 0 1340 735" role="img" aria-labelledby="title desc"><title id="title">R80 Student-t5 lower-tail estimated marginal standard errors and Gaussian critical reference</title><desc id="desc">Two-anchor heteroskedastic R80 Student-t5 study. HC3, fixed lambda .25, fixed lambda .50 source-averaged 10th percentile estimated to true SE ratio: curves .426 .557 .626 participants .493 .526 .547; simultaneous Gaussian critical curves 2.712 2.951 3.055 participants 2.248 2.819 2.999.</desc><rect width="1340" height="735" fill="#fff"/><style>text{font-family:Inter,Arial,sans-serif;fill:#1a3446}.head{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#516c7b}.panel{font-size:18px;font-weight:700}.tick{font-size:14px;fill:#566e7d}.val{font-size:16px;font-weight:750}.foot{font-size:14px;fill:#5b6f7b}</style><text x="65" y="58" class="head">Student-t5 stress: what changes in simultaneous uncertainty?</text><text x="65" y="90" class="sub">R80 · two extreme units, predictor-dependent noise · n=32 independent primitive source blocks per design</text><rect x="65" y="146" width="579" height="461" rx="13" fill="#f7fafb" stroke="#dce5e9"/><text x="82" y="179" class="panel">Source mean of marginal SE ratio 10th percentile</text><line x1="149" y1="539" x2="585" y2="539" stroke="#dce5e9"/><text x="138" y="544" text-anchor="end" class="tick">0.00</text><line x1="149" y1="459" x2="585" y2="459" stroke="#dce5e9"/><text x="138" y="464" text-anchor="end" class="tick">0.21</text><line x1="149" y1="379" x2="585" y2="379" stroke="#dce5e9"/><text x="138" y="384" text-anchor="end" class="tick">0.42</text><line x1="149" y1="299" x2="585" y2="299" stroke="#dce5e9"/><text x="138" y="304" text-anchor="end" class="tick">0.64</text><line x1="149" y1="219" x2="585" y2="219" stroke="#dce5e9"/><text x="138" y="224" text-anchor="end" class="tick">0.85</text><polyline points="149,378.65524409013153 367,329.12105405876343 585,303.240581