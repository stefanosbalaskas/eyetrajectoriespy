<title id="t">Four-chain independent NUTS rank-one population convergence: six prior-generated datasets</title>
<desc id="d">Minimum bulk ESS across prespecified population functionals for each dataset: B6 1316 and 1892; B7 paired 1174 and 707; B7 asynchronous 1149 and 983. Maximum rank R-hat ranges 1.0016 to 1.0058. All six datasets pass the exploratory mixing screen. This is not posterior coverage validation.</desc>
