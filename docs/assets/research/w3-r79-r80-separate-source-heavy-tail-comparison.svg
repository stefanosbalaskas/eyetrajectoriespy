<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="811" viewBox="0 0 1340 811" role="img" aria-labelledby="title desc"><title id="title">R79 to R80 unpaired separate-source Gaussian versus Student-t5 whole-slope inclusion comparisons</title><desc id="desc">Two unpaired separate-source bar group comparisons in two-anchor heteroskedastic design. Curves R79 to R80: baseline HC3 3 to 5, lambda .25 19 to 19, lambda .50 24 to 23, known-source reference 26 to 29. Participants HC3 11 to 17, lambda .25 17 to 22, lambda .50 20 to 24, known-source 27 to 28.</desc><rect width="1340" height="811" fill="white"/><style>text{font-family:Inter,Arial,sans-serif;fill:#1f3546}.head{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#516b7b}.panel{font-size:18px;font-weight:700}.value{font-size:17px;font-weight:750}.foot{font-size:14px;fill:#536d79}</style><text class="head" x="60" y="56">R79 vs R80: portability to heavy-tailed unit innovations</text><text class="sub" x="60" y="89">Same frozen candidate methods, different new independent source blocks and error laws · n=32 per design/study</text><rect x="62" y="157" width="1214" height="248" rx="14" fill="#f7fafb" stroke="#dce6eb"/><text class="panel" x="82" y="187">Independent curves</text><text class="panel" x="221" y="214" text-anchor="middle">HC3 Gaussian</text><rect x="175" y="349.25" width="40" height="12.75" rx="4" fill="#c85f56" opacity=".43"/><rect x="230" y="340.75" width="40" height="21.25" rx="4" fill="#c85f56"/><text class="value" x="195" y="342.25" text-anchor="middle">3</text><text class="value" x="250" y="333.75" text-anchor="middle">5</text><text class="panel" x="483" y="214" text-anchor="middle">Fixed λ=.25</text><rect x="437" y="281.25" width="40" height="80.75" rx="4" fill="#4d82b4" opacity=".43"/><rect x="492" y="281.25" width="40" height="80.75" rx="4" fill="#4d82b4"/><text class="value" x="457" y="274.25" text-anchor="middle">19</text><text class="value" x="512" y="274.25" text-anchor="middle">19</text><text class="panel" x="745" y="214" text-anchor="middle">Fixed λ=.50</text><rect x="699" y="260" width="40" height="102" rx="4" fill="#168b7e" opacity=".43"/><rect x="754" y="264.25" width="40" height="97.75" rx="4" fill="#168b7e"/><text class="value" x="719" y="253" text-anchor="middle">24</text><text class="value" x="774" y="257.25" text-anchor="middle">23</text><text class="panel" x="1007" y="214" text-anchor="middle">Source-known law</text><rect x="961" y="251.5" width="40" height="110.5" rx="4" fill="#6673aa" opacity=".43"/><rect x="1016" y="238.75" width="40" height="123.25" rx="4" fill="#6673aa"/><text class="value" x="981" y="244.5" text-anchor="middle">26</text><text class="value" x="1036" y="231.75" text-anchor="middle">29</text><rect x="62" y="430" width="1214" height="248" rx="14" fill="#f7fafb" stroke="#dce6eb"/><text class="panel" x="82" y="460">Repeated-trial participants</text><text class="panel" x="221" y="487" text-anchor="middle">HC3 Gaussian</text><rect x="175" y="588.25" width="40" height="46.75" rx="4" fill="#c85f56" opacity=".43"/><rect x="230" y="562.75" width="40" height="72.25" rx="4" fill="#c85f56"/><text class="value" x="195" y="581.25" text-anchor="middle">11</text><text class="value" x="250" y="555.75" text-anchor="middle">17</text><text class="panel" x="483" y="487" text-anchor="middle">Fixed λ=.25</text><rect x="437" y="562.75" width="40" height="72.25" rx="4" fill="#4d82b4" opacity=".43"/><rect x="492" y="541.5" width="40" height="93.5" rx="4" fill="#4d82b4"/><text class="value" x="457" y="555.75" text-anchor="middle">17</text><text class="value" x="512" y="534.5" text-anchor="middle">22</text><text class="panel" x="745" y="487" text-anchor="middle">Fixed λ=.50</text><rect x="699" y="550" width="40" height="85" rx="4" fill="#168b7e" opacity=".43"/><rect x="754" y="533" width="40" height="102" rx="4" fill="#168b7e"/><text class="value" x="719" y="543" text-anchor="middle">20</text><text class="value" x="774" y="526" text-anchor="middle">24</text><text class="panel" x="1007" y="487" text-anchor="middle">Source-known law</text><rect x="961" y="520.25" width="40" height="114.75" rx="4" fill="#6673aa" opacity=".43"/><rect x="1016" y="516" width="40" height="119" rx="4" fill="#6673aa"/><text class="value" x="981" y="513.25" text-anchor="middle">27</text><text class="value" x="1036" y="509" text-anchor="middle">28</text><rect x="68" y="715" width="18" height="18" rx="3" fill="#748392" opacity=".43"/><text class="sub" x="99" y="730">R79 nonseparable Gaussian</text><rect x="428" y="715" width="18" height="18" rx="3" fill="#748392"/><text class="sub" x="457" y="730">R80 nonseparable unit Student-t5</text><text class="foot" x="65" y="769">Between-stage source blocks are different: these contrasts are descriptive and cannot be treated as paired causal effects of heavy tails.</text><text class="foot" x="65" y="788">The oracle changes from a Gaussian source-known reference in R79 to an independent-unit t5 mixture reference in R80.</text></svg>
