">2.70</text><line x1="754" y1="300.75" x2="1204" y2="300.75" stroke="#dce7e9"/><text class="tick" x="742" y="305.75" text-anchor="end">3.05</text><line x1="754" y1="222" x2="1204" y2="222" stroke="#dce7e9"/><text class="tick" x="742" y="227" text-anchor="end">3.40</text><polyline points="754,375.58878192127565 979,321.66814308474136 1204,298.1958509562204" stroke="#16887e" stroke-width="4" fill="none"/><circle cx="754" cy="375.58878192127565" r="6" fill="#16887e" stroke="#fff" stroke-width="2"/><text x="754" y="360.58878192127565" class="val" text-anchor="middle">2.717</text><circle cx="979" cy="321.66814308474136" r="6" fill="#16887e" stroke="#fff" stroke-width="2"/><text x="979" y="306.66814308474136" class="val" text-anchor="middle">2.957</text><circle cx="1204" cy="298.1958509562204" r="6" fill="#16887e" stroke="#fff" stroke-width="2"/><text x="1204" y="283.1958509562204" class="val" text-anchor="middle">3.061</text><polyline points="754,482.924686337205 979,353.1111890334744 1204,310.34133908240517" stroke="#7a5aa3" stroke-width="4" fill="none"/><circle cx="754" cy="482.924686337205" r="6" fill="#7a5aa3" stroke="#fff" stroke-width="2"/><text x="754" y="506.924686337205" class="val" text-anchor="middle">2.240</text><circle cx="979" cy="353.1111890334744" r="6" fill="#7a5aa3" stroke="#fff" stroke-width="2"/><text x="979" y="377.1111890334744" class="val" text-anchor="middle">2.817</text><circle cx="1204" cy="310.34133908240517" r="6" fill="#7a5aa3" stroke="#fff" stroke-width="2"/><text x="1204" y="334.34133908240517" class="val" text-anchor="middle">3.007</text><text x="754" y="567" text-anchor="middle" class="tick">HC3</text><text x="979" y="567" text-anchor="middle" class="tick">λ=.25</text><text x="1204" y="567" text-anchor="middle" class="tick">λ=.50</text><line x1="67" y1="630" x2="97" y2="630" stroke="#16887e" stroke-width="4"/><text x="105" y="636" class="sub">Independent curves</text><line x1="358" y1="630" x2="388" y2="630" stroke="#7a5aa3" stroke-width