<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="730" viewBox="0 0 1300 730" role="img" aria-labelledby="title desc"><title id="title">R78 source-wise standard-error lower tail and Gaussian maximum-statistic criticals</title><desc id="desc">Two-panel original audit-traceable R78 plots. For two extreme heteroskedastic independent units, curves HC3, regularized lambda .25, regularized lambda .50 SE ratio lower tail .442 .578 .651; participants .487 .517 .541. Gaussian criticals curves 2.717 2.957 3.061 and participants 2.240 2.817 3.007.</desc><rect width="1300" height="730" fill="#fff"/><style>text{font-family:Inter,Arial,sans-serif;fill:#18303c}.head{font-size:28px;font-weight:750}.sub{font-size:17px;fill:#536d79}.lbl{font-size:18px;font-weight:700}.tick{font-size:14px;fill:#526977}.val{font-size:16px;font-weight:700}.foot{font-size:14px;fill:#536e7a}</style><text x="62" y="53" class="head">How covariance regularization changes band uncertainty</text><text x="62" y="86" class="sub">R78 · time-scaled Gaussian AR(1) · two extreme high-noise units · 32 source blocks per design</text><rect x="62" y="145" width="570" height="456" rx="14" fill="#f7fafb" stroke="#dce8ec"/><text x="81" y="178" class="lbl">Mean source-specific 10th-percentile SE / true SE</text><line x1="142" y1="537" x2="592" y2="537" stroke="#dce7e9"/><text class="tick" x="130" y="542" text-anchor="end">0.00</text><line x1="142" y1="458.25" x2="592" y2="458.25" stroke="#dce7e9"/><text class="tick" x="130" y="463.25" text-anchor="end">0.21</text><line x1="142" y1="379.5" x2="592" y2="379.5" stroke="#dce7e9"/><text class="tick" x="130" y="384.5" text-anchor="end">0.42</text><line x1="142" y1="300.75" x2="592" y2="300.75" stroke="#dce7e9"/><text class="tick" x="130" y="305.75" text-anchor="end">0.64</text><line x1="142" y1="222" x2="592" y2="222" stroke="#dce7e9"/><text class="tick" x="130" y="227" text-anchor="end">0.85</text><polyline points="142,373.3532597173445 367,322.76545454227175 592,295.