<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="846" viewBox="0 0 1350 846" role="img" aria-labelledby="title desc"><title id="title">R85 primary adverse MNAR source mean estimated selection coefficient across five external validation strategies</title><desc id="desc">Five strategies for two independent-unit configurations: curve fitted delta 1.023,1.286,1.030,1.671,1.028; repeated participants .965,1.186,.961,1.523,.950. True generating delta 1.1. n32 independent source blocks per fixed cell. Latent oracle requires generator-known recovery probabilities.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#1c3649}.head{font-size:29px;font-weight:760}.sub{font-size:16px;fill:#536e7c}.panel{font-size:20px;font-weight:745}.label{font-size:14px;font-weight:695}.value{font-size:16px;font-weight:730}.tick{font-size:13px;fill:#526c7b}.foot{font-size:14px;fill:#5a7180}</style><rect width="1350" height="846" fill="white"/><text class="head" x="55" y="57">R85: selective validation shifts the inferred missingness coefficient</text><text class="sub" x="55" y="90">Generating MNAR δ = 1.1 · two influential predictor units · heterogeneous source variance · 32 independent blocks per panel</text><rect x="54" y="156" width="605" height="579" rx="14" fill="#f7fafb" stroke="#dde7eb"/><text class="panel" x="74" y="192">Independent curves</text><text x="72" y="271" class="label">Independent, known</text><rect x="240" y="250" width="295" height="28" rx="4" fill="#e2eaed"/><rect x="240" y="250" width="167.72739611111112" height="28" rx="4" fill="#368a7c"/><text x="547" y="271" class="value">1.023</text><text x="72" y="365" class="label">Recorded, naïve</text><rect x="240" y="344" width="295" height="28" rx="4" fill="#e2eaed"/><rect x="240" y="344" width="210.7089288888889" height="28" rx="4" fill="#bf9a56"/><text x="547" y="365" class="value">1.286</text><text x="72" y="459" class="label">Recorded, corrected</text><rect x="240" y="438" width="295" height="28" rx="4" fill="#e2eaed"/><rect x="240" y="438" width="168.82269833333334" height="28" rx="4" fill="#4c8fa4"/><text x="547" y="459" class="value">1.030</text><text x="72" y="553" class="label">Latent, naïve</text><rect x="240" y="532" width="295" height="28" rx="4" fill="#e2eaed"/><rect x="240" y="532" width="273.8187213888889" height="28" rx="4" fill="#bf695c"/><text x="547" y="553" class="value">1.671</text><text x="72" y="647" class="label">Latent, oracle</text><rect x="240" y="626" width="295" height="28" rx="4" fill="#e2eaed"/><rect x="240" y="626" width="168.53138583333333" height="28" rx="4" fill="#8769ad"/><text x="547" y="647" class="value">1.028</text><line x1="420.27777777777777" x2="420.27777777777777" y1="230" y2="708" stroke="#2f4150" stroke-dasharray="6 6" stroke-width="2"/><text x="76" y="722" class="tick">Dotted line: source-known δ=1.1 (not available during fitting)</text><rect x="701" y="156" width="605" height="579" rx="14" fill="#f7fafb" stroke="#dde7eb"/><text class="panel" x="721" y="192">Repeated participants</text><text x="719" y="271" class="label">Independent, known</text><rect x="887" y="250" width="295" height="28" rx="4" fill="#e2eaed"/><rect x="887" y="250" width="158.20101027777778" height="28" rx="4" fill="#368a7c"/><text x="1194" y="271" class="value">0.965</text><text x="719" y="365" class="label">Recorded, naïve</text><rect x="887" y="344" width="295" height="28" rx="4" fill="#e2eaed"/><rect x="887" y="344" width="194.40534416666665" height="28" rx="4" fill="#bf9a56"/><text x="1194" y="365" class="value">1.186</text><text x="719" y="459" class="label">Recorded, corrected</text><rect x="887" y="438" width="295" height="28" rx="4" fill="#e2eaed"/><rect x="887" y="438" width="157.49127305555555" height="28" rx="4" fill="#4c8fa4"/><text x="1194" y="459" class="value">0.961</text><text x="719" y="553" class="label">Latent, naïve</text><rect x="887" y="532" width="295" height="28" rx="4" fill="#e2eaed"/><rect x="887" y="532" width="249.5884047222222" height="28" rx="4" fill="#bf695c"/><text x="1194" y="553" class="value">1.523</text><text x="719" y="647" class="label">Latent, oracle</text><rect x="887" y="626" width="295" height="28" rx="4" fill="#e2eaed"/><rect x="887" y="626" width="155.73718666666664" height="28" rx="4" fill="#8769ad"/><text x="1194" y="647" class="value">0.950</text><line x1="1067.2777777777778" x2="1067.2777777777778" y1="230" y2="708" stroke="#2f4150" stroke-dasharray="6 6" stroke-width="2"/><text x="723" y="722" class="tick">Dotted line: source-known δ=1.1 (not available during fitting)</text><text x="60" y="790" class="foot">Latent, oracle is simulator-only: true outcome-based recovery propensity is not identified from the original gaze data.</text><text x="60" y="812" class="foot">Point estimates only; no confidence intervals, MNAR identification guarantee, real recovery device or full-function calibration.</text></svg>
