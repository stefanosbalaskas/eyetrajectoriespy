<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="815" viewBox="0 0 1340 815" role="img" aria-labelledby="title desc"><title id="title">R80 Student-t5 independent source whole-functional slope truth inclusion</title><desc id="desc">Four source-level comparison panels for independent curves and participants, 2 and 16 extreme predictor units. 32 source blocks each: adverse two-anchor curves wild 3, HC3 5, lambda .25 19, lambda .50 23, known t5 29. Participants wild 7, HC3 17, .25 22, .50 24, known t5 28. 16 anchor curves 20,28,31,32,30; participants 26,29,29,32,30.</desc><rect width="1340" height="815" fill="white"/><style>text{font-family:Inter,Arial,sans-serif;fill:#1b3343}.head{font-size:30px;font-weight:750}.sub{font-size:16px;fill:#536d7b}.panel{font-size:17px;font-weight:750}.tick{font-size:14px;fill:#526a7b}.value{font-size:15px;font-weight:750}.foot{font-size:14px;fill:#536a79}</style><text class="head" x="60" y="60">R80: whole-function truth inclusion under Student-t5 errors</text><text class="sub" x="60" y="95">Unit-level heavy tails, nonseparable covariance, predictor-dependent noise · n=32 independent source blocks per condition</text><rect x="61" y="109" width="16" height="16" rx="3" fill="#b58c59"/><text class="sub" x="85" y="122">Wild-HC1</text><rect x="471" y="109" width="16" height="16" rx="3" fill="#c55b50"/><text class="sub" x="495" y="122">HC3 Gaussian</text><rect x="881" y="109" width="16" height="16" rx="3" fill="#3c83b8"/><text class="sub" x="905" y="122">Fixed λ=.25</text><rect x="61" y="139" width="16" height="16" rx="3" fill="#178b7c"/><text class="sub" x="85" y="152">Fixed λ=.50</text><rect x="471" y="139" width="16" height="16" rx="3" fill="#666ead"/><text class="sub" x="495" y="152">Student-t5 known law</text><rect x="55" y="203" width="603" height="258" rx="12" fill="#f7fafb" stroke="#dce5e9"/><text x="73" y="232" class="panel">Independent curves · 2 extremes</text><line x1="210" y1="246" x2="210" y2="437" stroke="#dce6eb"/><text class="tick" x="210" y="462" text-anchor="middle">0</text><line x1="305" y1="246" x2="305" y2="437" stroke="#dce6eb"/><text class="tick" x="305" y="462" text-anchor="middle">8</text><line x1="400" y1="246" x2="400" y2="437" stroke="#dce6eb"/><text class="tick" x="400" y="462" text-anchor="middle">16</text><line x1="495" y1="246" x2="495" y2="437" stroke="#dce6eb"/><text class="tick" x="495" y="462" text-anchor="middle">24</text><line x1="590" y1="246" x2="590" y2="437" stroke="#dce6eb"/><text class="tick" x="590" y="462" text-anchor="middle">32</text><text class="tick" x="198" y="268" text-anchor="end">Wild</text><rect x="210" y="253" width="35.625" height="20" rx="3" fill="#b58c59"/><text class="value" x="254.625" y="268">3/32</text><text class="tick" x="198" y="303" text-anchor="end">HC3</text><rect x="210" y="288" width="59.375" height="20" rx="3" fill="#c55b50"/><text class="value" x="278.375" y="303">5/32</text><text class="tick" x="198" y="338" text-anchor="end">λ=.25</text><rect x="210" y="323" width="225.625" height="20" rx="3" fill="#3c83b8"/><text class="value" x="444.625" y="338">19/32</text><text class="tick" x="198" y="373" text-anchor="end">λ=.50</text><rect x="210" y="358" width="273.125" height="20" rx="3" fill="#178b7c"/><text class="value" x="492.125" y="373">23/32</text><text class="tick" x="198" y="408" text-anchor="end">Known t5</text><rect x="210" y="393" width="344.375" height="20" rx="3" fill="#666ead"/><text class="value" x="563.375" y="408">29/32</text><rect x="705" y="203" width="603" height="258" rx="12" fill="#f7fafb" stroke="#dce5e9"/><text x="723" y="232" class="panel">Independent curves · 16 extremes</text><line x1="860" y1="246" x2="860" y2="437" stroke="#dce6eb"/><text class="tick" x="860" y="462" text-anchor="middle">0</text><line x1="955" y1="246" x2="955" y2="437" stroke="#dce6eb"/><text class="tick" x="955" y="462" text-anchor="middle">8</text><line x1="1050" y1="246" x2="1050" y2="437" stroke="#dce6eb"/><text class="tick" x=