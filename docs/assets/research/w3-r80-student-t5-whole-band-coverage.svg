</text><rect x="860" y="563" width="344.375" height="20" rx="3" fill="#c55b50"/><text class="value" x="1213.375" y="578">29/32</text><text class="tick" x="848" y="613" text-anchor="end">λ=.25</text><rect x="860" y="598" width="344.375" height="20" rx="3" fill="#3c83b8"/><text class="value" x="1213.375" y="613">29/32</text><text class="tick" x="848" y="648" text-anchor="end">λ=.50</text><rect x="860" y="633" width="380" height="20" rx="3" fill="#178b7c"/><text class="value" x="1249" y="648">32/32</text><text class="tick" x="848" y="683" text-anchor="end">Known t5</text><rect x="860" y="668" width="356.25" height="20" rx="3" fill="#666ead"/><text class="value" x="1225.25" y="683">30/32</text><text x="59" y="770" class="foot">Whole 31 × 2 slope truth inclusion, 32 independently generated source blocks per cell, complete and Gaussian-conditional Student-t5.</text><text x="59" y="790" class="foot">Known t5 reference is a source-only variance-mixture oracle, not a feasible real-data estimator. None is qualified for general 90% coverage.</text></svg>
