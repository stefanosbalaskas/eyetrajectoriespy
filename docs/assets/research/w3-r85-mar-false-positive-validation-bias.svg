<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="820" viewBox="0 0 1360 820" role="img" aria-labelledby="title desc"><title id="title">R85 MAR negative control shows spurious positive MNAR coefficient under latent-outcome-selective external validation when recovery weighting assumes independence</title><desc id="desc">True δ0 in MAR original gaze selection. Source mean fitted delta curves independent -.006, recorded naïve -.040, recorded correct -.009, outcome selective naïve +.664 and oracle -.019. Participants independent +.021, recorded naïve +.009, recorded correct +.007, latent naïve +.630, latent oracle -.005. n32 independent blocks per design, two extreme anchors, heteroskedasticity. No confidence intervals.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#1e3948}.head{font-size:29px;font-weight:755}.sub{font-size:16px;fill:#556f7d}.panel{font-size:21px;font-weight:740}.lab{font-size:14px;font-weight:710}.val{font-size:17px;font-weight:750}.foot{font-size:15px;fill:#54707e}</style><rect width="1360" height="853" fill="white"/><text x="60" y="58" class="head">R85 negative control: selective validation can create apparent MNAR</text><text x="60" y="92" class="sub">True original gaze observation mechanism is MAR (δ = 0). Fixed two-anchor heterogeneous source, n=32 generating blocks.</text><rect x="53" y="150" width="619" height="572" rx="14" fill="#f7fafb" stroke="#dce7ec"/><text x="76" y="185" class="panel">Independent curves</text><line x1="329" x2="329" y1="229" y2="691" stroke="#243e50" stroke-width="2" stroke-dasharray="5 6"/><text x="70" y="264" class="lab">Independent known</text><rect x="326.54485999999997" y="241" width="2.4551400000000285" height="27" rx="3" fill="#398c81"/><text x="545" y="261" class="val">-0.006</text><text x="70" y="357" class="lab">Recorded naïve</text><rect x="313.6985173333333" y="334" width="15.301482666666686" height="27" rx="3" fill="#bf9760"/><text x="545" y="354" class="val">-0.040</text><text x="70" y="450" class="lab">Recorded correct</text><rect x="325.478704" y="427" width="3.5212960000000066" height="27" rx="3" fill="#5d8dac"/><text x="545" y="447" class="val">-0.009</text><text x="70" y="543" class="lab">Latent naïve</text><rect x="329" y="520" width="256.63055066666675" height="27" rx="3" fill="#bc6a60"/><text x="545" y="540" class="val">+0.664</text><text x="70" y="636" class="lab">Latent oracle</text><rect x="321.743968" y="613" width="7.256032000000005" height="27" rx="3" fill="#8466a9"/><text x="545" y="633" class="val">-0.019</text><rect x="708" y="150" width="619" height="572" rx="14" fill="#f7fafb" stroke="#dce7ec"/><text x="731" y="185" class="panel">Repeated participants</text><line x1="984" x2="984" y1="229" y2="691" stroke="#243e50" stroke-width="2" stroke-dasharray="5 6"/><text x="725" y="264" class="lab">Independent known</text><rect x="984" y="241" width="8.01242933333333" height="27" rx="3" fill="#398c81"/><text x="1200" y="261" class="val">+0.021</text><text x="725" y="357" class="lab">Recorded naïve</text><rect x="984" y="334" width="3.63389333333339" height="27" rx="3" fill="#bf9760"/><text x="1200" y="354" class="val">+0.009</text><text x="725" y="450" class="lab">Recorded correct</text><rect x="984" y="427" width="2.669740000000047" height="27" rx="3" fill="#5d8dac"/><text x="1200" y="447" class="val">+0.007</text><text x="725" y="543" class="lab">Latent naïve</text><rect x="984" y="520" width="243.76297999999997" height="27" rx="3" fill="#bc6a60"/><text x="1200" y="540" class="val">+0.630</text><text x="725" y="636" class="lab">Latent oracle</text><rect x="982.0356946666667" y="613" width="1.9643053333333" height="27" rx="3" fill="#8466a9"/><text x="1200" y="633" class="val">-0.005</text><text x="63" y="766" class="foot">The source's true δ=0 was used only for evaluation. The outcome-selective validation law depends on a hidden residual.</text><text x="63" y="793" class="foot">The naïve positive δ≈0.63–0.66 is a synthetic selection-artifact diagnostic, not evidence of real recorded-gaze MNAR.</text></svg>
