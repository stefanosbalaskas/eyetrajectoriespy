<title id="t">Rank-two actual NUTS: paired and asynchronous computational diagnostics</title>
<desc id="d">Paired dataset worst Rhat 1.00538756, minimum bulk ESS 454.35, zero of 15 functionals failing. Asynchronous worst Rhat 1.01397328, minimum bulk ESS 326.41, six of 15 mean functionals failing. Threshold Rhat 1.01 and bulk ESS 400. Both fits completed with zero divergences.</desc>
