<text x="64" y="657" class="footer">Contributors = 1 / Σ wᵢ² with wᵢ ∝ aᵢ² sᵢ². Known sᵢ and true SE are simulation-only diagnostic quantities.</text><text x="64" y="681" class="footer">Original R76 source summary; independently reproduced by R76-A. Trends do not isolate a pure causal anchor effect.</text></svg>
