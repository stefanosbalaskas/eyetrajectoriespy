<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="700" viewBox="0 0 1300 700" role="img" aria-labelledby="title desc">
<title id="title">R76 analytic slope-variance concentration and source-specific HC3 standard-error lower-tail ratios</title><desc id="desc">At 2,4,8,16 independent extreme predictor anchors, effective slope-variance contributors increase from 2.40 to 16.30 in curves, and 2.19 to 16.09 in participants. Tenth percentile of source-wise HC3/true SE increases from 0.43 to 0.79 curves and 0.51 to 0.84 participants.</desc>
<rect width="1300" height="700" fill="#ffffff"/>
