text class="tick" text-anchor="middle" x="1211" y="579">1.00</text><text class="subtitle" x="67" y="643">Time t is normalized from 0 to 1. Trial AR(1) correlation between consecutive time points remains 0.72 before spatial mixing.</text><text class="subtitle" x="67" y="674">Repeated-trial participant latent coordinate correlation is fixed at 0.45, different from the time-varying trial component.</text><text class="foot" x="67" y="711">Temporal dependence plus q(t)-varying coordinate mixing yield a nonseparable covariance structure without non-Gaussianity or missing gaze.</text></svg>
