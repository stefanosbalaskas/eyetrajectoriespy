<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="735" viewBox="0 0 1340 735" role="img" aria-labelledby="title desc"><title id="title">R79 nonseparable Gaussian generating covariance assumptions</title><desc id="desc">Two original analytic source-law panels. Within-time Gaussian coordinate correlation rises from 0.15 through 0.475 to 0.80, while trial innovation SD rises from 0.028 through 0.040 to 0.052. Participant latent coordinate correlation fixed 0.45; trial temporal AR1 base rho 0.72.</desc><rect width="1340" height="735" fill="#fff"/><style>text{font-family:Inter,Arial,sans-serif;fill:#1e3445}.heading{font-size:30px;font-weight:750}.subtitle{font-size:17px;fill:#526c7b}.panel{font-size:19px;font-weight:700}.tick{font-size:14px;fill:#58707d}.value{font-size:15px;font-weight:700}.foot{font-size:13px;fill:#58707d}</style><text x="62" y="59" class="heading">What changed in the R79 Gaussian source law?</text><text x="62" y="91" class="subtitle">Frozen before outcomes · 31 time points · Gaussian joint law known only to the simulator</text><rect x="63" y="136" width="577" height="467" rx="14" fill="#f7fafb" stroke="#e1e8ec"/><text x="86" y="178" class="panel">Within-trial cross-coordinate correlation</text><line x1="143" y1="550" x2="588" y2="550" stroke="#dce6e9"/><text class="tick" x="130" y="556" text-anchor="end">0.00</text><line x1="143" y1="463" x2="588" y2="463" stroke="#dce6e9"/><text class="tick" x="130" y="469" text-anchor="end">0.25</text><line x1="143" y1="376" x2="588" y2="376" stroke="#dce6e9"/><text class="tick" x="130" y="382" text-anchor="end">0.50</text><line x1="143" y1="289" x2="588" y2="289" stroke="#dce6e9"/><text class="tick" x="130" y="295" text-anchor="end">0.75</text><line x1="143" y1="202" x2="588" y2="202" stroke="#dce6e9"/><text class="tick" x="130" y="208" text-anchor="end">1.00</text><polyline points="143,497.8 157.83333333333334,490.26 172.66666666666666,482.72 187.5,475.18 202.33333333333334,467.64 217.16666666666666,460