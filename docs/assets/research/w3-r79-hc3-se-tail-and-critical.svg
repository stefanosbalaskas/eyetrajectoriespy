<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="733" viewBox="0 0 1340 733" role="img" aria-labelledby="title desc"><title id="title">R79 nonseparable covariance lower-tail standard error ratios and Gaussian maximum critical</title><desc id="desc">Under predictor-dependent heteroskedasticity and two extreme source units, curve 10th percentile estimated-to-true SE ratios .460 .583 .651, participants .509 .542 .567 for HC3, lambda .25 and lambda .50. Estimated max criticals curves 2.711 2.949 3.067, participants 2.255 2.829 2.998.</desc><rect width="1340" height="733" fill="white"/><style>text{font-family:Inter,Arial,sans-serif;fill:#1e3444}.heading{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#526b77}.panel{font-size:18px;font-weight:700}.tick{font-size:14px;fill:#536e7a}.val{font-size:16px;font-weight:700}.foot{font-size:14px;fill:#546d78}</style><text x="67" y="57" class="heading">Estimated marginal uncertainty and Gaussian maximum criticals</text><text x="67" y="88" class="sub">R79 · two extreme units, predictor-dependent variance · 32 new independent source blocks per design</text><rect x="64" y="143" width="575" height="458" rx="14" fill="#f7fafb" stroke="#dfe8ea"/><text x="82" y="179" class="panel">Mean source-wise 10th-percentile HC3/true SE</text><line x1="140" y1="538" x2="595" y2="538" stroke="#dce6eb"/><text x="128" y="543" text-anchor="end" class="tick">0.00</text><line x1="140" y1="457.75" x2="595" y2="457.75" stroke="#dce6eb"/><text x="128" y="462.75" text-anchor="end" class="tick">0.21</text><line x1="140" y1="377.5" x2="595" y2="377.5" stroke="#dce6eb"/><text x="128" y="382.5" text-anchor="end" class="tick">0.42</text><line x1="140" y1="297.25" x2="595" y2="297.25" stroke="#dce6eb"/><text x="128" y="302.25" text-anchor="end" class="tick">0.64</text><line x1="140" y1="217" x2="595" y2="217" stroke="#dce6eb"/><text x="128" y="222" text-anchor="end" class="tick">0.85</text><polyline points="140,364.1222842141176 367.5,317.93350939