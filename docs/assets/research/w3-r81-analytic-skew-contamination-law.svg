<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="721" viewBox="0 0 1350 721" role="img" aria-labelledby="title desc"><title id="title">R81 rare asymmetric centered Bernoulli event and its known variance contribution</title><desc id="desc">Analytic R81 source law. On a rare unit contamination Bernoulli event probability .08, added shock is .16(.92)(.75+.25t) times signed vector 1 and minus .65. Normalized known marginal variance adds .16 squared times .08 times .92 times the functional squared shock profile. Four curves show fraction of total true variance for the two gaze coordinates in independent curves and repeated participants.</desc><rect width="1350" height="721" fill="white"/><style>text{font-family:Inter,Arial,sans-serif;fill:#1b3445}.head{font-size:29px;font-weight:750}.sub{font-size:16px;fill:#55707e}.panel{font-size:17px;font-weight:750}.tick{font-size:14px;fill:#576f7a}.foot{font-size:13px;fill:#596d7b}.legend{font-size:16px;font-weight:700}</style><text class="head" x="58" y="57">A rare asymmetric whole-unit shock changes the joint source law</text><text class="sub" x="58" y="88">R81 analytic generating mechanism · Bernoulli event p=.08, amplitude .16 · mean-zero shock shared over all times and coordinates</text><rect x="56" y="143" width="587" height="463" rx="13" fill="#f7fafb" stroke="#dfe8eb"/><text class="panel" x="71" y="176">Centered contamination after a rare unit event</text><line x1="149" y1="554" x2="603" y2="554" stroke="#dae6eb"/><text x="138" y="559" class="tick" text-anchor="end">-0.11</text><line x1="149" y1="470.25" x2="603" y2="470.25" stroke="#dae6eb"/><text x="138" y="475.25" class="tick" text-anchor="end">-0.04</text><line x1="149" y1="386.5" x2="603" y2="386.5" stroke="#dae6eb"/><text x="138" y="391.5" class="tick" text-anchor="end">0.03</text><line x1="149" y1="302.75" x2="603" y2="302.75" stroke="#dae6eb"/><text x="138" y="307.75" class="tick" text-anchor="end">0.09</text><line x1="149" y1="219" x2="603" y2="219" stro