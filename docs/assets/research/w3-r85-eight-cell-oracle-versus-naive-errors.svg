<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1010" viewBox="0 0 1360 1010" role="img" aria-labelledby="title desc"><title id="title">R85 all eight source conditions show naive latent outcome selective validation distortions versus simulator-only correctly weighted oracle</title><desc id="desc">Eight source design/support/variance cells, n32 independent primitive blocks each. Mean absolute error latent outcome biased external validation with naive versus simulator-known oracle weights respectively: curve two constant .6333 .1301; curve two hetero .5708 .1251; curve sixteen constant .6081 .1339; curve sixteen hetero .461 .1635; participants two constant .5336 .1048; participants two hetero .4288 .1497; participants sixteen constant .4811 .1339; participants sixteen hetero .3197 .2267. No inferential uncertainty.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#1c3647}.head{font-size:31px;font-weight:760}.sub{font-size:16px;fill:#577280}.lab{font-size:17px;font-weight:730}.small{font-size:14px;fill:#57717e}.val{font-size:15px;font-weight:745}.foot{font-size:13px;fill:#5a7480}</style><rect width="1360" height="1010" fill="white"/><text class="head" x="60" y="62">R85: selection into validation can dominate parameter error</text><text class="sub" x="60" y="94">MNAR true δ=1.1 · mean absolute |fitted δ − truth| · 32 independent blocks in each of eight original cells</text><rect x="61" y="156" width="1230" height="92" rx="10" fill="#fafbfc"/><text x="81" y="186" class="lab">Curves · 2 anchors · constant</text><text x="416" y="209" class="small">Naïve</text><rect x="520" y="194" width="613.3962857142857" height="19" rx="3" fill="#c27061"/><text x="1144.3962857142856" y="209" class="val">0.633</text><text x="416" y="236" class="small">Oracle</text><rect x="520" y="221" width="126.01114285714286" height="19" rx="3" fill="#468e8b"/><text x="657.0111428571429" y="236" class="val">0.130</text><rect x="61" y="255" width="1230" height="92" rx="10" fill="#f5f8fa"/><text x="81" y="285" class="lab">Curves · 2 anchors · heteroskedastic</text><text x="416" y="308" class="small">Naïve</text><rect x="520" y="293" width="552.8605714285715" height="19" rx="3" fill="#c27061"/><text x="1083.8605714285713" y="308" class="val">0.571</text><text x="416" y="335" class="small">Oracle</text><rect x="520" y="320" width="121.16828571428572" height="19" rx="3" fill="#468e8b"/><text x="652.1682857142857" y="335" class="val">0.125</text><rect x="61" y="354" width="1230" height="92" rx="10" fill="#fafbfc"/><text x="81" y="384" class="lab">Curves · 16 anchors · constant</text><text x="416" y="407" class="small">Naïve</text><rect x="520" y="392" width="588.9882857142857" height="19" rx="3" fill="#c27061"/><text x="1119.9882857142857" y="407" class="val">0.608</text><text x="416" y="434" class="small">Oracle</text><rect x="520" y="419" width="129.69171428571428" height="19" rx="3" fill="#468e8b"/><text x="660.6917142857143" y="434" class="val">0.134</text><rect x="61" y="453" width="1230" height="92" rx="10" fill="#f5f8fa"/><text x="81" y="483" class="lab">Curves · 16 anchors · heteroskedastic</text><text x="416" y="506" class="small">Naïve</text><rect x="520" y="491" width="446.5114285714286" height="19" rx="3" fill="#c27061"/><text x="977.5114285714286" y="506" class="val">0.461</text><text x="416" y="533" class="small">Oracle</text><rect x="520" y="518" width="158.3614285714286" height="19" rx="3" fill="#468e8b"/><text x="689.3614285714286" y="533" class="val">0.164</text><rect x="61" y="552" width="1230" height="92" rx="10" fill="#fafbfc"/><text x="81" y="582" class="lab">Participants · 2 anchors · constant</text><text x="416" y="605" class="small">Naïve</text><rect x="520" y="590" width="516.8297142857143" height="19" rx="3" fill="#c27061"/><text x="1047.8297142857143" y="605" class="val">0.534</text><text x="416" y="632" class="small">Oracle</text><rect x="520" y="617" width="101.50628571428572" height="19" rx="3" fill="#468e8b"/><text 