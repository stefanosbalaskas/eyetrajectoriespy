<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="550" viewBox="0 0 1030 550" role="img" aria-labelledby="t d">
<title id="t">R42 eight fresh Gaussian block numerical optimizer comparison</title>
<desc id="d">A frozen complete 192-start Gaussian nuisance optimization design using eight new independent generating blocks. Original linear baseline: 189 of 192 near-best likelihood and 175 of 192 passing KKT at 0.001. Stricter L-BFGS-B: 192 of 192 on both. Independent SLSQP: 192 of 192 near-best and 190 of 192 passing KKT. Three baseline inferior-likelihood cases and two SLSQP KKT exceptions retained.</desc>
<rect width="1030" height="550" fill="#fff"/>
