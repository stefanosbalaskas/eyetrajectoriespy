<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t desc">
<title id="t">R50 original independent Gaussian pointwise truth inclusion and mean interval half-width</title>
<desc id="desc">Twenty-four independently generated Gaussian blocks, paired ordinary and extreme predictor leverage. For ordinary leverage, generating oracle 22/24 width .07187, fitted covariance 22/24 width .07284, nuisance-refit bootstrap-t first31 21/24 width .06878, all63 21/24 width .07241, wrong covariance 22/24 width .07123. For extreme leverage, oracle 24/24 width .09726, fitted 21/24 width .09363, refit 31 19/24 width .06806, refit63 21/24 width .07038, wrong family 21/24 width .06466. Independent original evidence SHA256 verified and postprocessing audit passed; none establishes calibrated nominal 90 percent coverage.</desc>
