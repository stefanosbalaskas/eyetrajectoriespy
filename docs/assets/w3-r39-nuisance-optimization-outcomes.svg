<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc">
<title id="title">R39 nuisance parameterization: numerical solution agreement</title>
<desc id="desc">Of sixty fixed-slope nuisance fits per method, raw log variances had fifty-four near-best and six suboptimal converged fits; centered log had fifty-eight near-best and two nonconvergences; raw linear had sixty near-best; centered linear fifty-eight near-best and two nonconvergences. Same original data source reused; numerical comparison, not statistical replication.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f303b}.heading{font-size:24px;font-weight:700}.sub{font-size:15px;fill:#566775}.label{font-size:16px}.counts{font-size:17px;font-weight:700}.small{font-size:13px;fill:#55616b}</style>
<rect x="0" y="0" width="1040" height="480" fill="#fff"/>
<text x="55" y="50" class="heading">R39 — same likelihood, different optimization outcomes</text>
<text x="55" y="76" class="sub">Convergence and objective agreement, 60 prespecified fits per formulation</text>
<text x="250" y="144" text-anchor="end" class="label">Log variance · raw</text>
 <rect x="265" y="120" width="522" height="34" fill="#31755c" rx="3"/>
