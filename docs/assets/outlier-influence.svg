<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-label="Illustrative FPCA review diagnostic scatter">
<rect width="820" height="500" fill="white"/>
<text x="410" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="600" fill="#0f172a">Illustrative FPCA review diagnostics</text>
<line x1="90" y1="420" x2="760" y2="420" stroke="#475569" stroke-width="1.5"/>
<line x1="90" y1="420" x2="90" y2="70" stroke="#475569" stroke-width="1.5"/>
<line x1="520" y1="70" x2="520" y2="420" stroke="#64748b" stroke-dasharray="7 6"/>
<line x1="90" y1="170" x2="760" y2="170" stroke="#64748b" stroke-dasharray="7 6"/>
<text x="525" y="445" font-family="sans-serif" font-size="12" fill="#475569">reconstruction review threshold</text>
<text x="100" y="160" font-family="sans-serif" font-size="12" fill="#475569">score-space review threshold</text>
<g fill="#4f46e5" opacity=".55">
<circle cx="190" cy="340" r="7"/><circle cx="250" cy="315" r="7"/><circle cx="310" cy="360" r="7"/>
<circle cx="355" cy="290" r="7"/><circle cx="400" cy="330" r="7"/><circle cx="445" cy="275" r="7"/>
<circle cx="285" cy="250" r="7"/><circle cx="370" cy="230" r="7"/><circle cx="460" cy="205" r="7"/>
</g>
<circle cx="675" cy="110" r="11" fill="#14b8a6"/>
<text x="690" y="105" font-family="sans-serif" font-size="13" fill="#0f766e">review</text>
<text x="410" y="480" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">reconstruction robust z</text>
<text x="25" y="250" transform="rotate(-90 25 250)" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">squared Mahalanobis distance</text>
<text x="610" y="390" font-family="sans-serif" font-size="12" fill="#334155">flag ≠ exclude</text>
</svg>