<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="764" viewBox="0 0 1150 764" role="img" aria-labelledby="t d"><title id="t">R51 Gaussian bootstrap narrowing: paired fixed/refit studentization and fitted/oracle generation</title><desc id="d">Eight new independent Gaussian primitive blocks paired ordinary and extreme predictor supports. Ordinary mean half-width for oracle conditional, fitted conditional, fitted-generation fixed nuisance, fitted-generation refit nuisance, oracle-generation refit diagnostic: .06941, .06991, .06905, .06904, .06924. Extreme: .08627, .08533, .05872, .05974, .06075. In extreme support, fitted-generation refitted bootstrap critical / fixed bootstrap critical median 1.0072; fitted-generation refitted bootstrap critical / fitted conditional Satterthwaite critical median .7665. Only one of 4064 optimizer starts exceeded strict KKT .001, paired accepted start passed; zero fit refusals. Pointwise 90% coverage not qualified.</desc><rect width="1150" height="764" fill="white"/><text x="36" y="51" font-family="Arial,sans-serif" font-weight="700" font-size="26" fill="#233947">R51 · Why do bootstrap-t intervals narrow?</text><text x="36" y="83" font-family="Arial,sans-serif" font-size="16" fill="#607482">Mean pointwise interval half-width · independent n = 8 primitive blocks per leverage condition</text><text x="38" y="137" font-family="Arial,sans-serif" font-weight="700" font-size="18" fill="#253947">Ordinary leverage</text><text x="421" y="137" font-family="Arial,sans-serif" font-size="13" fill="#627782">0</text><text x="907" y="137" font-family="Arial,sans-serif" font-size="13" fill="#627782">0.10</text><text x="1040" y="137" font-family="Arial,sans-serif" font-size="13" fill="#627782">Hits</text><text x="38" y="387" font-family="Arial,sans-serif" font-weight="700" font-size="18" fill="#253947">Extreme leverage</text><text x="404" y="174" text-anchor="end" font-size="15" fill="#253947">Known-covariance oracle CR2</text><rect x="422" y="