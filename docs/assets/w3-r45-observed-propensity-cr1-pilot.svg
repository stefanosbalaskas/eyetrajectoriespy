<text x="52" y="582" class="fine">¹ Number of 90% CR1 intervals containing truth out of 96 paired source variants; NOT verified nominal coverage.</text>
<text x="52" y="607" class="fine">Only MAR uses fitted logistic propensity IPW; design-IPW is a simulation-only known-propensity benchmark.</text>
<text x="52" y="632" class="fine">MNAR and latent whole-participant selection remain unadjusted: no identified outcome-based propensity.</text>
