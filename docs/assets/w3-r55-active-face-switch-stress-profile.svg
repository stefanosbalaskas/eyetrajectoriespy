<text x="47" y="409" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#2b4554">Median absolute error of original local CR2 pivot prediction</text>
<text x="47" y="443" font-family="Arial,sans-serif" font-size="14" fill="#60788a">Logarithmic vertical scale; error measured against full four-component REML refits</text>
