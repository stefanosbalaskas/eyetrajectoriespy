<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="730" viewBox="0 0 1120 730" role="img" aria-labelledby="t d">
<title id="t">R55 Gaussian REML fitted covariance active-set changes and local CR2 pivot prediction errors</title>
<desc id="d">Eight reused R53 Gaussian source cases from four independent primitive blocks with paired ordinary and extreme predictor leverage. Two directions per case, both signs, four fixed perturbation amplitudes .0005 .005 .05 .25 times original weighted-response RMS; 128 of 128 accepted Gaussian nuisance refits. Ordinary active-face changed counts per 16 signed fits: 0,0,1,2; extreme 0,0,1,3. Five of 32 directional sign paths showed face change on sampled grid. Median absolute source-true-centered CR2 studentized local prediction errors ordinary: 8.64e-8,8.67e-6,.000898,.02382; extreme: 1.56e-7,1.17e-5,.001308,.02492. Independent original Gaussian source count added zero; no population transition probability or confidence interval qualification.</desc>
<rect width="1120" height="730" fill="#fff"/>
<text x="45" y="52" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#243c4b">R55 · When do constrained covariance faces change?</text>
<text x="45" y="84" font-family="Arial,sans-serif" font-size="16" fill="#637989">Fixed perturbation grid · R53 source replay, not new independent Gaussian observations</text>
<rect x="48" y="117" width="14" height="14" fill="#437d72" rx="2"/><text x="68" y="130" font-family="Arial,sans-serif" font-size="15" fill="#405768">Ordinary leverage</text>
<rect x="247" y="117" width="14" height="14" fill="#ab7660" rx="2"/><text x="268" y="130" font-family="Arial,sans-serif" font-size="15" fill="#405768">Extreme leverage</text>
<text x="47" y="184" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#2b4554">Selected active-face changes per 16 signed refits</text>
<line x1="315" y1="290" x2="1040" y2="290" stroke="#aebcc2"/>
<text x="47" y="256" font-family="Arial,sans-serif" font-size="15" fill="#586f7d">Changed face</text>
