<text x="680" y="650" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#60788a">Relative weighted-response perturbation</text>
<text x="365" y="636" text-anchor="middle" font-size="14" fill="#566e7d">0.0005</text><text x="545" y="636" text-anchor="middle" font-size="14" fill="#566e7d">0.005</text><text x="725" y="636" text-anchor="middle" font-size="14" fill="#566e7d">0.05</text><text x="905" y="636" text-anchor="middle" font-size="14" fill="#566e7d">0.25</text>
<line x1="45" y1="672" x2="1040" y2="672" stroke="#dce3e7"/>
<text x="47" y="696" font-family="Arial,sans-serif" font-size="14" fill="#627b89">All 128 perturbed fits accepted; five directional sign paths had observed face changes at sampled levels.</text>
<text x="47" y="718" font-family="Arial,sans-serif" font-size="13" fill="#627b89">Neither grid transitions nor small-step numerical accuracy establish 90% confidence-interval coverage or true zero-variance inference.</text>
