<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="706" viewBox="0 0 1120 706" role="img" aria-labelledby="title desc">
<title id="title">R57 structural zero versus nonnegative random-slope Gaussian REML nested likelihood feasibility</title>
<desc id="desc">Eight independent primitive Gaussian blocks with ordinary and extreme leverage paired and true-zero and positive source slope paired. Exact structural zero null and nonnegative alternative: all 32 original source comparisons and 64 model fits numerically accepted. Alternative fit selected true zero slope variance in 6/8 ordinary true zero, 2/8 ordinary true positive, 2/8 extreme true zero, and 3/8 extreme true positive cases. Descriptive median nonnegative twice negative log likelihood gap: 0, 0.289, 0.587, 1.022 respectively. These are not calibrated likelihood ratio tests, rejection rates, p-values, Type I error or power.</desc>
