<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="715" viewBox="0 0 1120 715" role="img" aria-labelledby="ttl desc"><title id="ttl">R95 exact monotone audit return sharp interval width by nonresponse fraction</title><desc id="desc">For invited nonresponse 0.1 percent, 1 percent, and 5 percent, unknown direction gives widths 0.001, 0.01, 0.05. Known direction gives half those widths. An upper response ratio capped by one plus the nonresponse fraction gives widths 0.000249875, 0.002487562, 0.012195122. Equal response gives singleton point identification under that assumption. All values are algebraic, not frequentist uncertainty.</desc><rect width="1120" height="715" fill="white"/><text x="32" y="49" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#233449">Sharp-set width across completion regimes</text><text x="32" y="81" font-family="system-ui,sans-serif" font-size="17" fill="#5b6f83">External directional assumptions; no statistical confidence intervals</text><text x="35" y="131" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#2b3d4f">Invited nonreturn 0.1%</text><text x="35" y="168" font-family="system-ui,sans-serif" font-size="16" fill="#304459">Unknown direction</text><rect x="274" y="154" width="11.3" height="18" rx="2" fill="#35506b"/><text x="295.3" y="168" font-family="system-ui,sans-serif" font-size="15" fill="#42586a">0.001000</text><text x="35" y="200" font-family="system-ui,sans-serif" font-size="16" fill="#304459">Known direction</text><rect x="274" y="186" width="5.65" height="18" rx="2" fill="#5280a2"/><text x="289.65" y="200" font-family="system-ui,sans-serif" font-size="15" fill="#42586a">0.000500</text><text x="35" y="232" font-family="system-ui,sans-serif" font-size="16" fill="#304459">Known sign + ratio cap</text><rect x="274" y="218" width="2.823588205897052" height="18" rx="2" fill="#94b3c7"/><text x="289" y="232" font-family="system-ui,sans-serif" font-size="15" fill="#42586a">0.000250</text><text x="35" y="264" font-family="system-ui,sans-serif" font-size="16" fill="#304459">Equal return</text><circle cx="274" cy="259" r="5" fill="#c2cbd4" stroke="#6d7f8a"/><text x="289" y="264" font-family="system-ui,sans-serif" font-size="15" fill="#42586a">0.000000</text><text x="35" y="309" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#2b3d4f">Invited nonreturn 1.0%</text><text x="35" y="346" font-family="system-ui,sans-serif" font-size="16" fill="#304459">Unknown direction</text><rect x="274" y="332" width="113" height="18" rx="2" fill="#35506b"/><text x="397" y="346" font-family="system-ui,sans-serif" font-size="15" fill="#42586a">0.010000</text><text x="35" y="378" font-family="system-ui,sans-serif" font-size="16" fill="#304459">Known direction</text><rect x="274" y="364" width="56.5" height="18" rx="2" fill="#5280a2"/><text x="340.5" y="378" font-family="system-ui,sans-serif" font-size="15" fill="#42586a">0.005000</text><text x="35" y="410" font-family="system-ui,sans-serif" font-size="16" fill="#304459">Known sign + ratio cap</text><rect x="274" y="396" width="28.109452736318413" height="18" rx="2" fill="#94b3c7"/><text x="312.1094527363184" y="410" font-family="system-ui,sans-serif" font-size="15" fill="#42586a">0.002488</text><text x="35" y="442" font-family="system-ui,sans-serif" font-size="16" fill="#304459">Equal return</text><circle cx="274" cy="437" r="5" fill="#c2cbd4" stroke="#6d7f8a"/><text x="289" y="442" font-family="system-ui,sans-serif" font-size="15" fill="#42586a">0.000000</text><text x="35" y="487" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#2b3d4f">Invited nonreturn 5.0%</text><text x="35" y="524" font-family="system-ui,sans-serif" font-size="16" fill="#304459">Unknown direction</text><rect x="274" y="510" width="565" height="18" rx="2" fill="#35506b"/><text x="849" y="524" font-family="system-ui,sans-serif" font-size="15" fill="#42586a">0.050000</text><text x="35" y="556" font-family="system-ui,sans-serif" font-size="16" fill="#304459">Known direction</text><rect x="274" y="542" width="282.5" height="18" rx="2" fill="#5280a2"/><text x="566.5" y="556" font-family="system-ui,sans-serif" font-size="15" fill="#42586a">0.025000</text><text x="35" y="588" font-family="system-ui,sans-serif" font-size="16" fill="#304459">Known sign + ratio cap</text><rect x="274" y="574" width="137.8048780487805" height="18" rx="2" fill="#94b3c7"/><text x="421.8048780487805" y="588" font-family="system-ui,sans-serif" font-size="15" fill="#42586a">0.012195</text><text x="35" y="620" font-family="system-ui,sans-serif" font-size="16" fill="#304459">Equal return</text><circle cx="274" cy="615" r="5" fill="#c2cbd4" stroke="#6d7f8a"/><text x="289" y="620" font-family="system-ui,sans-serif" font-size="15" fill="#42586a">0.000000</text><text x="35" y="689" font-family="system-ui,sans-serif" font-size="15" fill="#718096">Source: R95 exact fractions; 54 deterministic design cases, not independent data sets.</text></svg>