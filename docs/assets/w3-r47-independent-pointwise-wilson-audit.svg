<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="635" viewBox="0 0 1040 635" role="img" aria-labelledby="title desc">
<title id="title">R47 independent-source empirical 90% pointwise truth inclusion and Wilson Monte Carlo limits</title>
<desc id="desc">256 independent Gaussian source blocks, n24, ordinary predictor support and positive generating participant random slope. Observed truth inclusion counts: complete naive 222, matched MAR naive 223, matched fixed IPW CR1 225, matched propensity-refit bootstrap 219; weak overlap naive 203, weak fixed IPW 202, weak bootstrap 217, all out of 256. Horizontal 95 percent Wilson Monte Carlo intervals, vertical reference at nominal 90 percent. The matched and weak bootstrap Wilson intervals exclude nominal 90; all weak intervals exclude 90. The study does not validate covariance-estimation-aware CR2 or simultaneous bands.</desc>
