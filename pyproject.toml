[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eyetrajectoriespy"
version = "0.32.0.dev0"
description = "Functional and continuous trajectory analysis for eye-tracking data in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Stefanos Balaskas"}]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "statsmodels>=0.14",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = ["eye-tracking", "gaze", "functional-data-analysis", "FPCA", "MFPCA", "trajectory-analysis", "curve-registration", "recurrence-analysis", "nonlinear-dynamics"]

[project.optional-dependencies]
fda = ["scikit-fda>=0.10.1,<0.11", "multimethod>=1.12,<2"]
sparse = ["FDApy>=1.0.3,<1.1; python_version < '3.13'"]
elastic = ["fdasrsf>=2.7"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.7.7,<10", "mkdocstrings[python]>=0.27", "PyYAML>=6.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "build>=1.2", "twine>=6"]
all = ["scikit-fda>=0.10.1,<0.11", "multimethod>=1.12,<2", "FDApy>=1.0.3,<1.1; python_version < '3.13'", "fdasrsf>=2.7"]

[project.urls]
Homepage = "https://stefanosbalaskas.github.io/eyetrajectoriespy/"
Repository = "https://github.com/stefanosbalaskas/eyetrajectoriespy"
Documentation = "https://stefanosbalaskas.github.io/eyetrajectoriespy/"
Issues = "https://github.com/stefanosbalaskas/eyetrajectoriespy/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eyetrajectoriespy = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["eyetrajectoriespy"]
omit = ["src/eyetrajectoriespy/elastic.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
